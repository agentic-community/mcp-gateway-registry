<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1b1b1f;
    --muted: #5c6370;
    --rule: #e3e5e9;
    --code-bg: #f5f6f8;
    --code-fg: #22863a;
    --pre-bg: #1f2330;
    --pre-fg: #e6e8ee;
    --link: #0a5fd4;
    --accent: #b3271e;
    --note-bg: #fbf7e8;
    --note-rule: #d9c88a;
    --badge-100: #1a7f5a;
    --badge-200: #8a5a00;
    --badge-300: #8c2f6b;
    --diagram-fill: #f0f2f6;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171c;
      --fg: #e4e6eb;
      --muted: #9aa1ad;
      --rule: #2b2f38;
      --code-bg: #22262f;
      --code-fg: #7ee29a;
      --pre-bg: #0f1116;
      --pre-fg: #e6e8ee;
      --link: #6aa9ff;
      --accent: #ff7b72;
      --note-bg: #22201a;
      --note-rule: #5c5231;
      --badge-100: #5ed6a4;
      --badge-200: #e8b964;
      --badge-300: #e58fc4;
      --diagram-fill: #1d2129;
    }
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

  body {
    margin: 0;
    padding: 3rem 1.25rem 6rem;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.65;
  }

  main { max-width: 46rem; margin: 0 auto; }

  h1 {
    font-size: 1.95rem;
    line-height: 1.2;
    letter-spacing: -0.02em;
    margin: 0 0 0.5rem;
  }

  h2 {
    font-size: 1.3rem;
    line-height: 1.3;
    letter-spacing: -0.01em;
    margin: 3rem 0 0.75rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--rule);
  }

  h3 {
    font-size: 1.06rem;
    line-height: 1.35;
    margin: 2rem 0 0.6rem;
  }

  p, ul, ol { margin: 0 0 1.1rem; }

  .byline {
    color: var(--muted);
    font-size: 0.9rem;
    font-style: italic;
    margin-bottom: 1.75rem;
  }

  .byline a { color: var(--muted); }

  a { color: var(--link); text-decoration: none; border-bottom: 1px solid transparent; }
  a:hover { border-bottom-color: currentColor; }

  code {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
                 "Liberation Mono", monospace;
    font-size: 0.86em;
    background: var(--code-bg);
    color: var(--code-fg);
    padding: 0.12em 0.36em;
    border-radius: 4px;
    word-break: break-word;
  }

  a code { color: var(--link); background: var(--code-bg); }

  pre {
    background: var(--pre-bg);
    color: var(--pre-fg);
    padding: 1rem 1.15rem;
    border-radius: 7px;
    overflow-x: auto;
    margin: 0 0 1.3rem;
    font-size: 0.86rem;
    line-height: 1.55;
  }

  pre code {
    background: none;
    color: inherit;
    padding: 0;
    font-size: 1em;
    word-break: normal;
  }

  strong { font-weight: 650; }

  li { margin-bottom: 0.4rem; }

  /* Level navigation */
  nav.levels {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin: 0 0 2.25rem;
    padding: 0.85rem 0;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
  }

  nav.levels a {
    font-size: 0.82rem;
    font-weight: 600;
    padding: 0.3rem 0.65rem;
    border: 1px solid var(--rule);
    border-radius: 999px;
    color: var(--muted);
  }

  nav.levels a:hover { color: var(--fg); border-color: var(--muted); }

  .level-badge {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.14em 0.5em;
    border-radius: 4px;
    border: 1px solid currentColor;
    vertical-align: 0.22em;
    margin-right: 0.5rem;
  }

  .l100 { color: var(--badge-100); }
  .l200 { color: var(--badge-200); }
  .l300 { color: var(--badge-300); }

  .level-intro {
    color: var(--muted);
    font-size: 0.92rem;
    margin: -0.35rem 0 1.4rem;
  }

  /* Callouts */
  .callout {
    background: var(--note-bg);
    border: 1px solid var(--note-rule);
    border-left-width: 3px;
    border-radius: 0 6px 6px 0;
    padding: 0.9rem 1.1rem;
    margin: 0 0 1.3rem;
  }

  .callout p:last-child { margin-bottom: 0; }

  .callout-label {
    display: block;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.35rem;
  }

  /* Diagrams */
  figure {
    margin: 0 0 1.5rem;
    padding: 0;
  }

  figure svg {
    display: block;
    width: 100%;
    height: auto;
    max-width: 100%;
  }

  figcaption {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 0.5rem;
  }

  svg text {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    fill: var(--fg);
  }

  svg .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
  }

  svg .box { fill: var(--diagram-fill); stroke: var(--rule); stroke-width: 1.5; }
  svg .flow { stroke: var(--muted); stroke-width: 1.5; fill: none; }
  svg .bad { stroke: var(--accent); stroke-width: 2; fill: none; }
  svg .bad-text { fill: var(--accent); font-weight: 600; }
  svg .label { fill: var(--muted); font-size: 12px; }

  /* Tables */
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 0 0 1.4rem;
    font-size: 0.92rem;
  }

  th, td {
    text-align: left;
    padding: 0.5rem 0.7rem;
    border-bottom: 1px solid var(--rule);
    vertical-align: top;
  }

  th {
    font-size: 0.76rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  footer {
    margin-top: 3.5rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--rule);
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<main>

  <h1>{{TITLE}}</h1>

  <p class="byline">{{BYLINE}}</p>

  <nav class="levels">
    <a href="#level-100">100 &middot; What and why</a>
    <a href="#level-200">200 &middot; How it works</a>
    <a href="#level-300">300 &middot; Deep dive</a>
  </nav>

{{BODY}}

  <footer>{{FOOTER}}</footer>

</main>
</body>
</html>
