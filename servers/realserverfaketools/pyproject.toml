[project]
name = "real-server-fake-tools-mcp"
version = "0.1.0"
description = "MCP server with fake tools that take different parameter types"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "certifi>=2026.10.19",
    "fastmcp>=2.0.0",
    "pydantic>=2.11.3",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
# Local-only project - never resolve from PyPI
package = false
# Bumping certifi exclusion date to bypass 7-day window due to eMudhra certificate compromise
exclude-newer-package = { certifi = "2026-10-22T00:00:00Z" }
