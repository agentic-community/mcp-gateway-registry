name: Lua Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'docker/lua/**'
      - 'tests/lua/**'
      - '.github/workflows/lua-test.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'docker/lua/**'
      - 'tests/lua/**'
      - '.github/workflows/lua-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lua-test:
    name: "Lua unit tests (OpenResty LuaJIT)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: openresty/openresty:alpine
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Lua syntax and run all unit tests
        shell: sh
        env:
          # Point LuaJIT at OpenResty's bundled lua-cjson.
          LUA_CPATH: "/usr/local/openresty/lualib/?.so;;"
          LUA_PATH: "/usr/local/openresty/lualib/?.lua;;"
        run: |
          set -eu
          found_source=false
          for source in docker/lua/*.lua; do
            [ -f "$source" ] || continue
            found_source=true
            echo "Syntax: $source"
            /usr/local/openresty/luajit/bin/luajit -b "$source" /dev/null
          done
          [ "$found_source" = true ] || { echo 'No Lua source files found'; exit 1; }

          found_test=false
          for test_file in tests/lua/test_*.lua; do
            [ -f "$test_file" ] || continue
            found_test=true
            echo "Test: $test_file"
            /usr/local/openresty/luajit/bin/luajit "$test_file"
          done
          [ "$found_test" = true ] || { echo 'No Lua tests found'; exit 1; }
