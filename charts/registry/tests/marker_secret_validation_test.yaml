suite: nginx marker secret validation (issue 1939)
templates:
  - secret.yaml
release:
  name: test
  namespace: default
# The registry renders the marker into a quoted nginx string and nginx sends it as
# a header. '$' starts an nginx variable, whitespace and control characters do not
# survive the header round trip, and the auth server cannot compare a non-ASCII
# value, so every registry API request would fail. The chart accepts only
# printable ASCII other than '$' and refuses anything else at render time.
tests:
  - it: rejects a marker containing '$'
    set:
      app:
        secretKey: "test-key-not-for-prod"  # pragma: allowlist secret
      egressAuth:
        markerSecret: "test-marker-$-not-for-prod"  # pragma: allowlist secret
    asserts:
      - failedTemplate:
          errorPattern: "egressAuth.markerSecret must contain only printable ASCII"

  - it: rejects a marker containing inner whitespace
    set:
      app:
        secretKey: "test-key-not-for-prod"  # pragma: allowlist secret
      egressAuth:
        markerSecret: "test-marker not-for-prod"  # pragma: allowlist secret
    asserts:
      - failedTemplate:
          errorPattern: "egressAuth.markerSecret must contain only printable ASCII"

  - it: rejects a marker containing non-ASCII characters
    set:
      app:
        secretKey: "test-key-not-for-prod"  # pragma: allowlist secret
      egressAuth:
        markerSecret: "test-marker-é-not-for-prod"  # pragma: allowlist secret
    asserts:
      - failedTemplate:
          errorPattern: "egressAuth.markerSecret must contain only printable ASCII"

  - it: treats a whitespace-only marker as missing
    set:
      app:
        secretKey: "test-key-not-for-prod"  # pragma: allowlist secret
      egressAuth:
        markerSecret: " \n"
    asserts:
      - failedTemplate:
          errorPattern: "egressAuth.markerSecret is required for standalone deployment"

  - it: trims surrounding whitespace before storing the marker
    set:
      app:
        secretKey: "test-key-not-for-prod"  # pragma: allowlist secret
      egressAuth:
        markerSecret: "  test-marker-not-for-prod\n"  # pragma: allowlist secret
    asserts:
      - equal:
          path: data.AUTH_SERVER_NGINX_MARKER_SECRET
          value: dGVzdC1tYXJrZXItbm90LWZvci1wcm9k  # pragma: allowlist secret
