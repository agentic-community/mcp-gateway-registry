suite: forward-proxy CA bundle (issue #1832)
templates:
  - deployment.yaml
release:
  name: test
  namespace: default
tests:
  - it: renders no volume, no mount and an empty CA path by default
    asserts:
      - isNull:
          path: spec.template.spec.volumes
      - isNull:
          path: spec.template.spec.containers[0].volumeMounts
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EGRESS_FORWARD_PROXY_CA_BUNDLE
            value: ""
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EGRESS_FORWARD_PROXY_ENABLED
            value: "false"

  - it: enabling the flag renders it as true without requiring a CA bundle
    set:
      app:
        egressForwardProxyEnabled: true
      # NO_PROXY must exclude the cloud credential endpoints once the flag is on,
      # enforced by the guard in deployment.yaml. See no_proxy_guard_test.yaml.
      extraEnv:
        - name: NO_PROXY
          value: "localhost,169.254.169.254,169.254.170.2,169.254.170.23"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EGRESS_FORWARD_PROXY_ENABLED
            value: "true"
      - isNull:
          path: spec.template.spec.volumes

  - it: mounts a ConfigMap-sourced bundle read-only and derives the env path
    set:
      caBundle:
        enabled: true
        existingConfigMap: corporate-ca
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].name
          value: egress-forward-proxy-ca
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: corporate-ca
      - equal:
          path: spec.template.spec.volumes[0].configMap.items[0].key
          value: ca-bundle.pem
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: egress-forward-proxy-ca
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /etc/ssl/mcp-gateway
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].readOnly
          value: true
      # The operator never writes the path twice: it is derived from mountPath
      # and key, so the env var and the mount cannot drift apart.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EGRESS_FORWARD_PROXY_CA_BUNDLE
            value: /etc/ssl/mcp-gateway/ca-bundle.pem

  - it: mounts a Secret-sourced bundle for operators who treat the chain as sensitive
    set:
      caBundle:
        enabled: true
        existingSecret: corporate-ca-secret  # pragma: allowlist secret
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: corporate-ca-secret
      - isNull:
          path: spec.template.spec.volumes[0].configMap

  - it: derives the env path from a custom mountPath and key
    set:
      caBundle:
        enabled: true
        existingConfigMap: corporate-ca
        key: corp-root.crt
        mountPath: /custom/certs/
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EGRESS_FORWARD_PROXY_CA_BUNDLE
            value: /custom/certs/corp-root.crt
      - equal:
          path: spec.template.spec.volumes[0].configMap.items[0].path
          value: corp-root.crt

  - it: fails closed when enabled with no source named
    set:
      caBundle:
        enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "neither existingConfigMap nor existingSecret is set"

  - it: fails closed when both sources are named
    set:
      caBundle:
        enabled: true
        existingConfigMap: corporate-ca
        existingSecret: corporate-ca-secret  # pragma: allowlist secret
    asserts:
      - failedTemplate:
          errorPattern: "set exactly ONE of existingConfigMap or existingSecret"

  - it: fails closed on an empty key
    set:
      caBundle:
        enabled: true
        existingConfigMap: corporate-ca
        key: ""
    asserts:
      - failedTemplate:
          errorPattern: "caBundle.key must not be empty"

  - it: fails closed on an empty mountPath
    set:
      caBundle:
        enabled: true
        existingConfigMap: corporate-ca
        mountPath: ""
    asserts:
      - failedTemplate:
          errorPattern: "caBundle.mountPath must not be empty"

  - it: rejects the chart-managed proxy variables in extraEnv
    set:
      extraEnv:
        - name: EGRESS_FORWARD_PROXY_ENABLED
          value: "true"
    asserts:
      - failedTemplate:
          errorPattern: "reserved variable managed by the chart"

  - it: rejects the chart-managed CA bundle variable in extraEnv
    set:
      extraEnv:
        - name: EGRESS_FORWARD_PROXY_CA_BUNDLE
          value: /tmp/evil.pem
    asserts:
      - failedTemplate:
          errorPattern: "reserved variable managed by the chart"

  # HTTP_PROXY / HTTPS_PROXY / NO_PROXY must stay settable: they are standard
  # environment variables, not chart-managed ones. Reserving them would make the
  # chart refuse the very configuration this feature requires.
  - it: allows the standard proxy variables through extraEnv
    set:
      extraEnv:
        - name: HTTPS_PROXY
          value: http://corp-proxy.internal:3128
        - name: HTTP_PROXY
          value: http://corp-proxy.internal:3128
        - name: NO_PROXY
          value: localhost,127.0.0.1,.svc.cluster.local
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HTTPS_PROXY
            value: http://corp-proxy.internal:3128
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NO_PROXY
            value: localhost,127.0.0.1,.svc.cluster.local
