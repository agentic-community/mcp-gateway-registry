suite: standalone registry Keycloak administrator credential
release:
  name: test
  namespace: default
templates:
  - templates/deployment.yaml
tests:
  - it: selects an explicit standalone administrator Secret and key
    set:
      global.authProvider.keycloak.adminExistingSecret: operator-admin
      global.authProvider.keycloak.adminExistingSecretPasswordKey: credential
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KEYCLOAK_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: operator-admin
                key: credential
  - it: omits the administrator credential for another provider
    set:
      global.authProvider.type: entra
      global.authProvider.keycloak.adminExistingSecret: unused-admin
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: KEYCLOAK_ADMIN_PASSWORD
