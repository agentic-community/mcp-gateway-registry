suite: embeddings IdP auth (issue #1415)
templates:
  - deployment.yaml
release:
  name: test
  namespace: default
tests:
  - it: emits no EMBEDDINGS_* env entries when authMode is unset (backwards compatible)
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMBEDDINGS_AUTH_MODE

  - it: emits the IdP env entries when authMode=idp
    set:
      embeddings:
        authMode: idp
        idpTokenEndpoint: https://idp.example.com/oauth2/token
        idpClientId: mcp-embeddings
        idpScope: "api://mcp-embeddings/.default"
        idpTimeoutSeconds: 45
        idpAllowInsecure: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMBEDDINGS_AUTH_MODE
            value: "idp"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMBEDDINGS_IDP_TOKEN_ENDPOINT
            value: https://idp.example.com/oauth2/token
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMBEDDINGS_IDP_CLIENT_ID
            value: mcp-embeddings
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMBEDDINGS_IDP_SCOPE
            value: "api://mcp-embeddings/.default"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMBEDDINGS_IDP_TIMEOUT_SECONDS
            value: "45"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMBEDDINGS_IDP_ALLOW_INSECURE
            value: "false"

  - it: sources EMBEDDINGS_IDP_CLIENT_SECRET from an existing Secret when configured
    set:
      embeddings:
        authMode: idp
        idpTokenEndpoint: https://idp.example.com/oauth2/token
        idpClientId: mcp-embeddings
        idpClientSecretExistingSecret: my-embeddings-secret # pragma: allowlist secret
        idpClientSecretExistingSecretKey: EMBEDDINGS_IDP_CLIENT_SECRET # pragma: allowlist secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMBEDDINGS_IDP_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: my-embeddings-secret
                key: EMBEDDINGS_IDP_CLIENT_SECRET

  - it: omits EMBEDDINGS_IDP_CLIENT_SECRET when no existing Secret is set
    set:
      embeddings:
        authMode: idp
        idpTokenEndpoint: https://idp.example.com/oauth2/token
        idpClientId: mcp-embeddings
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMBEDDINGS_IDP_CLIENT_SECRET

  - it: emits no EMBEDDINGS_RESPONSE_FORMAT when responseFormat is unset
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMBEDDINGS_RESPONSE_FORMAT

  - it: emits EMBEDDINGS_RESPONSE_FORMAT independently of authMode (raw_array with static auth)
    set:
      embeddings:
        responseFormat: raw_array
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMBEDDINGS_RESPONSE_FORMAT
            value: "raw_array"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMBEDDINGS_AUTH_MODE

  - it: emits no EMBEDDINGS_EXTRA_HEADER_* entries when extraHeaders is unset (issue #1819)
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMBEDDINGS_EXTRA_HEADER_1

  - it: emits one EMBEDDINGS_EXTRA_HEADER_<N> per extraHeaders entry, in order
    set:
      embeddings:
        extraHeaders:
          - "X-Tenant-Id: research"
          - "X-Route: embeddings-v2"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMBEDDINGS_EXTRA_HEADER_1
            value: "X-Tenant-Id: research"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMBEDDINGS_EXTRA_HEADER_2
            value: "X-Route: embeddings-v2"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMBEDDINGS_EXTRA_HEADER_3

  - it: fails when extraHeaders has more than 5 entries
    set:
      embeddings:
        extraHeaders:
          - "X-H1: 1"
          - "X-H2: 2"
          - "X-H3: 3"
          - "X-H4: 4"
          - "X-H5: 5"
          - "X-H6: 6"
    asserts:
      - failedTemplate:
          errorPattern: "embeddings.extraHeaders supports at most 5 entries"

  - it: rejects EMBEDDINGS_EXTRA_HEADER_1 in extraEnv (reserved name)
    set:
      extraEnv:
        - name: EMBEDDINGS_EXTRA_HEADER_1
          value: "X-Sneaky: 1"
    asserts:
      - failedTemplate:
          errorPattern: "\"EMBEDDINGS_EXTRA_HEADER_1\" is a reserved variable"
