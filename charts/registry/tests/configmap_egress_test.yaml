suite: egress credential vault config
templates:
  - templates/configmap-egress.yaml
tests:
  - it: is absent when egressAuth is disabled (default)
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the full registry egress var set when enabled
    set:
      egressAuth:
        enabled: true
        secretStoreBackend: openbao
        oauthCallbackBaseUrl: https://gw.example.com
        openbao:
          addr: http://openbao.default.svc:8200
          authMethod: kubernetes
          role: registry-egress
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: registry-egress-config
      - equal:
          path: data.EGRESS_AUTH_ENABLED
          value: "true"
      - equal:
          path: data.SECRET_STORE_BACKEND
          value: "openbao"
      - equal:
          path: data.EGRESS_OAUTH_CALLBACK_BASE_URL
          value: "https://gw.example.com"
      - equal:
          path: data.OPENBAO_ADDR
          value: "http://openbao.default.svc:8200"
      - equal:
          path: data.OPENBAO_AUTH_METHOD
          value: "kubernetes"
      - equal:
          path: data.OPENBAO_ROLE
          value: "registry-egress"
      # The marker SECRET must NOT appear in the (non-secret) configmap.
      - notExists:
          path: data.AUTH_SERVER_NGINX_MARKER_SECRET

  - it: derives the callback base URL from global.domain + routing mode
    set:
      global:
        domain: agents-path.example.com
        ingress:
          routingMode: path
          tls: true
      egressAuth:
        enabled: true
    asserts:
      # No explicit oauthCallbackBaseUrl: must fall back to the public host so
      # registry.core.config startup validation passes (path mode => bare host).
      - equal:
          path: data.EGRESS_OAUTH_CALLBACK_BASE_URL
          value: "https://agents-path.example.com"

  - it: defaults timeouts + path prefix when only enabled
    set:
      egressAuth:
        enabled: true
    asserts:
      - equal:
          path: data.EGRESS_TOKEN_REFRESH_SKEW_SECONDS
          value: "300"
      - equal:
          path: data.EGRESS_STATE_TTL_SECONDS
          value: "600"
      - equal:
          path: data.SECRETS_MANAGER_PATH_PREFIX
          value: "mcp/egress"
      - equal:
          path: data.OPENBAO_KV_MOUNT
          value: "secret"

  - it: omits the obo audience allowlist by default (shape rule applies)
    set:
      egressAuth:
        enabled: true
    asserts:
      - notExists:
          path: data.EGRESS_OBO_ALLOWED_AUDIENCES

  - it: renders the obo audience allowlist when set
    set:
      egressAuth:
        enabled: true
        oboAllowedAudiences: "api://outlook-mcp-server api://calendar-mcp-server"
    asserts:
      - equal:
          path: data.EGRESS_OBO_ALLOWED_AUDIENCES
          value: "api://outlook-mcp-server api://calendar-mcp-server"

  - it: omits the trusted IdP host allowlist by default (no private token endpoint permitted)
    set:
      egressAuth:
        enabled: true
    asserts:
      - notExists:
          path: data.EGRESS_OAUTH_TRUSTED_IDP_HOSTS

  - it: renders the trusted IdP host allowlist when set
    set:
      egressAuth:
        enabled: true
        oauthTrustedIdpHosts: "keycloak.internal.example.com,login.corp.example.net"
    asserts:
      - equal:
          path: data.EGRESS_OAUTH_TRUSTED_IDP_HOSTS
          value: "keycloak.internal.example.com,login.corp.example.net"

  - it: renders the egress HTTP pool knobs with their defaults
    set:
      egressAuth:
        enabled: true
    asserts:
      # These four feed httpx.Limits on the pooled egress clients. Only this suite
      # checks the configmap actually carries them: helm lint / template /
      # kubeconform do not look at data contents.
      - equal:
          path: data.EGRESS_HTTP_POOL_MAX_CONNECTIONS
          value: "100"
      - equal:
          path: data.EGRESS_HTTP_POOL_MAX_KEEPALIVE
          value: "20"
      - equal:
          path: data.EGRESS_HTTP_POOL_KEEPALIVE_EXPIRY_SECONDS
          value: "30"
      - equal:
          path: data.EGRESS_HTTP_POOL_CONNECT_RETRIES
          value: "1"

  - it: honours overridden egress HTTP pool knobs
    set:
      egressAuth:
        enabled: true
        httpPoolMaxConnections: "250"
        httpPoolMaxKeepalive: "50"
        httpPoolKeepaliveExpirySeconds: "15"
        httpPoolConnectRetries: "3"
    asserts:
      - equal:
          path: data.EGRESS_HTTP_POOL_MAX_CONNECTIONS
          value: "250"
      - equal:
          path: data.EGRESS_HTTP_POOL_MAX_KEEPALIVE
          value: "50"
      # Keep this below the shortest upstream/LB idle timeout: too high turns every
      # idle gap into a reset, which shows up as mcpgw_registry_egress_conn_reset_total.
      - equal:
          path: data.EGRESS_HTTP_POOL_KEEPALIVE_EXPIRY_SECONDS
          value: "15"
      - equal:
          path: data.EGRESS_HTTP_POOL_CONNECT_RETRIES
          value: "3"

  - it: renders a numeric zero pool knob instead of replacing it with the default
    # MAX_KEEPALIVE=0 / KEEPALIVE_EXPIRY=0 is the documented runtime rollback lever;
    # Sprig's `default` would turn a numeric 0 back into "20" / "30".
    set:
      egressAuth:
        enabled: true
        httpPoolMaxKeepalive: 0
        httpPoolKeepaliveExpirySeconds: 0
        httpPoolConnectRetries: 0
    asserts:
      - equal:
          path: data.EGRESS_HTTP_POOL_MAX_KEEPALIVE
          value: "0"
      - equal:
          path: data.EGRESS_HTTP_POOL_KEEPALIVE_EXPIRY_SECONDS
          value: "0"
      - equal:
          path: data.EGRESS_HTTP_POOL_CONNECT_RETRIES
          value: "0"
