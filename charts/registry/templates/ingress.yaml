{{- if .Values.ingress.enabled }}
{{- $routingMode := .Values.global.ingress.routingMode | default "subdomain" }}
{{- $domain := .Values.global.domain | default .Values.ingress.hostname }}
{{- $registrySubdomain := .Values.global.ingress.registrySubdomain | default "mcpregistry" }}
{{- $additionalHostnames := fromYamlArray (include "registry.additionalHostnames" .) }}
{{- $globalPaths := .Values.global.ingress.paths | default dict }}
{{- $pathPrefix := (get $globalPaths "registry") | default .Values.ingress.path | default "/registry" }}
{{- /* With the Istio ingress gateway routed in, every rule targets the gateway's
       HTTPS port instead of the registry's HTTP port. */ -}}
{{- $gateway := include "registry.meshIngressGateway" . }}
{{- $backendName := $gateway | default .Values.app.name }}
{{- $backendPort := ternary "https" "http" (ne $gateway "") }}
{{- /*
In path routing mode the registry pod's in-cluster nginx reverse proxy
fronts auth-server and Keycloak for browser traffic (see
docker/nginx_rev_proxy_http_and_https.conf). The auth-server and
Keycloak ingresses are disabled by default, so the ALB must forward
their browser-facing paths to the registry Service — nginx handles the
final hop to the auth-server / Keycloak ClusterIP Services.

Subdomain mode does not need these extra rules: `/` on the configured
registry hostname already catches every browser-facing path and
nginx does the internal routing.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    {{- if eq $routingMode "path" }}
    alb.ingress.kubernetes.io/group.name: mcp-gateway-stack
    alb.ingress.kubernetes.io/group.order: '20'
    {{- end }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/scheme: {{ .Values.ingress.scheme | default .Values.global.ingress.scheme | default "internet-facing" }}
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/success-codes: 200,302
    {{- if $gateway }}
    # The gateway serves HTTPS, so the ALB re-encrypts to it and health-checks
    # over HTTPS. The ALB does not validate the target certificate.
    alb.ingress.kubernetes.io/backend-protocol: HTTPS
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTPS
    {{- end }}
    {{- if .Values.global.ingress.inboundCidrs }}
    alb.ingress.kubernetes.io/inbound-cidrs: {{ .Values.global.ingress.inboundCidrs }}
    {{- end }}
    {{- if .Values.global.ingress.sslPolicy }}
    alb.ingress.kubernetes.io/ssl-policy: {{ .Values.global.ingress.sslPolicy }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- if eq $routingMode "path" }}
    - host: {{ $domain | quote }}
      http:
        paths:
          - path: {{ $pathPrefix }}
            pathType: Prefix
            backend:
              service:
                name: {{ $backendName }}
                port:
                  name: {{ $backendPort }}
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: {{ $backendName }}
                port:
                  name: {{ $backendPort }}
          - path: /keycloak
            pathType: Prefix
            backend:
              service:
                name: {{ $backendName }}
                port:
                  name: {{ $backendPort }}
          - path: /realms
            pathType: Prefix
            backend:
              service:
                name: {{ $backendName }}
                port:
                  name: {{ $backendPort }}
          - path: /resources
            pathType: Prefix
            backend:
              service:
                name: {{ $backendName }}
                port:
                  name: {{ $backendPort }}
    {{- range $hostname := $additionalHostnames }}
    {{- if $hostname }}
    - host: {{ $hostname | quote }}
      http:
        paths:
          - path: {{ $pathPrefix }}
            pathType: Prefix
            backend:
              service:
                name: {{ $backendName }}
                port:
                  name: {{ $backendPort }}
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: {{ $backendName }}
                port:
                  name: {{ $backendPort }}
          - path: /keycloak
            pathType: Prefix
            backend:
              service:
                name: {{ $backendName }}
                port:
                  name: {{ $backendPort }}
          - path: /realms
            pathType: Prefix
            backend:
              service:
                name: {{ $backendName }}
                port:
                  name: {{ $backendPort }}
          - path: /resources
            pathType: Prefix
            backend:
              service:
                name: {{ $backendName }}
                port:
                  name: {{ $backendPort }}
    {{- end }}
    {{- end }}
    {{- else }}
    - host: {{ printf "%s.%s" $registrySubdomain $domain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $backendName }}
                port:
                  name: {{ $backendPort }}
    {{- range $hostname := $additionalHostnames }}
    {{- if $hostname }}
    - host: {{ $hostname | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $backendName }}
                port:
                  name: {{ $backendPort }}
    {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
