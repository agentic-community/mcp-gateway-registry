{{- /*
ServiceAccount for the setup-mongodb Job. A dedicated identity instead of the
namespace "default" ServiceAccount, so a service-mesh AuthorizationPolicy on
MongoDB can allow exactly this Job. It carries no RBAC: the Job only talks to
MongoDB. A regular (non-hook) resource, so it exists before the post-install and
post-upgrade hook Job that uses it. Set serviceAccount.create=false to bring
your own (serviceAccount.name must then name it).
*/ -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mongodb-configure.serviceAccountName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: setup-mongodb
    app.kubernetes.io/component: setup-mongodb
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
