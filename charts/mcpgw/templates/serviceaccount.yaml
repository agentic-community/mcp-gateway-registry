{{- /*
First-class ServiceAccount for the mcpgw pod. Created by default so the pod runs
as a stable, named identity rather than the namespace "default" SA. Mesh
AuthorizationPolicy keys on this identity (a policy on "default" could not
distinguish mcpgw from anything else), and future RBAC/IRSA can attach here too.
Set serviceAccount.create=false to bring your own.
*/ -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mcpgw.serviceAccountName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.app.name }}
    app.kubernetes.io/component: {{ .Values.app.name }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
