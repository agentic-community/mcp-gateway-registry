{{- /* Resolve image coordinates: per-service image.* overrides global.image.* when set */ -}}
{{- $imgRegistry := default .Values.global.image.registry .Values.image.registry }}
{{- $imgRepository := required "image.repository must be set" .Values.image.repository }}
{{- $imgTag := default .Values.global.image.tag .Values.image.tag }}
{{- $imgPullPolicy := default .Values.global.image.pullPolicy .Values.image.pullPolicy }}
{{- /* Fail-fast validation of user-supplied extraEnv */ -}}
{{- include "mcpgw.validateExtraEnv" . -}}
{{- /*
  Multi-replica guard rail.
  FastMCP OAuthProxy keeps DCR registrations, authorization codes,
  transactions, and refresh-token metadata in per-replica in-memory
  storage. Running multiple replicas without shared state breaks the
  OAuth flow. Shared storage support is planned for a later phase; until
  then, block this combination at template time.
*/}}
{{- if and (gt (int .Values.app.replicas) 1) .Values.app.oidcEnabled }}
{{- fail "mcpgw: app.replicas > 1 with app.oidcEnabled=true is not yet supported. OAuthProxy state is not shared across replicas. Keep app.replicas=1 while oidcEnabled is true, or set oidcEnabled=false for multi-replica deployments." }}
{{- end }}
{{- /*
  Resolve stateless HTTP mode.
  Explicit override (app.statelessHttp) wins; otherwise auto-enable when
  replicas > 1 and OIDC is not enabled. Stateless mode is required under
  a round-robin LB because FastMCP's default StreamableHTTP transport
  keeps per-session transport objects in memory on the replica that
  handled the MCP `initialize` request.
*/}}
{{- $statelessHttp := false }}
{{- if not (kindIs "invalid" .Values.app.statelessHttp) }}
{{- $statelessHttp = .Values.app.statelessHttp }}
{{- else if and (gt (int .Values.app.replicas) 1) (not .Values.app.oidcEnabled) }}
{{- $statelessHttp = true }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.app.name }}
    app.kubernetes.io/component: {{ .Values.app.name }}
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.app.name }}
      app.kubernetes.io/component: {{ .Values.app.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.app.name }}
        app.kubernetes.io/component: {{ .Values.app.name }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: {{ .Values.app.name }}
          image: "{{ $imgRegistry }}/{{ $imgRepository }}:{{ $imgTag }}"
          imagePullPolicy: {{ $imgPullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: {{ .Values.app.port }}
              name: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ .Values.app.existingSecret | default .Values.app.envSecretName }}
            {{- if .Values.global.sharedSecretName }}
            - secretRef:
                name: {{ .Values.global.existingSharedSecret | default .Values.global.sharedSecretName }}
            {{- end }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: HOST
              value: {{ .Values.app.bindHost | quote }}
            - name: MCPGW_STATELESS_HTTP
              value: {{ $statelessHttp | quote }}
            {{- /* GitHub private repo auth (SKILL.md fetching) */}}
            {{- if .Values.app.githubAppId }}
            - name: GITHUB_APP_ID
              value: {{ .Values.app.githubAppId | quote }}
            {{- end }}
            {{- if .Values.app.githubAppInstallationId }}
            - name: GITHUB_APP_INSTALLATION_ID
              value: {{ .Values.app.githubAppInstallationId | quote }}
            {{- end }}
            {{- if .Values.app.githubExtraHosts }}
            - name: GITHUB_EXTRA_HOSTS
              value: {{ .Values.app.githubExtraHosts | quote }}
            {{- end }}
            {{- if ne .Values.app.githubApiBaseUrl "https://api.github.com" }}
            - name: GITHUB_API_BASE_URL
              value: {{ .Values.app.githubApiBaseUrl | quote }}
            {{- end }}
            {{- if .Values.app.githubPatExistingSecret }}
            - name: GITHUB_PAT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.githubPatExistingSecret }}
                  key: {{ .Values.app.githubPatExistingSecretKey }}
            {{- else if .Values.app.githubPat }}
            - name: GITHUB_PAT
              value: {{ .Values.app.githubPat | quote }}
            {{- end }}
            {{- if .Values.app.githubAppPrivateKeyExistingSecret }}
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.githubAppPrivateKeyExistingSecret }}
                  key: {{ .Values.app.githubAppPrivateKeyExistingSecretKey }}
            {{- else if .Values.app.githubAppPrivateKey }}
            - name: GITHUB_APP_PRIVATE_KEY
              value: {{ .Values.app.githubAppPrivateKey | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          lifecycle:
            preStop:
              exec:
                # Give the LB time to deregister this pod before the
                # ASGI server closes in-flight MCP/tool HTTP requests.
                command: ["sh", "-c", "sleep 5"]
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
      # Exceeds the httpx 30s per-request timeout used by the mcpgw
      # tools so rolling deploys drain in-flight requests cleanly.
      terminationGracePeriodSeconds: 45
