# Stack-level values this chart reads. The umbrella chart
# (mcp-gateway-registry-stack) overrides them; the defaults here only exist so
# the templates render standalone.
global:
  # Secret generation switch shared with the umbrella chart. true (default)
  # generates unresolved secret values randomly and preserves them across
  # `helm upgrade` via `lookup`. Set false for ArgoCD and other
  # `helm template` based tools, which render without cluster access: there the
  # lookup is always empty, so a generated value would differ on every sync.
  # With generation off, an unresolved value is a render-time error naming the
  # value to set.
  generateSecrets: true
  # Name of the Secret holding the realm's OIDC client credentials. The
  # umbrella chart renders it as "keycloak-client-secret"; the Job mounts it
  # and publishes those values to Keycloak.
  existingKeycloakClientSecret: ""
  # Used to compute the realm's redirect URIs. Declared here so
  # templates/secret.yaml renders standalone (`helm lint`,
  # `helm template charts/keycloak-configure`) instead of nil-dereferencing
  # global.ingress; the umbrella chart overrides all of them.
  domain: localhost
  ingress:
    tls: false
    routingMode: subdomain
    paths:
      registry: /registry

# Keycloak configuration
keycloak:
  adminUser: user
  realm: "" # Inherit the global realm; set explicitly when using existingSecret.
  existingSecret: "" # Config Secret. Set realm to the Secret's REALM value.
  adminExistingSecret: "" # Standalone admin password Secret; the stack uses the global value.
  adminExistingSecretPasswordKey: admin-password # pragma: allowlist secret

# Extra operator-provisioned clients allowed to retain scopes outside the DCR
# allowlist. Exact IDs only; this grants scope trust, not a DCR-off exemption.
registrationTrustedClientIds: []

# DCR is opt-in and requires Keycloak 26.8.2.
# The native registration/default provider must be disabled at server startup.
# Public OIDC code flows require S256, including cached CIMD clients.
# Both registration subtypes use an explicit scope allowlist, reject client
# mappers and default roles, and enforce the realm's device-grant restriction.
# With DCR off, setup disables anonymous registration and unlisted clients.
# Review the printed client inventory and acknowledge any destructive sweep.
# Built-ins, the web client, verified public PKCE IDE clients, explicit keep
# entries, and client-secret service accounts without browser flows survive.
# Setup invalidates every kept non-built-in client's registration access token.
# Existing access tokens remain valid until expiry. To leave a realm managed
# elsewhere untouched, disable the entire keycloak-configure chart.
# DCR and CIMD cannot both be enabled on native Keycloak 26.8.2: its URI
# executor rejects CIMD creation/update contexts. Switch both flags in one upgrade.
dcr:
  enabled: false
  sweepAcknowledged: false
  allowedScopes:
    - openid
    - basic
    - profile
    - email
    - roles
    - web-origins
    - acr
    - offline_access
  keepClients: []

# CIMD requires the pinned official Keycloak 26.8.2 image and KC_FEATURES=cimd.
# Use exact vendor hosts; setup refuses wildcards.
# Native Keycloak shares callback and JWKS hosts; protect outbound fetches separately.
# Off/trust withdrawal requires dcr.sweepAcknowledged for reviewed enabled targets,
# independently of DCR and keep-lists. Setup never re-enables disabled clients.
# Runtime deny covers saved and late-arriving CIMD at authorization/code/refresh.
# Install deny before removing metadata policy or sweeping; keep it on failure/off.
# First enable refuses unexpected persisted cache-marked records for admin review.
# Setup does not delete those records or use a migration receipt.
# Setup denies CIMD until metadata policy verification. Switch dcr.enabled=false
# and cimd.enabled=true together; the reverse switch disables CIMD clients
# (review/acknowledge the sweep) before reopening DCR. A failed switch keeps
# the affected registration path closed until a successful full setup run.
cimd:
  enabled: false
  trustedDomains:
    - vscode.dev
    - code.visualstudio.com
    - claude.ai
    - "127.0.0.1"
    - localhost
