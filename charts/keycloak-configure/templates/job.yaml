{{- if include "keycloak-configure.enabled" . }}
{{- $globalKeycloak := dig "authProvider" "keycloak" dict .Values.global }}
{{- $keycloakRealm := include "keycloak-configure.realm" . }}
{{- if and .Values.dcr.enabled .Values.cimd.enabled }}
{{- fail "Keycloak 26.8.2 cannot enable dcr.enabled and cimd.enabled together; set one false in the same upgrade" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: setup-keycloak
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    # Re-run on every install, upgrade and rollback so the realm's client
    # redirect URIs stay in sync with the computed AUTH_SERVER_EXTERNAL_URL /
    # REGISTRY_URL. Without this, Jobs are immutable and a chart upgrade
    # that changes those URLs would leave the realm pointing at the old
    # addresses until an operator manually deleted and recreated the Job.
    "helm.sh/hook": "post-install,post-upgrade,post-rollback"
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": "before-hook-creation"
spec:
  template:
    spec:
      containers:
        - name: job
          image: public.ecr.aws/docker/library/python:3.14.9-slim
          command: ["/bin/bash", "/app/script.sh"]
          envFrom:
            - secretRef:
                name: {{ .Values.keycloak.existingSecret | default "keycloak-configure-secret" }}
            - secretRef:
                name: {{ .Values.global.existingKeycloakClientSecret | default "keycloak-client-secret" }}
          env:
            - name: REALM
              value: {{ $keycloakRealm | quote }}
            {{- if not .Values.keycloak.existingSecret }}
            - name: KEYCLOAK_ADMIN
              value: {{ $globalKeycloak.adminUsername | default .Values.keycloak.adminUser | quote }}
            {{- end }}
            - valueFrom:
                secretKeyRef:
                  key: {{ $globalKeycloak.adminExistingSecretPasswordKey | default .Values.keycloak.adminExistingSecretPasswordKey | quote }}
                  name: {{ $globalKeycloak.adminExistingSecret | default .Values.keycloak.adminExistingSecret | default (printf "%s-keycloak" .Release.Name) | quote }}
              name: KEYCLOAK_ADMIN_PASSWORD
            - name: ENABLE_DCR_CONFIG
              value: {{ .Values.dcr.enabled | default false | toString | quote }}
            - name: DCR_SWEEP_ACKNOWLEDGED
              value: {{ .Values.dcr.sweepAcknowledged | default false | toString | quote }}
            - name: CIMD_SWEEP_ACKNOWLEDGED
              value: {{ .Values.cimd.sweepAcknowledged | default false | toString | quote }}
            - name: DCR_ALLOWED_SCOPES
              value: {{ required "keycloak-configure.dcr.allowedScopes must list at least one scope" (join " " (.Values.dcr.allowedScopes | default list)) | quote }}
            - name: DCR_KEEP_CLIENTS
              value: {{ join " " (.Values.dcr.keepClients | default list) | quote }}
            - name: REGISTRATION_TRUSTED_CLIENT_IDS
              value: {{ .Values.registrationTrustedClientIds | toJson | quote }}
            - name: ENABLE_CIMD_CONFIG
              value: {{ .Values.cimd.enabled | default false | toString | quote }}
            - name: CIMD_TRUSTED_DOMAINS
              value: {{ .Values.cimd.trustedDomains | toJson | quote }}
          volumeMounts:
            - mountPath: /app/script.sh
              name: script
              subPath: script.sh
      restartPolicy: Never
      volumes:
        - name: script
          configMap:
            name: setup-keycloak
      serviceAccountName: keycloak-configure-sa
  backoffLimit: 4
{{- end }}
