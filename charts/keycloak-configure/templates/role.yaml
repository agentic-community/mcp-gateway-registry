apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-read-write
  namespace: {{ .Release.Namespace | quote }}
rules:
  - apiGroups: [""] # "" indicates the core API group
    resources: ["secrets"]
    # `update` and `patch` are required because the Job is a
    # post-install + post-upgrade Helm hook and uses
    # `kubectl create ... --dry-run=client -o yaml | kubectl apply -f -`
    # to idempotently write registry-login-credentials (and to read the
    # passwords already stored there). Plain `create` would 403 on upgrade
    # when that Secret already exists.
    verbs: ["get", "watch", "list", "create", "update", "patch"]
