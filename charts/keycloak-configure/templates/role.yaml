{{- if include "keycloak-configure.enabled" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-read-write
  namespace: {{ .Release.Namespace | quote }}
rules:
  - apiGroups: [""] # "" indicates the core API group
    resources: ["secrets"]
    resourceNames: ["registry-login-credentials"]
    verbs: ["get", "patch", "update"]
  # Kubernetes cannot restrict create by resourceNames. The Job creates this
  # Secret on first install; all reads and later writes are name-scoped.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
{{- end }}
