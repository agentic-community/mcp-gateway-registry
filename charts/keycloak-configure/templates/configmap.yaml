{{- if include "keycloak-configure.enabled" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: setup-keycloak
  namespace: {{ .Release.Namespace | quote }}
data:
  script.sh: |
    #!/bin/bash
    apt update
    apt install -y curl jq kubectl

    # Initialize Keycloak with MCP Gateway configuration
    # This script sets up the initial realm, clients, groups, and users

    set -eo pipefail

    # Private request files mirror keycloak/setup/credential-io.sh.
    set +x

    credential_io_init() {
        CREDENTIAL_IO_DIR=$(umask 077; mktemp -d "${TMPDIR:-/tmp}/mcp-credentials.XXXXXXXX") || return 1
        trap 'credential_io_cleanup' EXIT
        trap 'exit 129' HUP
        trap 'exit 130' INT
        trap 'exit 143' TERM
    }

    credential_io_cleanup() {
        if [ -n "${CREDENTIAL_IO_DIR:-}" ]; then
            rm -rf -- "$CREDENTIAL_IO_DIR"
            CREDENTIAL_IO_DIR=
        fi
    }

    credential_temp_file() {
        [ -n "${CREDENTIAL_IO_DIR:-}" ] && [ -d "$CREDENTIAL_IO_DIR" ] || return 1
        CREDENTIAL_TEMP_FILE=$(umask 077; mktemp "$CREDENTIAL_IO_DIR/data.XXXXXXXX") || return 1
    }

    # Shell function arguments never become process arguments. Move sensitive curl
    # options to private files before invoking the executable, preserving request bytes.
    credential_curl() {
        local option value field
        local args=()
        while [ "$#" -gt 0 ]; do
            option=$1
            shift
            case "$option" in
                -H|--header)
                    [ "$#" -gt 0 ] || return 2
                    value=$1
                    shift
                    case "$value" in
                        [Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Aa][Tt][Ii][Oo][Nn]:*)
                            case "$value" in *$'\r'*|*$'\n'*) return 2 ;; esac
                            credential_temp_file || return 1
                            printf '%s\n' "$value" > "$CREDENTIAL_TEMP_FILE" || return 1
                            args+=(--header "@$CREDENTIAL_TEMP_FILE")
                            ;;
                        *) args+=("$option" "$value") ;;
                    esac
                    ;;
                -d|--data|--data-raw|--data-binary|--data-urlencode)
                    [ "$#" -gt 0 ] || return 2
                    value=$1
                    shift
                    case "$option:$value" in
                        --data-urlencode:*=*)
                            field=${value%%=*}
                            credential_temp_file || return 1
                            printf '%s' "${value#*=}" > "$CREDENTIAL_TEMP_FILE" || return 1
                            args+=(--data-urlencode "$field@$CREDENTIAL_TEMP_FILE")
                            ;;
                        --data-urlencode:*@*|--data:@*|-d:@*|--data-binary:@*)
                            args+=("$option" "$value")
                            ;;
                        --data-urlencode:*)
                            credential_temp_file || return 1
                            printf '%s' "$value" > "$CREDENTIAL_TEMP_FILE" || return 1
                            args+=(--data-urlencode "@$CREDENTIAL_TEMP_FILE")
                            ;;
                        *)
                            credential_temp_file || return 1
                            printf '%s' "$value" > "$CREDENTIAL_TEMP_FILE" || return 1
                            args+=(--data-binary "@$CREDENTIAL_TEMP_FILE")
                            ;;
                    esac
                    ;;
                -v|--verbose|--trace|--trace-ascii|--trace=*|--trace-ascii=*)
                    printf '%s\n' 'Credential requests cannot enable curl tracing' >&2
                    return 2
                    ;;
                *) args+=("$option") ;;
            esac
        done
        command curl -q "${args[@]}"
    }

    credential_io_init || exit 1

    _keycloak_policy_version_supported() {
        local info version
        info=$(realm_curl -fsS --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $2" "${1%/}/admin/serverinfo") || return 1
        version=$(jq -er '.systemInfo.version | select(type == "string")' <<< "$info") || return 1
        jq -n --arg version "$version" 'try ($version | capture(
            "^(?<major>[0-9]+)\\.(?<minor>[0-9]+)\\.(?<patch>[0-9]+)(?:$|[-+])")
            | [.major, .minor, .patch] | map(tonumber) | . >= [26,8,2]) catch false'
    }

    _require_supported_keycloak() {
        local supported
        supported=$(_keycloak_policy_version_supported "$1" "$2") || return 1
        if [ "$supported" != true ]; then
            echo "This policy requires Keycloak 26.8.2 or newer; upgrade before enabling it." >&2
            return 1
        fi
    }

    _preflight_token_exchange_support() {
        local info
        info=$(realm_curl -fsS -H "Authorization: Bearer $2" "${1%/}/admin/serverinfo") || return 1
        if jq -e 'any(.features[]?;
            .name == "TOKEN_EXCHANGE_STANDARD_V2" and .enabled == true)' <<< "$info" >/dev/null; then
            _require_supported_keycloak "$1" "$2" || return 1
            local condition="org.keycloak.services.clientpolicy.condition.ClientPolicyConditionProvider"
            if ! jq -e --arg condition "$condition" \
                'any(.componentTypes[$condition][]?; .id == "grant-type")' <<< "$info" >/dev/null; then
                echo "Standard token exchange is enabled without the required policy condition." >&2
                echo "Upgrade Keycloak before running realm setup; no realm settings changed." >&2
                return 1
            fi
        fi
    }

    _preflight_cimd_support() {
        local info
        _require_supported_keycloak "$1" "$2" || return 1
        info=$(realm_curl -fsS --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $2" "${1%/}/admin/serverinfo") || return 1
        if ! jq -e '
            any(.features[]?; .name == "CIMD" and .enabled == true) and
            any(.componentTypes["org.keycloak.services.clientpolicy.condition.ClientPolicyConditionProvider"][]?;
                .id == "client-id-uri") and
            any(.componentTypes["org.keycloak.services.clientpolicy.executor.ClientPolicyExecutorProvider"][]?;
                .id == "client-id-metadata-document")' <<< "$info" >/dev/null; then
            echo "CIMD requires stock Keycloak 26.8.2+ with KC_FEATURES=cimd and the native metadata-document executor." >&2
            return 1
        fi
    }
    # Keep credentials out of subprocess arguments, including long paginated scans.
    realm_curl() {
        local option value
        local args=()
        while [ "$#" -gt 0 ]; do
            option=$1; shift
            case "$option" in
                -H|--header)
                    [ "$#" -gt 0 ] || return 2
                    value=$1; shift
                    if [[ "$value" == "Authorization: Bearer "* ]] && declare -F _realm_fresh_token >/dev/null; then
                        value=$(_realm_fresh_token) || return 1
                        [ -n "$value" ] || return 1
                        value="Authorization: Bearer $value"
                    fi
                    args+=("$option" "$value") ;;
                *) args+=("$option") ;;
            esac
        done
        credential_curl "${args[@]}"
    }

    # Keep the registration allowlist independent of first-party client scope grants.
    _registration_allowed_scopes() {
        local names=() scope forbidden
        read -r -a names <<< "${DCR_ALLOWED_SCOPES:-openid basic profile email roles web-origins acr offline_access}"
        for scope in "${names[@]}"; do
            if [[ "$scope" == */* ]]; then
                echo "DCR_ALLOWED_SCOPES must not include gateway privilege scope $scope." >&2
                return 1
            fi
            for forbidden in mcp-registry-admin registry-admins kc-admin-api; do
                if [ "$scope" = "$forbidden" ]; then
                    echo "DCR_ALLOWED_SCOPES must not include privilege scope $scope." >&2
                    return 1
                fi
            done
        done
        printf '%s\n' "${names[@]}" | jq -Rsc 'split("\n") | map(select(length > 0)) | unique'
    }

    _registration_trusted_clients() {
        local extra="${REGISTRATION_TRUSTED_CLIENT_IDS:-[]}"
        jq -cen --argjson extra "$extra" 'if ($extra | type == "array" and all(.[]; type == "string" and length > 0)) then
            (["account", "account-console", "admin-cli", "admin-permissions", "broker", "realm-management",
              "security-admin-console", "mcp-gateway-web", "mcp-gateway-m2m"] + $extra | unique)
            else error("REGISTRATION_TRUSTED_CLIENT_IDS must be a JSON array of exact reviewed client IDs") end'
    }

    _cimd_domains() {
        local domains="${CIMD_TRUSTED_DOMAINS:-[\"vscode.dev\",\"code.visualstudio.com\",\"claude.ai\",\"127.0.0.1\",\"localhost\"]}"
        jq -ce 'if type == "array" and all(.[]; type == "string" and length > 0 and (contains("*") | not))
            then map(ascii_downcase) | unique else error("CIMD_TRUSTED_DOMAINS requires explicit host strings; wildcard hosts are unsupported") end' <<< "$domains"
    }

    _cimd_client_id_domains() {
        local domains
        domains=$(_cimd_domains) || return 1
        jq -ce 'map(select(test("^(localhost|\\[?::1\\]?|127\\.[0-9.]+)$"; "i") | not))
            | if length > 0 then . else error("CIMD_TRUSTED_DOMAINS lists only loopback hosts; add vendor domains") end' <<< "$domains"
    }

    # The native format accepts arbitrary attributes, including CIMD's cache receipt.
    # Disable that provider at server startup; standard OIDC registration stays enabled.
    _require_oidc_registration_only() {
        local info
        info=$(_admin_get "$1" /admin/serverinfo) || return 1
        if ! jq -e '.providers["client-registration"].providers | type == "object" and
            has("openid-connect") and (has("default") | not)' <<< "$info" >/dev/null; then
            echo "Disable native DCR with KC_SPI_CLIENT_REGISTRATION__DEFAULT__ENABLED=false and restart Keycloak before enabling DCR/CIMD. Keep the openid-connect provider enabled." >&2
            return 1
        fi
    }

    # Before the first managed setup, cached metadata is unexpected: never delete or trust it.
    # The persistent guard identifies realms whose CIMD clients were created under these controls.
    _check_cimd_first_enable() {
        local token=$1 policies clients entries
        _require_oidc_registration_only "$token" || return 1
        policies=$(_admin_get "$token" "/admin/realms/$REALM/client-policies/policies") || return 1
        jq -e '.policies | type == "array"' <<< "$policies" >/dev/null || return 1
        if jq -e 'any(.policies[]; .name == "mcp-cimd-runtime-guard-policy")' <<< "$policies" >/dev/null; then
            return 0
        fi
        clients=$(_list_all_clients "$token") || return 1
        entries=$(jq -r '.[] | select((.attributes // {}) | has("cimd.cache.expiry.time.in.sec"))
            | [.id, (.clientId | gsub("[^A-Za-z0-9._:/@-]"; "?"))] | @tsv' <<< "$clients") || return 1
        if [ -n "$entries" ]; then
            printf 'Unexpected CIMD clients before first enablement:\n%s\n' "$entries" >&2
            echo "Administrator review required. Setup will not delete or adopt these records; resolve them before enabling CIMD." >&2
            return 1
        fi
    }

    # Keycloak 26.8.2 writes these attributes itself in PersistentClientIdMetadataDocumentProvider.
    # OIDC metadata cannot set them. GrantTypeCondition abstains on Admin API events;
    # STRICT skips those events while negative empty grant_types matches every OAuth grant.
    _configure_cimd_runtime_guard() {
        local token=$1 info hosts='[]' profile policy
        info=$(_admin_get "$token" /admin/serverinfo) || return 1
        if ! jq -e 'any(.componentTypes["org.keycloak.services.clientpolicy.condition.ClientPolicyConditionProvider"][]?; .id == "client-attributes")
            and any(.componentTypes["org.keycloak.services.clientpolicy.condition.ClientPolicyConditionProvider"][]?; .id == "grant-type")
            and any(.componentTypes["org.keycloak.services.clientpolicy.executor.ClientPolicyExecutorProvider"][]?; .id == "reject-request")' <<< "$info" >/dev/null; then
            echo "CIMD lifecycle enforcement requires native client-attributes, grant-type and reject-request providers; no clients were swept." >&2
            return 1
        fi
        if [ "${ENABLE_CIMD_CONFIG:-false}" = true ]; then
            hosts=$(_cimd_client_id_domains) || return 1
        fi
        profile='{"name":"mcp-cimd-runtime-guard","executors":[{"executor":"reject-request","configuration":{}}]}'
        policy=$(jq -nc --argjson hosts "$hosts" '{name: "mcp-cimd-runtime-guard-policy", enabled: true, mode: "STRICT",
            conditions: ([{condition: "grant-type", configuration: {grant_types: [], "is-negative-logic": true}},
                {condition: "client-attributes", configuration: {attributes: ([{key: "display.on.consent.screen", value: "true"}] | tojson)}}]
                + [$hosts[] | {condition: "client-attributes", configuration: {"is-negative-logic": true,
                    attributes: ([{key: "consent.screen.text", value: ("The client\u0027s hostname is " + .)}] | tojson)}}]),
            profiles: ["mcp-cimd-runtime-guard"]}') || return 1
        _registration_policy_write "$token" profiles mcp-cimd-runtime-guard "$profile" || return 1
        _registration_policy_write "$token" policies mcp-cimd-runtime-guard-policy "$policy"
    }

    _prepare_cimd_lifecycle() {
        local token=$1 targets
        _check_cimd_first_enable "$token" || return 1
        targets=$(_cimd_sweep_targets "$token") || return 1
        _confirm_cimd_sweep "$targets" || return 1
        # Deny all CIMD until the new metadata policy is installed and verified.
        # Otherwise a failed enable/update could leave allowed clients without validation.
        (ENABLE_CIMD_CONFIG=false; _configure_cimd_runtime_guard "$token") || return 1
        # Keep denial installed if creation-policy removal, inventory, or revocation fails.
        _registration_policy_write "$token" policies cimd-vendors-policy null || return 1
        reconcile_cimd_clients "$token"
    }

    _configure_public_pkce_policy() {
        local token=$1 profile policy
        profile='{"name":"mcp-public-pkce","executors":[{"executor":"pkce-enforcer","configuration":{"auto-configure":true}}]}'
        policy='{"name":"mcp-public-pkce-policy","enabled":true,"mode":"STRICT","conditions":[{"condition":"client-access-type","configuration":{"type":["public"]}},{"condition":"client-type","configuration":{"protocol":"openid-connect"}}],"profiles":["mcp-public-pkce"]}'
        _registration_policy_write "$token" profiles mcp-public-pkce "$profile" || return 1
        _registration_policy_write "$token" policies mcp-public-pkce-policy "$policy"
    }

    _registration_security_available() {
        local info
        info=$(_admin_get "$1" /admin/serverinfo) || return 1
        jq -r '(.componentTypes["org.keycloak.services.clientpolicy.condition.ClientPolicyConditionProvider"] // [] | map(.id)) as $conditions
            | ($conditions | index("client-scopes") != null and index("client-roles") != null
                and index("client-access-type") != null and index("client-type") != null)
            and ((.componentTypes["org.keycloak.services.clientpolicy.executor.ClientPolicyExecutorProvider"] // [] | map(.id)) as $executors
                | ($executors | index("reject-request") != null and index("pkce-enforcer") != null))
            and any(.componentTypes["org.keycloak.services.clientregistration.policy.ClientRegistrationPolicy"][]?;
                .id == "default-roles")' <<< "$info"
    }

    _preflight_registration_security() {
        local token=$1 available response status
        if [ "${ENABLE_DCR_CONFIG:-false}" = true ] && [ "${ENABLE_CIMD_CONFIG:-false}" = true ]; then
            echo "Native Keycloak 26.8.2 cannot apply the DCR URL guard to CIMD registration. Enable DCR or CIMD, not both." >&2
            return 1
        fi
        _registration_allowed_scopes >/dev/null || return 1
        _registration_trusted_clients >/dev/null || return 1
        if [ "${ENABLE_CIMD_CONFIG:-false}" = true ]; then
            _cimd_client_id_domains >/dev/null || return 1
            _preflight_cimd_support "$KEYCLOAK_URL" "$token" || return 1
        fi
        if [ "${ENABLE_DCR_CONFIG:-false}" = true ] || [ "${ENABLE_CIMD_CONFIG:-false}" = true ]; then
            _require_oidc_registration_only "$token" || return 1
            _require_supported_keycloak "$KEYCLOAK_URL" "$token" || return 1
            available=$(_registration_security_available "$token") || return 1
            if [ "$available" != true ]; then
                echo "DCR/CIMD requires native scope, role, public-client, protocol, PKCE and default-roles policy providers." >&2
                return 1
            fi
            # A missing realm is normal on first install. Inspect again after creation.
            response=$(realm_curl -sS -w $'\n%{http_code}' -H "Authorization: Bearer $token" \
                "$KEYCLOAK_URL/admin/realms/$REALM/client-scopes") || return 1
            status=${response##*$'\n'}
            if [ "$status" != 404 ]; then
                [ "$status" = 200 ] || return 1
                if ! jq -e 'type == "array" and all(.[];
                    (.attributes["is.parameterized.scope"] // "false" | tostring) != "true" and
                    (.attributes["is.dynamic.scope"] // "false" | tostring) != "true")' <<< "${response%$'\n'*}" >/dev/null; then
                    echo "DCR/CIMD scope enforcement requires ordinary client scopes. Disable parameterized/dynamic scopes in this realm before enabling registration; native client-scopes conditions cannot match their values." >&2
                    return 1
                fi
            fi
        fi
    }

    # Merge and read back only the owned entry. Preserve every unrelated profile/policy.
    _registration_policy_write() {
        local token=$1 collection=$2 name=$3 entry=$4 current body status actual
        current=$(_admin_get "$token" "/admin/realms/$REALM/client-policies/$collection") || return 1
        body=$(jq -ce --arg key "$collection" --arg name "$name" --argjson entry "$entry" '
            if (.[$key] | type) != "array" then error("invalid policy collection") else
            {($key): ((.[$key] | map(select(.name != $name))) + (if $entry == null then [] else [$entry] end))} end' <<< "$current") || return 1
        status=$(realm_curl -sS -o /dev/null -w '%{http_code}' -X PUT \
            "$KEYCLOAK_URL/admin/realms/$REALM/client-policies/$collection" \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d "$body") || return 1
        [[ "$status" == 2[0-9][0-9] ]] || { echo "Could not write $name: HTTP $status" >&2; return 1; }
        actual=$(_admin_get "$token" "/admin/realms/$REALM/client-policies/$collection") || return 1
        if ! jq -e --arg key "$collection" --arg name "$name" --argjson expected "$entry" '
            [.[$key][]? | select(.name == $name)] | if $expected == null then length == 0 else
            length == 1 and (.[0] | with_entries(select(.key as $k | $expected | has($k)))) == $expected end' <<< "$actual" >/dev/null; then
            echo "Required policy readback failed: $name. Registration must stay closed." >&2
            return 1
        fi
    }

    # ClientRolesCondition checks roles DEFINED on the client, not user role mappings.
    # Only the Admin API creates this role; default-roles registration policy rejects
    # attempts to create it via native DCR. Never grant the exception to a CIMD client.
    _reconcile_registration_trust_roles() {
        local token=$1 clients trusted entries entry uuid permitted response status role
        clients=$(_list_all_clients "$token") || return 1
        trusted=$(_registration_trusted_clients) || return 1
        entries=$(jq -c --argjson trusted "$trusted" '.[] | .clientId as $id
            | select(["account", "account-console", "admin-cli", "admin-permissions", "broker",
                "realm-management", "security-admin-console"] | index($id) | not)
            | {id, trusted: (($trusted | index($id) != null) and
                (((.attributes // {}) | has("cimd.cache.expiry.time.in.sec")) | not))}' <<< "$clients") || return 1
        while IFS= read -r entry; do
            [ -n "$entry" ] || continue
            uuid=$(jq -er '.id | @uri' <<< "$entry") || return 1
            permitted=$(jq -r '.trusted' <<< "$entry") || return 1
            role="/admin/realms/$REALM/clients/$uuid/roles/mcp-registration-trusted"
            response=$(realm_curl -sS -w $'\n%{http_code}' -H "Authorization: Bearer $token" "$KEYCLOAK_URL$role") || return 1
            status=${response##*$'\n'}
            if [ "$permitted" = true ]; then
                if [ "$status" = 404 ]; then
                    status=$(realm_curl -sS -o /dev/null -w '%{http_code}' -X POST \
                        "$KEYCLOAK_URL/admin/realms/$REALM/clients/$uuid/roles" \
                        -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
                        -d '{"name":"mcp-registration-trusted","description":"Operator-reviewed first-party scope exception"}') || return 1
                    [ "$status" = 201 ] || { echo "Could not create registration trust role for client $uuid: HTTP $status" >&2; return 1; }
                else
                    [ "$status" = 200 ] || { echo "Could not read registration trust role for client $uuid: HTTP $status" >&2; return 1; }
                fi
                response=$(_admin_get "$token" "$role") || return 1
                jq -e '.name == "mcp-registration-trusted" and .clientRole == true and .composite != true' <<< "$response" >/dev/null || { echo "Registration trust role readback failed for client $uuid" >&2; return 1; }
            else
                if [ "$status" = 200 ]; then
                    status=$(realm_curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
                        "$KEYCLOAK_URL$role" -H "Authorization: Bearer $token") || return 1
                    [ "$status" = 204 ] || { echo "Could not remove registration trust role for client $uuid: HTTP $status" >&2; return 1; }
                    status=$(realm_curl -sS -o /dev/null -w '%{http_code}' \
                        "$KEYCLOAK_URL$role" -H "Authorization: Bearer $token") || return 1
                fi
                [ "$status" = 404 ] || { echo "Registration trust role removal readback failed for client $uuid: HTTP $status" >&2; return 1; }
            fi
        done <<< "$entries"
    }

    # These realm associations affect NEW clients only; existing first-party client
    # associations are preserved. Both sets matter even when DCR omits scope fields.
    reconcile_registration_default_scopes() {
        local token=$1 allowed kind scopes removals scope status current
        allowed=$(_registration_allowed_scopes) || return 1
        for kind in default optional; do
            scopes=$(_admin_get "$token" "/admin/realms/$REALM/default-$kind-client-scopes") || return 1
            removals=$(jq -er --argjson allowed "$allowed" 'if type != "array" then error("invalid realm defaults") else
                [.[] | .name as $name | select($allowed | index($name) | not) | .id | @uri] | join("\n") end' <<< "$scopes") || return 1
            while IFS= read -r scope; do
                [ -n "$scope" ] || continue
                status=$(realm_curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
                    "$KEYCLOAK_URL/admin/realms/$REALM/default-$kind-client-scopes/$scope" \
                    -H "Authorization: Bearer $token") || return 1
                [ "$status" = 204 ] || return 1
            done <<< "$removals"
            current=$(_admin_get "$token" "/admin/realms/$REALM/default-$kind-client-scopes") || return 1
            jq -e --argjson allowed "$allowed" 'type == "array" and all(.[]; .name as $name | $allowed | index($name))' <<< "$current" >/dev/null || return 1
        done
    }

    _configure_request_object_guard() {
        local token=$1 info clients profile policy
        info=$(_admin_get "$token" /admin/serverinfo) || return 1
        jq -e 'any(.componentTypes["org.keycloak.services.clientpolicy.executor.ClientPolicyExecutorProvider"][]?; .id == "secure-client-uris-pattern")
            and any(.componentTypes["org.keycloak.services.clientpolicy.condition.ClientPolicyConditionProvider"][]?; .id == "client-type")' <<< "$info" >/dev/null || {
            echo "Remote client URL protection requires the native URI pattern executor." >&2
            return 1
        }
        # Sector identifiers are fetched at registration; JWKS at client assertion
        # validation; backchannel logout and CIBA callbacks can send server requests.
        profile='{"name":"mcp-no-remote-request-objects","executors":[{"executor":"secure-client-uris-pattern","configuration":{"client-uri-fields":["requestUris","jwksUri","sectorIdentifierUri","backchannelLogoutUrl","cibaClientNotificationEndpoint"],"allowed-patterns":[]}}]}'
        policy='{"name":"mcp-no-remote-request-objects","enabled":true,"mode":"STRICT","conditions":[{"condition":"client-type","configuration":{"protocol":"openid-connect"}}],"profiles":["mcp-no-remote-request-objects"]}'
        _registration_policy_write "$token" profiles mcp-no-remote-request-objects "$profile" || return 1
        _registration_policy_write "$token" policies mcp-no-remote-request-objects "$policy" || return 1
        clients=$(_list_all_clients "$token") || return 1
        # CIMD-off cleanup disables its clients before the DCR guard is installed.
        # Retain those disabled records for review; refuse any enabled client whose
        # server-fetch metadata could be reached under the new policy.
        jq -e 'all(.[]; .enabled == false or ((.attributes // {}) as $a
            | all(["request.uris", "jwks.url", "sectorIdentifierUri", "backchannel.logout.url", "ciba.backchannel.client.notification.endpoint"][]; ($a[.] // "") == "")))' <<< "$clients" >/dev/null || {
            echo "Enabled clients have server-fetch URLs. Review and clear request_uris, jwks_uri, sector_identifier_uri, backchannel_logout_uri and backchannel_client_notification_endpoint before reopening registration." >&2
            return 1
        }
    }

    _remove_request_object_guard() {
        local token=$1
        # CIMD uses a different REGISTER/UPDATE context, which the native URI
        # executor rejects even when the vendor supplied no checked URL fields.
        _registration_policy_write "$token" policies mcp-no-remote-request-objects null || return 1
        _registration_policy_write "$token" profiles mcp-no-remote-request-objects null
    }

    configure_registration_security_policy() {
        local token=$1 available allowed scopes forbidden profile policy
        _preflight_registration_security "$token" || return 1
        available=$(_registration_security_available "$token") || return 1
        if [ "$available" != true ]; then
            echo "Registration is off; applying cleanup without native scope policy support."
            reconcile_registration_default_scopes "$token" || return 1
            return 0
        fi
        allowed=$(_registration_allowed_scopes) || return 1
        scopes=$(_admin_get "$token" "/admin/realms/$REALM/client-scopes") || return 1
        forbidden=$(jq -ce --argjson allowed "$allowed" 'if type != "array" then error("invalid realm scopes") else
            [.[] | .name | select(. as $name | $allowed | index($name) | not)] | unique end' <<< "$scopes") || return 1
        configure_dcr_default_roles "$token" || return 1
        _configure_public_pkce_policy "$token" || return 1
        _reconcile_registration_trust_roles "$token" || return 1
        if [ "${ENABLE_CIMD_CONFIG:-false}" = true ]; then
            _remove_request_object_guard "$token" || return 1
        else
            _configure_request_object_guard "$token" || return 1
        fi
        profile='{"name":"mcp-registration-scope-guard","executors":[{"executor":"reject-request","configuration":{}}]}'
        # STRICT is essential: on registration/pre-auth events client-scopes abstains.
        # ScopeParameterContext covers authorization, code/refresh responses, password,
        # and service-account requests. Re-run setup whenever the scope catalog changes.
        policy=$(jq -nc --argjson scopes "$forbidden" '{name: "mcp-registration-scope-guard-policy", enabled: true, mode: "STRICT",
            conditions: [{condition: "client-scopes", configuration: {type: "Any", scopes: $scopes}},
                {condition: "client-roles", configuration: {roles: ["mcp-registration-trusted"], "is-negative-logic": true}}],
            profiles: ["mcp-registration-scope-guard"]}') || return 1
        _registration_policy_write "$token" profiles mcp-registration-scope-guard "$profile" || return 1
        _registration_policy_write "$token" policies mcp-registration-scope-guard-policy "$policy" || return 1
        reconcile_registration_default_scopes "$token"
    }

    # Native CIMD leaves the cache-expiry attribute. An HTTPS ID alone is not provenance.
    _cimd_sweep_targets() {
        local clients domains='[]'
        clients=$(_list_all_clients "$1") || return 1
        if [ "${ENABLE_CIMD_CONFIG:-false}" = true ]; then
            domains=$(_cimd_client_id_domains) || return 1
        fi
        jq -r --argjson domains "$domains" --argjson enabled "${ENABLE_CIMD_CONFIG:-false}" '
            .[] | select((.attributes // {}) | has("cimd.cache.expiry.time.in.sec"))
            | .clientId as $client
            | ((try ($client | capture("^https://(?<host>[^/:?#@]+)(?::[0-9]+)?(?:[/?#]|$)"; "i").host | ascii_downcase) catch "") // "") as $host
            | select(($enabled | not) or ($domains | any(. as $domain |
                if startswith("*.") then ($host == ($domain | ltrimstr("*.")) or ($host | endswith($domain[1:])))
                else $host == $domain end) | not))
            | [.id, ($client | gsub("[^A-Za-z0-9._:/@-]"; "?")), (.enabled != false | tostring)] | @tsv' <<< "$clients"
    }

    _confirm_cimd_sweep() {
        local targets=$1
        [ -n "$targets" ] || return 0
        echo "CIMD revocation inventory (UUID, client ID, currently enabled):"
        printf '%s\n' "$targets"
        if grep -q $'\ttrue$' <<< "$targets" && [ "${DCR_SWEEP_ACKNOWLEDGED:-false}" != true ]; then
            echo "Review CIMD revocations and set DCR_SWEEP_ACKNOWLEDGED=true (Helm: dcr.sweepAcknowledged=true). DCR_KEEP_CLIENTS does not override CIMD off or withdrawn host trust." >&2
            return 1
        fi
    }

    reconcile_cimd_clients() {
        local token=$1 targets uuid display enabled status now current body
        targets=$(_cimd_sweep_targets "$token") || return 1
        _confirm_cimd_sweep "$targets" || return 1
        now=$(date +%s) || return 1
        while IFS=$'\t' read -r uuid display enabled; do
            [ -n "$uuid" ] || continue
            uuid=$(jq -rn --arg id "$uuid" '$id | @uri') || return 1
            current=$(_admin_get "$token" "/admin/realms/$REALM/clients/$uuid") || return 1
            # Keycloak exposes user-session deletion, not isolated client-session deletion.
            # A client not-before cutoff revokes its old tokens without logging out other clients.
            body=$(jq -nc --argjson now "$now" --argjson current "$current" \
                '{enabled: false, notBefore: ([$now, ($current.notBefore // 0)] | max)}') || return 1
            status=$(realm_curl -sS -o /dev/null -w '%{http_code}' -X PUT \
                "$KEYCLOAK_URL/admin/realms/$REALM/clients/$uuid" \
                -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d "$body") || return 1
            [ "$status" = 204 ] || { echo "CIMD revocation failed for $display: HTTP $status" >&2; return 1; }
            current=$(_admin_get "$token" "/admin/realms/$REALM/clients/$uuid") || return 1
            jq -e --argjson cutoff "$now" '.enabled == false and .notBefore >= $cutoff' <<< "$current" >/dev/null || return 1
        done <<< "$targets"
    }

    reconcile_registered_client_scopes() {
        local token=$1 clients trusted allowed entries entry uuid display provenance kind scopes removals scope status current
        clients=$(_list_all_clients "$token") || return 1
        trusted=$(_registration_trusted_clients) || return 1
        allowed=$(_registration_allowed_scopes) || return 1
        # Admin GET omits Keycloak's registration token. Unmarked legacy clients need review.
        entries=$(jq -c --argjson trusted "$trusted" '.[] | .clientId as $id
            | if ((.attributes // {}) | has("cimd.cache.expiry.time.in.sec")) then . + {provenance: "registered"}
              elif $id == "mcp-gateway" and .enabled == false and .bearerOnly == true then . + {provenance: "registered"}
              elif $trusted | index($id) then . + {provenance: "trusted"}
              else . + {provenance: "unknown"} end
            | select(.provenance != "trusted") | {id, clientId, provenance}' <<< "$clients") || return 1
        while IFS= read -r entry; do
            [ -n "$entry" ] || continue
            uuid=$(jq -er '.id | @uri' <<< "$entry") || return 1
            display=$(jq -r '.clientId | gsub("[^A-Za-z0-9._:/@-]"; "?")' <<< "$entry") || return 1
            provenance=$(jq -r '.provenance' <<< "$entry") || return 1
            for kind in default optional; do
                scopes=$(_admin_get "$token" "/admin/realms/$REALM/clients/$uuid/$kind-client-scopes") || return 1
                removals=$(jq -er --argjson allowed "$allowed" 'if type != "array" then error("invalid client scopes") else
                    [.[] | .name as $name | select($allowed | index($name) | not) | .id | @uri] | join("\n") end' <<< "$scopes") || return 1
                [ -n "$removals" ] || continue
                if [ "$provenance" = unknown ]; then
                    echo "Scope reconciliation cannot establish registration provenance for $display (UUID $uuid). Review its $kind scopes and add this exact ID to REGISTRATION_TRUSTED_CLIENT_IDS only if first-party, or remove disallowed scopes in the admin console." >&2
                    return 1
                fi
                while IFS= read -r scope; do
                    status=$(realm_curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
                        "$KEYCLOAK_URL/admin/realms/$REALM/clients/$uuid/$kind-client-scopes/$scope" \
                        -H "Authorization: Bearer $token") || return 1
                    [ "$status" = 204 ] || return 1
                done <<< "$removals"
                current=$(_admin_get "$token" "/admin/realms/$REALM/clients/$uuid/$kind-client-scopes") || return 1
                jq -e --argjson allowed "$allowed" 'type == "array" and all(.[]; .name as $name | $allowed | index($name))' <<< "$current" >/dev/null || return 1
            done
        done <<< "$entries"
    }

    _configure_cimd_client_policy() {
        local token=$1 domains hosts profile policy
        _preflight_cimd_support "$KEYCLOAK_URL" "$token" || return 1
        domains=$(_cimd_domains) || return 1
        hosts=$(_cimd_client_id_domains) || return 1
        _prepare_cimd_lifecycle "$token" || return 1
        # Also cover a direct configure_cimd_client_policy call, without the outer
        # reconciliation that normally removes the incompatible DCR guard.
        disable_anonymous_dcr "$token" || return 1
        _remove_request_object_guard "$token" || return 1
        configure_registration_security_policy "$token" || return 1
        reconcile_registered_client_scopes "$token" || return 1
        profile=$(jq -nc --argjson domains "$domains" '{name: "cimd-vendors",
            executors: [{executor: "client-id-metadata-document", configuration: {
                "cimd-allow-permitted-domains": $domains}}]}') || return 1
        policy=$(jq -nc --argjson hosts "$hosts" '{name: "cimd-vendors-policy", enabled: true, mode: "STRICT",
            conditions: [{condition: "client-id-uri", configuration: {"client-id-uri-scheme": ["https"],
                "client-id-uri-allow-permitted-domains": $hosts}}], profiles: ["cimd-vendors"]}') || return 1
        _registration_policy_write "$token" profiles cimd-vendors "$profile" || return 1
        _registration_policy_write "$token" policies cimd-vendors-policy "$policy" || return 1
        _configure_cimd_runtime_guard "$token"
    }

    _remove_cimd_client_policy() {
        local token=$1
        _prepare_cimd_lifecycle "$token" || return 1
        _registration_policy_write "$token" profiles cimd-vendors null
    }

    # Run before group migration or first-party updates, including on DCR-on deployments.
    reconcile_registration_security() {
        local token=$1 status scope_status=0
        [ "${REGISTRATION_SECURITY_RECONCILED:-false}" != true ] || return 0
        status=$(realm_curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
            "$KEYCLOAK_URL/admin/realms/$REALM") || return 1
        [ "$status" != 404 ] || return 0
        [ "$status" = 200 ] || return 1
        # Close anonymous registration during the cutover, including already-open realms.
        disable_anonymous_dcr "$token" || return 1
        if [ "${ENABLE_CIMD_CONFIG:-false}" = true ]; then
            _prepare_cimd_lifecycle "$token" || return 1
            # The DCR URI executor rejects CIMD REGISTER/UPDATE contexts. Remove it
            # only while CIMD is denied and anonymous DCR remains closed.
            _remove_request_object_guard "$token" || return 1
        else
            _remove_cimd_client_policy "$token" || return 1
        fi
        configure_registration_security_policy "$token" || return 1
        # Keep the pre-rotation provenance; scope errors must not skip off-state revocation.
        reconcile_registered_client_scopes "$token" || scope_status=$?
        if [ "${ENABLE_DCR_CONFIG:-false}" != true ]; then
            disable_unlisted_clients "$token" || return 1
        fi
        [ "$scope_status" = 0 ] || return "$scope_status"
        REGISTRATION_SECURITY_RECONCILED=true
    }

    # These will be set properly after loading .env in main()
    KEYCLOAK_URL=""  # Will be overridden with KEYCLOAK_ADMIN_URL after .env is loaded
    REALM="${REALM:-mcp-gateway}"
    KEYCLOAK_ADMIN=$KEYCLOAK_ADMIN
    KEYCLOAK_ADMIN_PASSWORD=$KEYCLOAK_ADMIN_PASSWORD

    # Client scopes that carry gateway authorization rather than OIDC
    # identity. The gateway resolves these names into server and tool access,
    # so a self-registered (DCR) client must never be able to request one: it
    # would be choosing its own privilege.
    #
    # The last two matter most here. They are the `_id` of a scope document
    # granting `server: "*"` with every action
    # (scripts/registry-admins.json, scripts/mcp-registry-admin.json), and
    # unlike the first four their names carry no "/", so the earlier filter,
    # which excluded only slash-containing names, left both requestable
    # through anonymous DCR on this deployment surface.
    PRIVILEGED_CLIENT_SCOPES=(
        "mcp-servers-unrestricted/read"
        "mcp-servers-unrestricted/execute"
        "mcp-servers-restricted/read"
        "mcp-servers-restricted/execute"
        "mcp-registry-admin"
        "registry-admins"
    )

    # The complete set of client scopes a self-registered (DCR) client may
    # hold
    read -r -a DCR_ALLOWED_SCOPE_LIST <<< "${DCR_ALLOWED_SCOPES:-openid basic profile email roles web-origins acr offline_access}"

    # Refused even when an operator lists them in DCR_ALLOWED_SCOPES.
    DCR_FORBIDDEN_SCOPES=("${PRIVILEGED_CLIENT_SCOPES[@]}" "kc-admin-api")

    # Page size for walking the realm's clients.
    CLIENT_PAGE_SIZE=100

    # Every user token carries the custom audience "mcp-gateway" (the audience
    # mapper on the `basic` scope). A client whose clientId equals that
    # audience is inside every token's aud, and on Keycloak 25.0 and 26.2.4 it
    # can exchange any user token it holds for its own token and a refresh
    # token. The setup holds the clientId with this disabled bearer-only
    # placeholder, so no other client (for example one registered while DCR is
    # on) can take it.
    GATEWAY_AUDIENCE_CLIENT_ID="mcp-gateway"
    GATEWAY_AUDIENCE_PLACEHOLDER_JSON='{
        "clientId": "mcp-gateway",
        "name": "Reserved: MCP Gateway token audience",
        "description": "Reserves the clientId equal to the mcp-gateway audience that every user token carries. Must stay disabled; the setup disables it on every run.",
        "protocol": "openid-connect",
        "enabled": false,
        "bearerOnly": true,
        "publicClient": false,
        "standardFlowEnabled": false,
        "implicitFlowEnabled": false,
        "directAccessGrantsEnabled": false,
        "serviceAccountsEnabled": false,
        "defaultClientScopes": [],
        "optionalClientScopes": [],
        "redirectUris": [],
        "webOrigins": []
    }'

    # True when a client representation already has the placeholder's shape.
    GATEWAY_AUDIENCE_PLACEHOLDER_SHAPE_JQ='
        .enabled == false and .bearerOnly == true and .publicClient != true
        and .standardFlowEnabled != true and .implicitFlowEnabled != true
        and .directAccessGrantsEnabled != true and .serviceAccountsEnabled != true
        and ((.redirectUris // []) | length) == 0'

    # Security baseline merged over a realm's current representation (the jq
    # input): a stronger setting already in place is kept, a missing or weaker
    # one is raised to the baseline. $gateway (true for the gateway realm) adds
    # the password policy and the offline-session cap; the master realm gets
    # the quick-login settings instead. adminEventsDetailsEnabled is always
    # false so request bodies, which can carry secrets, are not stored in admin
    # events. The same program is in keycloak/setup/init-keycloak.sh,
    # keycloak/setup/upgrade-realm-for-dcr.sh and
    # terraform/aws-ecs/scripts/init-keycloak.sh.
    REALM_SECURITY_BASELINE_JQ='
        if type != "object" then error("not a realm representation") else . end
        | . as $r
        | {
            bruteForceProtected: true,
            permanentLockout: ($r.permanentLockout == true),
            failureFactor: (if $r.bruteForceProtected == true and ($r.failureFactor // 0) > 0
                            then ([$r.failureFactor, 5] | min) else 5 end),
            waitIncrementSeconds: ([($r.waitIncrementSeconds // 0), 60] | max),
            maxFailureWaitSeconds: ([($r.maxFailureWaitSeconds // 0), 900] | max),
            eventsEnabled: true,
            eventsExpiration: (if $r.eventsExpiration == 0 or ($r.eventsExpiration // 0) >= 2592000
                               then $r.eventsExpiration else 2592000 end),
            adminEventsEnabled: true,
            adminEventsDetailsEnabled: false
          }
        + (if $adminExpiry then {attributes: (($r.attributes // {}) + {
                adminEventsExpiration: (if $r.attributes.adminEventsExpiration == "0"
                    or (($r.attributes.adminEventsExpiration // "0") | tonumber) >= 2592000
                    then $r.attributes.adminEventsExpiration else "2592000" end)})} else {} end)
        + (if $gateway then {
            passwordPolicy: (if (($r.passwordPolicy // "") | length) > 0
                             then $r.passwordPolicy else "length(8) and notUsername and notEmail" end),
            offlineSessionMaxLifespanEnabled: true,
            offlineSessionMaxLifespan: (if $r.offlineSessionMaxLifespanEnabled == true
                                           and ($r.offlineSessionMaxLifespan // 0) > 0
                                           and $r.offlineSessionMaxLifespan <= 2592000
                                        then $r.offlineSessionMaxLifespan else 2592000 end)
          } else {
            minimumQuickLoginWaitSeconds: ([($r.minimumQuickLoginWaitSeconds // 0), 60] | max),
            quickLoginCheckMilliSeconds: ([($r.quickLoginCheckMilliSeconds // 0), 1000] | max),
            maxDeltaTimeSeconds: ([($r.maxDeltaTimeSeconds // 0), 43200] | max)
          } end)
        | with_entries(select(.value != null))'

    # Emit full group paths in mcpgw_group_paths on owned clients and `basic`.
    # The dedicated claim distinguishes paths from legacy flat groups, so the
    # auth-server removes one leading slash only from this signed claim.
    GROUPS_MAPPER_JSON='{
        "name": "groups",
        "protocol": "openid-connect",
        "protocolMapper": "oidc-group-membership-mapper",
        "consentRequired": false,
        "config": {
            "full.path": "true",
            "id.token.claim": "true",
            "access.token.claim": "true",
            "claim.name": "mcpgw_group_paths",
            "userinfo.token.claim": "true"
        }
    }'

    # Colors for output
    RED='\033[0;31m'
    GREEN='\033[0;32m'
    YELLOW='\033[1;33m'
    NC='\033[0m' # No Color

    echo -e "${YELLOW}Keycloak initialization script for MCP Gateway Registry${NC}"
    echo "=============================================="

    # Function to wait for Keycloak to be ready
    wait_for_keycloak() {
        echo -n "Waiting for Keycloak to be ready..."
        local max_attempts=60
        local attempt=0

        while [ $attempt -lt $max_attempts ]; do
            # Try to access the admin console which indicates Keycloak is ready
            if curl -f -s "${KEYCLOAK_URL}/admin/" > /dev/null 2>&1; then
                echo -e " ${GREEN}Ready!${NC}"
                return 0
            fi
            echo -n "."
            sleep 5
            attempt=$((attempt + 1))
        done

        echo -e " ${RED}Timeout!${NC}"
        echo "Keycloak did not become ready within 5 minutes"
        exit 1
    }

    # The private cache survives command substitutions; refresh before a 60-second
    # admin token can expire, rather than once per high-level operation.
    _realm_fresh_token() {
        local now saved=0 token="" cache="$CREDENTIAL_IO_DIR/realm-token"
        now=$(date +%s) || return 1
        if [ -f "$cache" ]; then
            { IFS= read -r saved; IFS= read -r token; } < "$cache" || return 1
        fi
        if [ -z "$token" ] || [ "$((now - saved))" -ge 20 ]; then
            token=$(get_admin_token) || return 1
            if [ -z "$token" ]; then
                echo "Could not refresh Keycloak administrator credentials." >&2
                return 1
            fi
            (umask 077; printf '%s\n%s\n' "$now" "$token" > "$cache") || return 1
        fi
        printf '%s' "$token"
    }

    _admin_event_expiry_supported() {
        _keycloak_policy_version_supported "$KEYCLOAK_URL" "$1"
    }

    # Get a fresh admin token into TOKEN. Master-realm admin tokens live 60
    # seconds by default, so long steps start with a new one.
    _refresh_admin_token() {
        TOKEN=$(get_admin_token)
        if [ -z "$TOKEN" ]; then
            echo -e "${RED}Error: Failed to re-authenticate with Keycloak${NC}"
            exit 1
        fi
    }

    # Print every client of the realm as one JSON array, read page by page.
    # Returns 1 if any page cannot be read. Pages are merged on stdin, not
    # argv, so a large page cannot overflow the argument size limit.
    _list_all_clients() {
        local token=$1
        local clients="[]" page first=0

        while :; do
            page=$(_admin_get "$token" "/admin/realms/${REALM}/clients?first=${first}&max=${CLIENT_PAGE_SIZE}") || return 1
            if ! jq -e 'type == "array"' >/dev/null 2>&1 <<< "$page"; then
                echo -e "${RED}Unexpected response listing the clients of realm '${REALM}'${NC}" >&2
                return 1
            fi
            clients=$(printf '%s\n%s\n' "$clients" "$page" | jq -sc 'add')
            if [ "$(jq 'length' <<< "$page")" -lt "$CLIENT_PAGE_SIZE" ]; then
                break
            fi
            first=$((first + CLIENT_PAGE_SIZE))
        done
        printf '%s\n' "$clients"
    }

    # GET an Admin API path (starting with /admin/). Prints the body; returns 1
    # unless the response is HTTP 200, so a caller never mistakes an error body or
    # an empty response for "nothing found".
    _admin_get() {
        local token=$1
        local path=$2

        local response
        if ! response=$(realm_curl -sS -w $'\n%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            "${KEYCLOAK_URL}${path}"); then
            echo -e "${RED}GET ${path} failed: could not reach Keycloak${NC}" >&2
            return 1
        fi

        local status="${response##*$'\n'}"
        if [ "$status" != "200" ]; then
            echo -e "${RED}GET ${path} returned HTTP ${status}${NC}" >&2
            return 1
        fi
        printf '%s' "${response%$'\n'*}"
    }

    # Print the security settings to PUT on realm $2: REALM_SECURITY_BASELINE_JQ
    # applied to the realm's current representation. $3 is true for the
    # gateway realm. Returns 1 if the realm cannot be read, so nothing is
    # written.
    _realm_security_settings() {
        local token=$1
        local realm=$2
        local gateway=$3
        local current admin_expiry

        admin_expiry=$(_admin_event_expiry_supported "$token") || return 1
        current=$(_admin_get "$token" "/admin/realms/${realm}") || return 1
        if ! jq -ec --argjson gateway "$gateway" --argjson adminExpiry "$admin_expiry" "$REALM_SECURITY_BASELINE_JQ" <<< "$current"; then
            echo -e "${RED}Could not read the current settings of realm ${realm}${NC}" >&2
            return 1
        fi
    }

    harden_master_realm() {
        local token=$1
        local master_json

        echo "Hardening the master realm (brute-force protection, events)..."
        master_json=$(_realm_security_settings "$token" "master" false) || return 1
        local status
        status=$(realm_curl -s -o /dev/null -w "%{http_code}" \
            -X PUT "${KEYCLOAK_URL}/admin/realms/master" \
            -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/json" \
            -d "$master_json")
        case "$status" in
            2??)
                echo -e "${GREEN}Master realm hardened (stronger existing settings kept).${NC}"
                return 0
                ;;
        esac
        echo -e "${RED}Failed to harden the master realm (HTTP ${status})${NC}" >&2
        return 1
    }
    # Function to get admin token
    get_admin_token() {
        local response token status=0
        if ! command -v curl >/dev/null || ! command -v jq >/dev/null; then
            echo "Keycloak setup requires curl and jq" >&2
            exit 1
        fi

        response=$(printf '%s' "$KEYCLOAK_ADMIN_PASSWORD" | realm_curl -s -f -X POST \
            "${KEYCLOAK_URL}/realms/master/protocol/openid-connect/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "username=${KEYCLOAK_ADMIN}" \
            --data-urlencode 'password@-' \
            -d "grant_type=password" \
            -d "client_id=admin-cli") || status=$?
        if [ "$status" -eq 22 ]; then
            return 0
        elif [ "$status" -ne 0 ]; then
            echo "Keycloak admin token request failed (curl exit ${status})" >&2
            exit 1
        fi

        if token=$(jq -er '.access_token | select(type == "string" and length > 0)' <<< "$response" 2>/dev/null); then
            printf '%s\n' "$token"
        fi
    }

    # Function to check if realm exists
    realm_exists() {
        local token=$1
        local response
        response=$(realm_curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${token}" \
            "${KEYCLOAK_URL}/admin/realms/${REALM}") || return 2
        case "$response" in
            200) return 0 ;;
            404) return 1 ;;
            *) echo "Could not inspect realm (HTTP ${response})." >&2; return 2 ;;
        esac
    }

    # PUT the chart-owned realm settings onto an existing realm, with the
    # security fields merged over the realm's current values so a stronger
    # setting the operator chose is kept. Partial PUT: fields absent from the
    # body keep their current values.
    _update_realm_settings() {
        local token=$1
        local realm_json=$2
        local settings body update_status update_response

        settings=$(_realm_security_settings "$token" "$REALM" true) || return 1
        body=$(jq -c --argjson s "$settings" '. + $s' <<< "$realm_json")
        update_response=$(realm_curl -sS -w $'\n%{http_code}' \
            -X PUT "${KEYCLOAK_URL}/admin/realms/${REALM}" \
            -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/json" \
            -d "$body")
        update_status="${update_response##*$'\n'}"
        case "$update_status" in
            2??)
                echo -e "${GREEN}Realm already exists; settings updated (stronger existing settings kept).${NC}"
                return 0
                ;;
        esac
        echo -e "${RED}Failed to update existing realm (HTTP ${update_status})${NC}" >&2
        echo "  response: ${update_response%$'\n'*}" >&2
        return 1
    }

    # Function to create realm step by step
    create_realm() {
        local token=$1

        echo "Creating MCP Gateway realm..."

        # Realm settings the chart owns on EVERY run, create and update alike.
        # Declared before the existence check so the two paths cannot drift.
        # On an existing realm the security fields are merged over its current
        # values (see _update_realm_settings), so stronger settings are kept.
        #
        # sslRequired=none is INTENTIONALLY enforced here rather than being
        # create-only. This chart's topology talks to Keycloak over plain HTTP on
        # the in-cluster service address, and Keycloak rejects token and admin
        # calls with "HTTPS required" when sslRequired is "external" and the caller
        # is not on a private address -- the EKS pod CIDR (100.64/10) is not
        # classified as private. So "none" is a functional requirement of this
        # deployment shape, not a relaxation the operator may opt out of; TLS is
        # terminated at the ALB in front. The Compose and ECS provisioners
        # deliberately omit the field so an operator's value survives there.
        local realm_json
        realm_json=$(printf '%s' "$REALM" | jq -Rs '{
            "realm": .,
            "enabled": true,
            "registrationAllowed": false,
            "loginWithEmailAllowed": true,
            "duplicateEmailsAllowed": false,
            "resetPasswordAllowed": true,
            "editUsernameAllowed": false,
            "bruteForceProtected": true,
            "failureFactor": 5,
            "waitIncrementSeconds": 60,
            "maxFailureWaitSeconds": 900,
            "permanentLockout": false,
            "passwordPolicy": "length(8) and notUsername and notEmail",
            "eventsEnabled": true,
            "eventsExpiration": 2592000,
            "adminEventsEnabled": true,
            "adminEventsDetailsEnabled": false,
            "offlineSessionMaxLifespanEnabled": true,
            "offlineSessionMaxLifespan": 2592000,
            "sslRequired": "none"
        }') || return 1

        # An existing realm is UPDATED, not skipped. Skipping meant a security
        # setting added here (e.g. bruteForceProtected) never reached a deployment
        # whose realm already existed, while the Job still reported success.
        if realm_exists "$token"; then
            _update_realm_settings "$token" "$realm_json"
            return
        else
            local exists_status=$?
            [ "$exists_status" = 1 ] || return 1
        fi

        local admin_expiry
        admin_expiry=$(_admin_event_expiry_supported "$token") || return 1
        if [ "$admin_expiry" = true ]; then
            realm_json=$(jq -c '. + {attributes: {adminEventsExpiration: "2592000"}}' <<< "$realm_json") || return 1
        fi

        local response=$(realm_curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${KEYCLOAK_URL}/admin/realms" \
            -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/json" \
            -d "$realm_json")

        if [ "$response" = "201" ]; then
            echo -e "${GREEN}Realm created successfully!${NC}"
            return 0
        elif [ "$response" = "409" ]; then
            # Created between the existence check and the POST: update it.
            _update_realm_settings "$token" "$realm_json"
            return
        else
            # No second POST here: re-sending the create just to print a body is a
            # duplicate create attempt that can succeed on a transient failure.
            echo -e "${RED}Failed to create realm. HTTP status: ${response}${NC}" >&2
            return 1
        fi
    }

    # Empty output means no matching client; request or JSON failures are errors.
    _lookup_client_id() {
        local token=$1
        local client_id=$2
        local response

        if ! response=$(realm_curl -fs \
            -H "Authorization: Bearer ${token}" \
            "${KEYCLOAK_URL}/admin/realms/${REALM}/clients?clientId=${client_id}"); then
            echo -e "${RED}Failed to look up client ${client_id}${NC}" >&2
            return 1
        fi
        if ! jq -r --arg client_id "$client_id" \
            'if type == "array" then [.[] | select(.clientId == $client_id) | .id | select(type == "string" and length > 0)][0] // empty else error("invalid client list") end' \
            <<< "$response" 2>/dev/null; then
            echo -e "${RED}Invalid client lookup response for ${client_id}${NC}" >&2
            return 1
        fi
    }

    _rotate_registration_access_token() {
        local token=$1
        local client_id=$2
        local uuid=$3
        local status

        status=$(realm_curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${KEYCLOAK_URL}/admin/realms/${REALM}/clients/${uuid}/registration-access-token" \
            -H "Authorization: Bearer ${token}")
        case "$status" in
            2??)
                echo "  - Registration access token of ${client_id} invalidated"
                return 0
                ;;
        esac
        echo -e "${RED}Failed to invalidate the registration access token of ${client_id} (HTTP ${status})${NC}" >&2
        return 1
    }

    # Upsert a Keycloak client: create if missing, otherwise PUT the full
    # representation to apply any attribute changes (e.g. post.logout.redirect.uris)
    # to existing deployments.
    upsert_client() {
        local token=$1
        local client_id=$2
        local client_json=$3

        local existing_id
        existing_id=$(_lookup_client_id "$token" "$client_id") || return 1

        if [ -z "$existing_id" ]; then
            local status=$(realm_curl -s -o /dev/null -w "%{http_code}" \
                -X POST "${KEYCLOAK_URL}/admin/realms/${REALM}/clients" \
                -H "Authorization: Bearer ${token}" \
                -H "Content-Type: application/json" \
                -d "$client_json")
            if [ "$status" = "201" ]; then
                echo -e "${GREEN}Client ${client_id} created${NC}"
            elif [ "$status" = "409" ]; then
                # The client existed after all -- the id lookup above came back
                # empty (e.g. a create race). Accepting 409 as success here would
                # skip the PUT and silently drop the representation, which is the
                # bug this function exists to prevent. Re-resolve and update.
                existing_id=$(_lookup_client_id "$token" "$client_id") || return 1
                if [ -z "$existing_id" ]; then
                    echo -e "${RED}Client ${client_id} reported 409 but could not be resolved${NC}" >&2
                    return 1
                fi
                status=$(realm_curl -s -o /dev/null -w "%{http_code}" \
                    -X PUT "${KEYCLOAK_URL}/admin/realms/${REALM}/clients/${existing_id}" \
                    -H "Authorization: Bearer ${token}" \
                    -H "Content-Type: application/json" \
                    -d "$client_json")
                if [ "$status" != "204" ]; then
                    echo -e "${RED}Failed to update client ${client_id} (HTTP ${status})${NC}" >&2
                    return 1
                fi
                echo -e "${GREEN}Client ${client_id} updated${NC}"
            else
                echo -e "${RED}Failed to create client ${client_id} (HTTP ${status})${NC}" >&2
                return 1
            fi
        else
            local status=$(realm_curl -s -o /dev/null -w "%{http_code}" \
                -X PUT "${KEYCLOAK_URL}/admin/realms/${REALM}/clients/${existing_id}" \
                -H "Authorization: Bearer ${token}" \
                -H "Content-Type: application/json" \
                -d "$client_json")
            if [ "$status" = "204" ]; then
                echo -e "${GREEN}Client ${client_id} updated${NC}"
            else
                echo -e "${RED}Failed to update client ${client_id} (HTTP ${status})${NC}"
                return 1
            fi
        fi
    }

    # Function to create clients
    create_clients() {
        local token=$1
        local extra_redirect_uris=""
        local extra_web_origins=""
        local extra_logout_uris=""

        IFS=',' read -r -a additional_hostnames <<< "${ADDITIONAL_REGISTRY_HOSTNAMES:-}"
        for hostname in "${additional_hostnames[@]}"; do
            [ -n "$hostname" ] || continue
            extra_redirect_uris+=$(printf '\n                "%s://%s/*",' "${REGISTRY_URL%%://*}" "$hostname")
            extra_web_origins+=$(printf '\n                "%s://%s",' "${REGISTRY_URL%%://*}" "$hostname")
            extra_logout_uris+="##${REGISTRY_URL%%://*}://${hostname}/*"
        done

        echo "Creating OAuth2 clients..."

        # Create web client
        local web_client_json='{
            "clientId": "mcp-gateway-web",
            "name": "MCP Gateway Web Client",
            "enabled": true,
            "clientAuthenticatorType": "client-secret",
            "secret": "'"${KEYCLOAK_CLIENT_SECRET}"'",
            "redirectUris": [
                "'${AUTH_SERVER_EXTERNAL_URL:-http://localhost:8888}'/oauth2/callback/keycloak",
                "'${REGISTRY_URL:-http://localhost:7860}'/*",
                '${extra_redirect_uris}'
                "http://localhost:7860/*",
                "http://localhost:8888/*"
            ],
            "webOrigins": [
                "'${REGISTRY_URL:-http://localhost:7860}'",
                '${extra_web_origins}'
                "http://localhost:7860",
                "http://localhost:8888"
            ],
            "attributes": {
                "post.logout.redirect.uris": "'${REGISTRY_URL:-http://localhost:7860}'/*'${extra_logout_uris}'##http://localhost:7860/*##http://localhost:8888/*"
            },
            "protocol": "openid-connect",
            "standardFlowEnabled": true,
            "implicitFlowEnabled": false,
            "directAccessGrantsEnabled": false,
            "serviceAccountsEnabled": false,
            "fullScopeAllowed": false,
            "publicClient": false
        }'

        upsert_client "$token" "mcp-gateway-web" "$web_client_json"

        # Create M2M client
        local m2m_client_json='{
            "clientId": "mcp-gateway-m2m",
            "name": "MCP Gateway M2M Client",
            "enabled": true,
            "clientAuthenticatorType": "client-secret",
            "secret": "'"${KEYCLOAK_M2M_CLIENT_SECRET}"'",
            "protocol": "openid-connect",
            "standardFlowEnabled": false,
            "implicitFlowEnabled": false,
            "directAccessGrantsEnabled": false,
            "serviceAccountsEnabled": true,
            "fullScopeAllowed": false,
            "publicClient": false
        }'

        upsert_client "$token" "mcp-gateway-m2m" "$m2m_client_json"

        echo -e "${GREEN}Clients created successfully!${NC}"
    }

    # Function to create groups
    create_groups() {
        local token=$1

        echo "Creating user groups..."

        local groups=("mcp-registry-admin" "mcp-registry-user" "mcp-registry-developer" "mcp-registry-operator" "mcp-servers-unrestricted" "mcp-servers-restricted" "a2a-agent-admin" "a2a-agent-publisher" "a2a-agent-user")

        for group in "${groups[@]}"; do
            local group_json='{
                "name": "'$group'",
                "attributes": {
                    "description": ["'$group' group for MCP Gateway access"]
                }
            }'

            realm_curl -s -X POST "${KEYCLOAK_URL}/admin/realms/${REALM}/groups" \
                -H "Authorization: Bearer ${token}" \
                -H "Content-Type: application/json" \
                -d "$group_json" > /dev/null
        done

        echo -e "${GREEN}Groups created successfully!${NC}"
    }

    # Function to create custom scopes
    create_scopes() {
        local token=$1

        echo "Creating custom MCP scopes..."

        local scopes=("${PRIVILEGED_CLIENT_SCOPES[@]}")

        for scope in "${scopes[@]}"; do
            local scope_json='{
                "name": "'$scope'",
                "description": "MCP Gateway scope for '$scope' access",
                "protocol": "openid-connect"
            }'

            local response=$(realm_curl -s -o /dev/null -w "%{http_code}" \
                -X POST "${KEYCLOAK_URL}/admin/realms/${REALM}/client-scopes" \
                -H "Authorization: Bearer ${token}" \
                -H "Content-Type: application/json" \
                -d "$scope_json")

            if [ "$response" = "201" ]; then
                echo "  - Created scope: $scope"
            elif [ "$response" = "409" ]; then
                echo "  - Scope already exists: $scope"
            else
                echo -e "${RED}  - Failed to create scope: $scope (HTTP $response)${NC}"
            fi
        done

        echo -e "${GREEN}Custom scopes created successfully!${NC}"
    }

    # Function to assign scopes to M2M client
    setup_m2m_scopes() {
        local token=$1

        echo "Setting up M2M client scopes..."

        # Get M2M client ID
        local m2m_client_id=$(realm_curl -s -H "Authorization: Bearer ${token}" \
            "${KEYCLOAK_URL}/admin/realms/${REALM}/clients?clientId=mcp-gateway-m2m" | \
            jq -r '.[0].id')

        if [ -z "$m2m_client_id" ] || [ "$m2m_client_id" = "null" ]; then
            echo -e "${RED}Error: Could not find mcp-gateway-m2m client${NC}"
            return 1
        fi

        # Deliberately NOT "${PRIVILEGED_CLIENT_SCOPES[@]}": the M2M client
        # gets the four server scopes only, not the two admin scope-document
        # names, which no client should hold as a default scope.
        local scopes=("mcp-servers-unrestricted/read" "mcp-servers-unrestricted/execute" "mcp-servers-restricted/read" "mcp-servers-restricted/execute")

        for scope in "${scopes[@]}"; do
            # Get scope ID
            local scope_id=$(realm_curl -s -H "Authorization: Bearer ${token}" \
                "${KEYCLOAK_URL}/admin/realms/${REALM}/client-scopes" | \
                jq -r '.[] | select(.name=="'$scope'") | .id')

            if [ ! -z "$scope_id" ] && [ "$scope_id" != "null" ]; then
                # Add scope as default client scope
                local response=$(realm_curl -s -o /dev/null -w "%{http_code}" \
                    -X PUT "${KEYCLOAK_URL}/admin/realms/${REALM}/clients/${m2m_client_id}/default-client-scopes/${scope_id}" \
                    -H "Authorization: Bearer ${token}")

                if [ "$response" = "204" ]; then
                    echo "  - Assigned scope: $scope"
                else
                    echo -e "${YELLOW}  - Warning: Could not assign scope $scope (HTTP $response)${NC}"
                fi
            else
                echo -e "${RED}  - Error: Could not find scope: $scope${NC}"
            fi
        done

        echo -e "${GREEN}M2M client scopes configured successfully!${NC}"
    }

    # Function to create service account user for M2M client
    create_service_account_user() {
        local token=$1
        local service_account_username="service-account-mcp-gateway-m2m"

        echo "Creating service account user: $service_account_username"

        # Check if user already exists
        local existing_user=$(realm_curl -s -H "Authorization: Bearer ${token}" \
            "${KEYCLOAK_URL}/admin/realms/${REALM}/users?username=$service_account_username" | \
            jq -r '.[0].id // empty')

        if [ ! -z "$existing_user" ]; then
            echo -e "${YELLOW}Service account user already exists with ID: $existing_user${NC}"
            return 0
        fi

        # Create service account user
        local user_json='{
            "username": "'$service_account_username'",
            "enabled": true,
            "emailVerified": true,
            "serviceAccountClientId": "mcp-gateway-m2m"
        }'

        local response=$(realm_curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${KEYCLOAK_URL}/admin/realms/${REALM}/users" \
            -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/json" \
            -d "$user_json")

        if [ "$response" = "201" ]; then
            echo -e "${GREEN}Service account user created successfully!${NC}"

            # Get the newly created user ID
            local user_id=$(realm_curl -s -H "Authorization: Bearer ${token}" \
                "${KEYCLOAK_URL}/admin/realms/${REALM}/users?username=$service_account_username" | \
                jq -r '.[0].id')

            echo "Created service account user with ID: $user_id"

            # Assign user to mcp-servers-unrestricted group
            local group_id=$(realm_curl -s -H "Authorization: Bearer ${token}" \
                "${KEYCLOAK_URL}/admin/realms/${REALM}/groups" | \
                jq -r '.[] | select(.name=="mcp-servers-unrestricted") | .id')

            if [ ! -z "$group_id" ] && [ "$group_id" != "null" ]; then
                local group_response=$(realm_curl -s -o /dev/null -w "%{http_code}" \
                    -X PUT "${KEYCLOAK_URL}/admin/realms/${REALM}/users/$user_id/groups/$group_id" \
                    -H "Authorization: Bearer ${token}")

                if [ "$group_response" = "204" ]; then
                    echo -e "${GREEN}Service account assigned to mcp-servers-unrestricted group!${NC}"
                else
                    echo -e "${YELLOW}Warning: Could not assign service account to mcp-servers-unrestricted group (HTTP $group_response)${NC}"
                fi
            else
                echo -e "${RED}Error: Could not find mcp-servers-unrestricted group${NC}"
            fi

            # Assign user to a2a-agent-admin group for A2A agent access
            local a2a_group_id=$(realm_curl -s -H "Authorization: Bearer ${token}" \
                "${KEYCLOAK_URL}/admin/realms/${REALM}/groups" | \
                jq -r '.[] | select(.name=="a2a-agent-admin") | .id')

            if [ ! -z "$a2a_group_id" ] && [ "$a2a_group_id" != "null" ]; then
                local a2a_response=$(realm_curl -s -o /dev/null -w "%{http_code}" \
                    -X PUT "${KEYCLOAK_URL}/admin/realms/${REALM}/users/$user_id/groups/$a2a_group_id" \
                    -H "Authorization: Bearer ${token}")

                if [ "$a2a_response" = "204" ]; then
                    echo -e "${GREEN}Service account assigned to a2a-agent-admin group!${NC}"
                else
                    echo -e "${YELLOW}Warning: Could not assign service account to a2a-agent-admin group (HTTP $a2a_response)${NC}"
                fi
            else
                echo -e "${YELLOW}Warning: a2a-agent-admin group not found. Create it manually if A2A agent support is needed.${NC}"
            fi

            return 0
        elif [ "$response" = "409" ]; then
            echo -e "${YELLOW}Service account user already exists. Continuing...${NC}"
            return 0
        else
            echo -e "${RED}Failed to create service account user. HTTP status: ${response}${NC}"
            return 1
        fi
    }

    # Function to create test users
    # Upsert a realm user: create if missing, otherwise PUT a fresh password.
    # Without the password reset, helm upgrades silently drift the realm
    # password from whatever value the registry-login-credentials secret holds.
    upsert_user() {
        local token=$1
        local username=$2
        local password=$3
        local first_name=$4
        local last_name=$5

        local user_json
        user_json=$(printf '%s' "$password" | jq -Rs \
            --arg u "$username" \
            --arg e "${username}@example.com" \
            --arg fn "$first_name" \
            --arg ln "$last_name" \
            '{
                username: $u,
                email: $e,
                enabled: true,
                emailVerified: true,
                firstName: $fn,
                lastName: $ln,
                credentials: [{type: "password", value: ., temporary: false}]
            }') || return 1

        local status=$(realm_curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${KEYCLOAK_URL}/admin/realms/${REALM}/users" \
            -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/json" \
            -d "$user_json")

        if [ "$status" = "201" ]; then
            echo "  - Created user: $username"
        elif [ "$status" = "409" ]; then
            # User already exists — look up id and reset password so the realm
            # stays in sync with the registry-login-credentials secret.
            local user_id=$(realm_curl -s -H "Authorization: Bearer ${token}" \
                "${KEYCLOAK_URL}/admin/realms/${REALM}/users?username=$username&exact=true" | \
                jq -r '.[0].id // empty')
            if [ -z "$user_id" ]; then
                echo -e "${RED}  - 409 on POST but could not look up id for $username${NC}"
                return 1
            fi
            local password_json
            password_json=$(printf '%s' "$password" | jq -Rs '{type: "password", value: ., temporary: false}') || return 1
            local reset_status=$(realm_curl -s -o /dev/null -w "%{http_code}" \
                -X PUT "${KEYCLOAK_URL}/admin/realms/${REALM}/users/${user_id}/reset-password" \
                -H "Authorization: Bearer ${token}" \
                -H "Content-Type: application/json" \
                -d "$password_json")
            if [ "$reset_status" = "204" ]; then
                echo "  - Updated password for existing user: $username"
            else
                echo -e "${RED}  - Failed to reset password for $username (HTTP $reset_status)${NC}"
                return 1
            fi
        else
            echo -e "${RED}  - Failed to create/update user $username (HTTP $status)${NC}"
            return 1
        fi
    }

    create_users() {
        local token=$1

        echo "Creating realm users..."

        # Define usernames for consistency
        local admin_username="admin"
        local test_username="testuser"

        upsert_user "$token" "$admin_username" "${INITIAL_ADMIN_PASSWORD}" "Admin" "User"
        upsert_user "$token" "$test_username" "${INITIAL_USER_PASSWORD}" "Test" "User"

        echo "Assigning users to groups..."

        # Get user IDs
        local admin_user_id=$(realm_curl -s -H "Authorization: Bearer ${token}" \
            "${KEYCLOAK_URL}/admin/realms/${REALM}/users?username=$admin_username" | \
            jq -r '.[0].id')

        local test_user_id=$(realm_curl -s -H "Authorization: Bearer ${token}" \
            "${KEYCLOAK_URL}/admin/realms/${REALM}/users?username=$test_username" | \
            jq -r '.[0].id')

        # Get all group IDs
        local admin_group_id=$(realm_curl -s -H "Authorization: Bearer ${token}" \
            "${KEYCLOAK_URL}/admin/realms/${REALM}/groups" | \
            jq -r '.[] | select(.name=="mcp-registry-admin") | .id')

        local user_group_id=$(realm_curl -s -H "Authorization: Bearer ${token}" \
            "${KEYCLOAK_URL}/admin/realms/${REALM}/groups" | \
            jq -r '.[] | select(.name=="mcp-registry-user") | .id')

        local developer_group_id=$(realm_curl -s -H "Authorization: Bearer ${token}" \
            "${KEYCLOAK_URL}/admin/realms/${REALM}/groups" | \
            jq -r '.[] | select(.name=="mcp-registry-developer") | .id')

        local operator_group_id=$(realm_curl -s -H "Authorization: Bearer ${token}" \
            "${KEYCLOAK_URL}/admin/realms/${REALM}/groups" | \
            jq -r '.[] | select(.name=="mcp-registry-operator") | .id')

        local unrestricted_group_id=$(realm_curl -s -H "Authorization: Bearer ${token}" \
            "${KEYCLOAK_URL}/admin/realms/${REALM}/groups" | \
            jq -r '.[] | select(.name=="mcp-servers-unrestricted") | .id')

        local restricted_group_id=$(realm_curl -s -H "Authorization: Bearer ${token}" \
            "${KEYCLOAK_URL}/admin/realms/${REALM}/groups" | \
            jq -r '.[] | select(.name=="mcp-servers-restricted") | .id')

        # Define usernames for consistent logging
        local admin_username="admin"
        local test_username="testuser"

        # Assign admin user to admin group and unrestricted servers group
        if [ ! -z "$admin_user_id" ] && [ ! -z "$admin_group_id" ]; then
            realm_curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/${REALM}/users/$admin_user_id/groups/$admin_group_id" \
                -H "Authorization: Bearer ${token}" > /dev/null
            echo "  - $admin_username assigned to mcp-registry-admin group"
        fi

        # Also assign admin to unrestricted servers group for full access
        if [ ! -z "$admin_user_id" ] && [ ! -z "$unrestricted_group_id" ]; then
            realm_curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/${REALM}/users/$admin_user_id/groups/$unrestricted_group_id" \
                -H "Authorization: Bearer ${token}" > /dev/null
            echo "  - $admin_username assigned to mcp-servers-unrestricted group"
        fi

        # Assign test user to all groups except admin
        if [ ! -z "$test_user_id" ]; then
            # Arrays of group IDs and names for loop processing
            local group_ids=("$user_group_id" "$developer_group_id" "$operator_group_id" "$unrestricted_group_id" "$restricted_group_id")
            local group_names=("mcp-registry-user" "mcp-registry-developer" "mcp-registry-operator" "mcp-servers-unrestricted" "mcp-servers-restricted")

            # Loop through groups and assign test user to each
            for i in "${!group_ids[@]}"; do
                local group_id="${group_ids[$i]}"
                local group_name="${group_names[$i]}"

                if [ ! -z "$group_id" ]; then
                    realm_curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/${REALM}/users/$test_user_id/groups/$group_id" \
                        -H "Authorization: Bearer ${token}" > /dev/null
                    echo "  - $test_username assigned to $group_name group"
                fi
            done
        fi

        echo -e "${GREEN}Users created and assigned to groups successfully!${NC}"
    }

    # Verify the realm's stored client secrets match the chart-rendered ones.
    #
    # create_clients already PUT the desired "secret" into both client
    # representations. This is the read-back check: registry and auth-server
    # hold the chart's values in their env, so a mismatch here means every
    # OIDC flow would fail with invalid_client. Fail the Job loudly instead of
    # leaving silently broken auth behind.
    #
    # This function no longer writes keycloak-client-secret. The chart renders
    # it in the Sync/install phase because the app pods mount it with
    # envFrom and cannot start without it.
    verify_client_secrets() {
        local token=$1

        echo "Verifying client secrets match the chart-provided values..."

        local failed=0
        local pair
        for pair in "mcp-gateway-web:${KEYCLOAK_CLIENT_SECRET}" "mcp-gateway-m2m:${KEYCLOAK_M2M_CLIENT_SECRET}"; do # pragma: allowlist secret
            local client_id="${pair%%:*}"
            local expected="${pair#*:}"

            local uuid=$(realm_curl -s -H "Authorization: Bearer ${token}" \
                "${KEYCLOAK_URL}/admin/realms/${REALM}/clients?clientId=${client_id}" | \
                jq -r '.[0].id // empty')
            if [ -z "$uuid" ]; then
                echo -e "${RED}Could not resolve client ${client_id}${NC}" >&2
                failed=1
                continue
            fi

            local actual=$(realm_curl -s -H "Authorization: Bearer ${token}" \
                "${KEYCLOAK_URL}/admin/realms/${REALM}/clients/${uuid}/client-secret" | \
                jq -r '.value // empty')
            if [ "$actual" = "$expected" ]; then
                echo -e "${GREEN}${client_id} secret matches keycloak-client-secret${NC}"
            else
                echo -e "${RED}${client_id} secret in Keycloak does not match keycloak-client-secret.${NC}" >&2
                echo "Keycloak rejected or ignored the secret in the client representation." >&2
                failed=1
            fi
        done

        if [ "$failed" -ne 0 ]; then
            echo -e "${RED}Client secret verification failed — registry/auth-server would get invalid_client on every login.${NC}" >&2
            return 1
        fi

        echo ""
        echo "=============================================="
        echo -e "${GREEN}To retrieve all client credentials, run:${NC}"
        echo "  ./keycloak/setup/get-all-client-credentials.sh"
        echo ""
        echo "This will save all credentials to .oauth-tokens/"
        echo "=============================================="
    }

    # Merge the groups mapper into the dedicated full-path claim, preserving
    # extra config and refusing conflicting reserved-claim emitters.
    _upsert_groups_mapper() {
        local token=$1
        local models_url=$2
        local label=$3
        local response existing status


        if ! response=$(realm_curl -fs -H "Authorization: Bearer ${token}" "$models_url"); then
            echo -e "${RED}Failed to list protocol mappers of ${label}${NC}" >&2
            return 1
        fi
        _check_group_path_mapper_models "$response" || return 1
        if [[ "$models_url" == "${KEYCLOAK_URL}/admin/realms/${REALM}/clients/"* ]]; then
            local client_uuid=${models_url#"${KEYCLOAK_URL}/admin/realms/${REALM}/clients/"}
            _check_client_group_path_mappers "$KEYCLOAK_URL" "$REALM" "$token" "${client_uuid%%/*}" || return 1
        fi
        if ! existing=$(jq -c \
            'if type != "array" then error("invalid mapper list")
             elif ([.[] | select(.name == "groups")] | length) > 1
                or any(.[]; .name == "groups" and
                    (.protocol != "openid-connect" or .protocolMapper != "oidc-group-membership-mapper"
                     or (.config["claim.name"] != "groups" and .config["claim.name"] != "mcpgw_group_paths")))
                or any(.[]; .config["claim.name"] == "mcpgw_group_paths" and .name != "groups")
             then error("conflicting groups mapper")
             else [.[] | select(.name == "groups")][0] // empty end' \
            <<< "$response" 2>/dev/null); then
            echo -e "${RED}Invalid protocol mapper list for ${label}${NC}" >&2
            return 1
        fi

        if [ -n "$existing" ] && jq -e --argjson desired "$GROUPS_MAPPER_JSON" '
            .protocol == $desired.protocol and .protocolMapper == $desired.protocolMapper
            and (.config as $config | all($desired.config | to_entries[]; $config[.key] == .value))' >/dev/null <<< "$existing"; then
            return 0
        fi
        _check_group_paths "$KEYCLOAK_URL" "$REALM" "$token" || return 1

        if [ -z "$existing" ]; then
            status=$(realm_curl -s -o /dev/null -w "%{http_code}" \
                -X POST "$models_url" \
                -H "Authorization: Bearer ${token}" \
                -H "Content-Type: application/json" \
                -d "$GROUPS_MAPPER_JSON")
            if [ "$status" = "201" ]; then
                echo -e "${GREEN}Groups mapper created for ${label}${NC}"
                return 0
            fi
            echo -e "${RED}Failed to create groups mapper for ${label} (HTTP ${status})${NC}" >&2
            return 1
        fi

        local mapper_id merged
        if ! mapper_id=$(jq -er '.id | select(type == "string" and length > 0)' <<< "$existing" 2>/dev/null); then
            echo -e "${RED}Groups mapper of ${label} has no id${NC}" >&2
            return 1
        fi
        merged=$(jq -c --argjson desired "$GROUPS_MAPPER_JSON" \
            '. + $desired + {config: ((.config // {}) + $desired.config)}' <<< "$existing")
        status=$(realm_curl -s -o /dev/null -w "%{http_code}" \
            -X PUT "${models_url}/${mapper_id}" \
            -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/json" \
            -d "$merged")
        case "$status" in
            2??)
                echo -e "${GREEN}Groups mapper updated for ${label}${NC}"
                return 0
                ;;
        esac
        echo -e "${RED}Failed to update groups mapper for ${label} (HTTP ${status})${NC}" >&2
        return 1
    }

    # Function to setup groups mapper for OAuth2 clients
    setup_groups_mapper() {
        local token=$1
        local client_id uuid

        echo "Setting up groups mapper for OAuth2 clients..."

        for client_id in mcp-gateway-web mcp-gateway-m2m; do
            uuid=$(_lookup_client_id "$token" "$client_id") || return 1
            if [ -z "$uuid" ]; then
                echo -e "${RED}Error: Could not find ${client_id} client${NC}" >&2
                return 1
            fi
            _upsert_groups_mapper "$token" \
                "${KEYCLOAK_URL}/admin/realms/${REALM}/clients/${uuid}/protocol-mappers/models" \
                "$client_id" || return 1
        done
    }

    # PUT an existing groups mapper back with full paths in mcpgw_group_paths,
    # keeping the rest of its config. $2 is its protocol-mappers/models
    # collection path, $3 the mapper JSON, $4 a label for the owner.
    _ensure_groups_mapper_full_path() {
        if ! jq -e '.protocol == "openid-connect" and .protocolMapper == "oidc-group-membership-mapper"
            and (.config["claim.name"] == "groups" or .config["claim.name"] == "mcpgw_group_paths")' >/dev/null <<< "$3"; then
            echo "Refusing to repurpose a non-gateway groups mapper." >&2
            return 1
        fi
        _check_group_path_mapper_collection "$1" "${KEYCLOAK_URL}${2%/protocol-mappers/models}" || return 1
        if [[ "$2" == "/admin/realms/${REALM}/clients/"* ]]; then
            local client_uuid=${2#"/admin/realms/${REALM}/clients/"}
            _check_client_group_path_mappers "$KEYCLOAK_URL" "$REALM" "$1" "${client_uuid%%/*}" || return 1
        fi
        if jq -e '.config["full.path"] == "true" and .config["claim.name"] == "mcpgw_group_paths"' >/dev/null <<< "$3"; then
            return 0
        fi
        _check_group_paths "$KEYCLOAK_URL" "$REALM" "$1" || return 1
        _put_groups_mapper_full_path "$@"
    }

    _put_groups_mapper_full_path() {
        local token=$1
        local models_path=$2
        local mapper_json=$3
        local owner=$4
        local mapper_id mapper_name


        mapper_id=$(echo "$mapper_json" | jq -r '.id // empty')
        mapper_name=$(echo "$mapper_json" | jq -r '(.name // "") | gsub("[^A-Za-z0-9._:/@ -]"; "?")')
        if [ -z "$mapper_id" ]; then
            echo -e "${RED}Groups mapper on ${owner} has no id${NC}" >&2
            return 1
        fi
        if jq -e '.config["full.path"] == "true" and .config["claim.name"] == "mcpgw_group_paths"' >/dev/null <<< "$mapper_json"; then
            return 0
        fi

        local updated status
        updated=$(echo "$mapper_json" | jq -c '.config = ((.config // {}) + {"full.path": "true", "claim.name": "mcpgw_group_paths"})')
        status=$(realm_curl -s -o /dev/null -w "%{http_code}" \
            -X PUT "${KEYCLOAK_URL}${models_path}/${mapper_id}" \
            -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/json" \
            -d "$updated")
        if [[ "$status" != 2* ]]; then
            echo -e "${RED}Failed to switch groups mapper ${mapper_name} on ${owner} to full.path=true (HTTP ${status})${NC}" >&2
            return 1
        fi
        echo -e "${GREEN}${owner}: groups mapper ${mapper_name} now uses full.path=true${NC}"
    }

    # Migrate client and client-scope group membership mappers emitting groups or
    # mcpgw_group_paths to the dedicated full-path claim. Leave unrelated group
    # claims alone and reject foreign emitters of the reserved claim.
    update_client_groups_mappers() {
        local token=$1 clients entries entry client_uuid client_id mapper collection
        local scopes scope scope_id scope_name models scope_entries
        _check_realm_group_path_mappers "$KEYCLOAK_URL" "$REALM" "$token" || return 1
        clients=$(_list_all_clients "$token") || return 1
        entries=$(jq -c '.[]
            | if any(.protocolMappers[]?; .config["claim.name"] == "mcpgw_group_paths" and
                (.protocol != "openid-connect" or .protocolMapper != "oidc-group-membership-mapper"))
              then error("conflicting mcpgw_group_paths mapper") else . end
            | {id, clientId, collection: "clients", mapper: (.protocolMappers[]?
                | select(.protocol == "openid-connect" and .protocolMapper == "oidc-group-membership-mapper"
                    and (.config["claim.name"] == "groups" or .config["claim.name"] == "mcpgw_group_paths")
                    and (.config["full.path"] != "true" or .config["claim.name"] != "mcpgw_group_paths")))}' <<< "$clients") || return 1
        scopes=$(_admin_get "$token" "/admin/realms/${REALM}/client-scopes") || return 1
        scopes=$(jq -c '.[] | {id, name}' <<< "$scopes") || return 1
        while IFS= read -r scope; do
            [ -n "$scope" ] || continue
            scope_id=$(jq -er '.id' <<< "$scope") || return 1
            scope_name=$(jq -r '.name' <<< "$scope") || return 1
            models=$(_admin_get "$token" "/admin/realms/${REALM}/client-scopes/${scope_id}/protocol-mappers/models") || return 1
            _check_group_path_mapper_models "$models" || return 1
            scope_entries=$(jq -c --arg id "$scope_id" --arg name "$scope_name" '
                .[] | select(.protocol == "openid-connect" and .protocolMapper == "oidc-group-membership-mapper"
                    and (.config["claim.name"] == "groups" or .config["claim.name"] == "mcpgw_group_paths")
                    and (.config["full.path"] != "true" or .config["claim.name"] != "mcpgw_group_paths"))
                | {id: $id, clientId: $name, collection: "client-scopes", mapper: .}' <<< "$models") || return 1
            if [ -n "$scope_entries" ]; then
                entries="${entries}${entries:+$'\n'}${scope_entries}"
            fi
        done <<< "$scopes"
        [ -n "$entries" ] || return 0
        _check_group_paths "$KEYCLOAK_URL" "$REALM" "$token" || return 1
        while IFS= read -r entry; do
            client_uuid=$(jq -er '.id' <<< "$entry") || return 1
            client_id=$(jq -r '.clientId | gsub("[^A-Za-z0-9._:/@-]"; "?")' <<< "$entry") || return 1
            mapper=$(jq -c '.mapper' <<< "$entry") || return 1
            collection=$(jq -r '.collection' <<< "$entry") || return 1
            _put_groups_mapper_full_path "$token" \
                "/admin/realms/${REALM}/${collection}/${client_uuid}/protocol-mappers/models" \
                "$mapper" "${collection} ${client_id}" || return 1
        done <<< "$entries"
    }

    # Keep in sync with keycloak/setup/group-path-preflight.sh. The Helm Job
    # is standalone and does not mount the repository helper.
    _check_group_path_mapper_models() {
        if ! jq -e 'type == "array" and all(.[];
            if ((.config["claim.name"] // "") | split(".")[0]) == "mcpgw_group_paths" then
                .protocol == "openid-connect" and
                .protocolMapper == "oidc-group-membership-mapper" and
                .config["claim.name"] == "mcpgw_group_paths" and
                .config["full.path"] == "true"
            else true end)' <<< "$1" >/dev/null; then
            echo "The reserved mcpgw_group_paths claim has an unsafe mapper. Review local and inherited mappers before migration." >&2
            return 1
        fi
    }

    _check_group_path_mapper_collection() {
        local models
        models=$(realm_curl -fsS --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $1" "$2/protocol-mappers/models") || return 1
        _check_group_path_mapper_models "$models"
    }

    _check_client_group_path_mappers() {
        local url=${1%/} realm token=$3 uuid=$4 kind scopes ids id
        realm=$(jq -rn --arg value "$2" '$value | @uri') || return 1
        uuid=$(jq -rn --arg value "$uuid" '$value | @uri') || return 1
        local base="$url/admin/realms/$realm"
        _check_group_path_mapper_collection "$token" "$base/clients/$uuid" || return 1
        for kind in default optional; do
            scopes=$(realm_curl -fsS --connect-timeout 10 --max-time 30 \
                -H "Authorization: Bearer $token" "$base/clients/$uuid/$kind-client-scopes") || return 1
            ids=$(jq -er 'if type == "array" and all(.[]; .id | type == "string" and length > 0)
                then [.[] | .id | @uri] | join("\n") else error("invalid client scopes") end' <<< "$scopes") || return 1
            while IFS= read -r id; do
                [ -n "$id" ] || continue
                _check_group_path_mapper_collection "$token" "$base/client-scopes/$id" || return 1
            done <<< "$ids"
        done
    }

    _check_realm_group_path_mappers() {
        local url=${1%/} realm token=$3 scopes ids id page first=0 count
        realm=$(jq -rn --arg value "$2" '$value | @uri') || return 1
        local base="$url/admin/realms/$realm"
        scopes=$(realm_curl -fsS --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $token" "$base/client-scopes") || return 1
        ids=$(jq -er 'if type == "array" and all(.[]; .id | type == "string" and length > 0)
            then [.[] | .id | @uri] | join("\n") else error("invalid realm scopes") end' <<< "$scopes") || return 1
        while IFS= read -r id; do
            [ -n "$id" ] || continue
            _check_group_path_mapper_collection "$token" "$base/client-scopes/$id" || return 1
        done <<< "$ids"
        while :; do
            page=$(realm_curl -fsS --connect-timeout 10 --max-time 30 \
                -H "Authorization: Bearer $token" "$base/clients?first=$first&max=100") || return 1
            ids=$(jq -er 'if type == "array" and all(.[]; .id | type == "string" and length > 0)
                then [.[] | .id | @uri] | join("\n") else error("invalid realm clients") end' <<< "$page") || return 1
            while IFS= read -r id; do
                [ -n "$id" ] || continue
                _check_group_path_mapper_collection "$token" "$base/clients/$id" || return 1
            done <<< "$ids"
            count=$(jq 'length' <<< "$page") || return 1
            [ "$count" -eq 100 ] || break
            first=$((first + count))
        done
    }

    _group_paths_get() {
        local token=$1 url=$2 response status
        response=$(realm_curl -sS --connect-timeout 10 --max-time 30 -w $'\n%{http_code}' \
            -H "Authorization: Bearer ${token}" "$url") || return 1
        status=${response##*$'\n'}
        if [[ "$status" != 2[0-9][0-9] ]]; then
            printf 'Could not enumerate Keycloak groups (HTTP %s).\n' "$status" >&2
            return 1
        fi
        printf '%s' "${response%$'\n'*}"
    }

    # A count identifies paginated child collections on newer Keycloak versions.
    # Older versions embed subGroups instead; walk those records recursively.
    _group_paths_entries() {
        local admin_url=$1 realm=$2 token=$3 page=$4 parent=$5
        local entries entry id child_path count children
        if ! jq -e 'type == "array" and all(.[];
            (.id | type == "string" and length > 0) and
            (.name | type == "string" and length > 0) and
            ((has("subGroupCount") | not) or (.subGroupCount | type == "number" and . >= 0 and . == floor)) and
            ((has("subGroups") | not) or (.subGroups | type == "array")))' \
            >/dev/null 2>&1 <<< "$page"; then
            echo "Could not enumerate Keycloak groups: invalid group representation." >&2
            return 1
        fi
        jq -c --arg parent "$parent" '.[] | {id, name, path: ($parent + "/" + .name)}' <<< "$page" || return 1
        entries=$(jq -c '.[] | select(
            if has("subGroupCount") then .subGroupCount > 0
            elif has("subGroups") then (.subGroups | length) > 0
            else true end)' <<< "$page") || return 1
        while IFS= read -r entry; do
            [ -z "$entry" ] && continue
            id=$(jq -r '.id | @uri' <<< "$entry") || return 1
            # Keep trailing newlines in names: command substitution strips them.
            child_path=$(jq -r --arg parent "$parent" '$parent + "/" + .name + "."' <<< "$entry") || return 1
            child_path=${child_path%.}
            count=$(jq -r '.subGroupCount // empty' <<< "$entry") || return 1
            if [ -n "$count" ]; then
                _group_paths_walk "$admin_url" "$realm" "$token" \
                    "/admin/realms/${realm}/groups/${id}/children" "$child_path" || return 1
            elif jq -e 'has("subGroups")' >/dev/null <<< "$entry"; then
                children=$(jq -c '.subGroups' <<< "$entry") || return 1
                _group_paths_entries "$admin_url" "$realm" "$token" "$children" "$child_path" || return 1
            else
                # Missing child metadata is not proof that this is a leaf.
                _group_paths_walk "$admin_url" "$realm" "$token" \
                    "/admin/realms/${realm}/groups/${id}/children" "$child_path" || return 1
            fi
        done <<< "$entries"
    }

    _group_paths_walk() {
        local admin_url=$1 realm=$2 token=$3 path=$4 parent=$5
        local first=0 page count page_size=100
        while :; do
            page=$(_group_paths_get "$token" \
                "${admin_url}${path}?first=${first}&max=${page_size}&briefRepresentation=false") || return 1
            _group_paths_entries "$admin_url" "$realm" "$token" "$page" "$parent" || return 1
            count=$(jq 'length' <<< "$page") || return 1
            [ "$count" -lt "$page_size" ] && break
            first=$((first + count))
        done
    }

    # Full paths are ambiguous only when distinct groups emit the same path.
    # A legacy slash-bearing name without a collision remains supported.
    _check_group_paths() {
        local admin_url=${1%/} realm=$2 token=$3 groups collisions slashed
        realm=$(jq -rn --arg realm "$realm" '$realm | @uri') || return 1
        if ! groups=$(_group_paths_walk "$admin_url" "$realm" "$token" "/admin/realms/${realm}/groups" ""); then
            echo "Could not read every Keycloak group; refusing to change groups mappers." >&2
            return 1
        fi
        collisions=$(jq -s '[group_by(.path)[] | select((unique_by(.id) | length) > 1)] | length' <<< "$groups") || return 1
        if [ "$collisions" -gt 0 ]; then
            echo "Different Keycloak groups share a full path; refusing to change groups mappers. Rename the conflicting groups and rerun setup." >&2
            return 1
        fi
        slashed=$(jq -s '[.[] | select(.name | contains("/"))] | length' <<< "$groups") || return 1
        if [ "$slashed" -gt 0 ]; then
            echo "Warning: ${slashed} Keycloak group names contain '/' but have no full-path collision. Consider renaming them." >&2
        fi
    }

    # Create the disabled placeholder that holds the clientId
    # GATEWAY_AUDIENCE_CLIENT_ID, or put an existing client of that clientId
    # back into the placeholder shape (disabled) and invalidate its
    # registration access token. Fails closed on any read or write error.
    reserve_gateway_audience_client() {
        local token=$1
        local clients existing uuid status display

        echo "Reserving clientId '${GATEWAY_AUDIENCE_CLIENT_ID}' (the audience every user token carries)..."
        clients=$(_admin_get "$token" "/admin/realms/${REALM}/clients?clientId=${GATEWAY_AUDIENCE_CLIENT_ID}") || return 1
        if ! existing=$(jq -ec --arg c "$GATEWAY_AUDIENCE_CLIENT_ID" \
            'if type == "array" then ([.[] | select(.clientId == $c)] | first // {}) else error("not an array") end' <<< "$clients"); then
            echo -e "${RED}Unexpected response looking up client ${GATEWAY_AUDIENCE_CLIENT_ID}${NC}" >&2
            return 1
        fi

        if [ "$existing" = "{}" ]; then
            status=$(realm_curl -s -o /dev/null -w "%{http_code}" \
                -X POST "${KEYCLOAK_URL}/admin/realms/${REALM}/clients" \
                -H "Authorization: Bearer ${token}" -H "Content-Type: application/json" \
                -d "$GATEWAY_AUDIENCE_PLACEHOLDER_JSON")
            if [ "$status" != "201" ]; then
                echo -e "${RED}Failed to create the disabled placeholder client ${GATEWAY_AUDIENCE_CLIENT_ID} (HTTP ${status})${NC}" >&2
                return 1
            fi
            echo -e "${GREEN}Created the disabled placeholder client ${GATEWAY_AUDIENCE_CLIENT_ID}${NC}"
            return 0
        fi

        uuid=$(jq -r '.id' <<< "$existing")
        display="${GATEWAY_AUDIENCE_CLIENT_ID} (id ${uuid})"
        if ! jq -e "$GATEWAY_AUDIENCE_PLACEHOLDER_SHAPE_JQ" >/dev/null <<< "$existing"; then
            echo -e "${YELLOW}Warning: client ${display} was enabled or not in the placeholder shape; disabling it. A client with this clientId is inside the audience of every user token.${NC}"
        fi
        status=$(realm_curl -s -o /dev/null -w "%{http_code}" \
            -X PUT "${KEYCLOAK_URL}/admin/realms/${REALM}/clients/${uuid}" \
            -H "Authorization: Bearer ${token}" -H "Content-Type: application/json" \
            -d "$GATEWAY_AUDIENCE_PLACEHOLDER_JSON")
        if [ "$status" != "204" ]; then
            echo -e "${RED}Failed to disable client ${display} (HTTP ${status})${NC}" >&2
            return 1
        fi
        _rotate_registration_access_token "$token" "$GATEWAY_AUDIENCE_CLIENT_ID" "$uuid" || return 1
        existing=$(_admin_get "$token" "/admin/realms/${REALM}/clients/${uuid}") || return 1
        if ! jq -e "$GATEWAY_AUDIENCE_PLACEHOLDER_SHAPE_JQ" >/dev/null <<< "$existing"; then
            echo -e "${RED}Client ${display} is still not a disabled placeholder after the update${NC}" >&2
            return 1
        fi
        echo -e "${GREEN}Client ${GATEWAY_AUDIENCE_CLIENT_ID} is a disabled placeholder${NC}"
    }

    # =========================================================================
    # Dynamic Client Registration (RFC 7591) support
    # =========================================================================
    # MCP clients (Claude Code, Claude.ai connectors, Cursor, etc.) register
    # themselves anonymously and receive tokens that carry the user's groups
    # for per-user authorization at the gateway. Anonymous registration needs
    # no credential, so everything a registered client can hold is decided
    # here:
    #
    # 1. setup_dcr_groups_mapper / setup_dcr_audience_mapper - attach mappers
    #    to the `basic` client-scope. `basic` is auto-attached to every client
    #    (including DCR'd ones), so this is the only reliable place to put a
    #    mapper that runs for clients we don't pre-create.
    # 2. configure_dcr_allowed_scopes - set the anonymous + authenticated DCR
    #    "Allowed Client Scopes" policies to exactly DCR_ALLOWED_SCOPE_LIST.
    # 3. configure_dcr_trusted_hosts - relax the anonymous DCR "Trusted Hosts"
    #    policy so MCP clients running on diverse cloud egress IPs can register.
    # 4. configure_dcr_allowed_mapper_types - no client-supplied protocol
    #    mappers (anonymous + authenticated). The gateway's own groups/audience
    #    mappers live on the server-side `basic` client-scope, so this does not
    #    affect legitimate MCP.
    # 5. configure_dcr_reject_device_grant - refuse the device authorization
    #    grant realm-wide.
    # 6. verify_dcr_baseline_policies - fail unless Keycloak's own anonymous
    #    policies that these steps rely on (Consent Required, Full Scope
    #    Disabled, Max Clients Limit, Allowed Protocol Mapper Types) are
    #    present.

    setup_dcr_groups_mapper() {
        local token=$1
        local response basic_scope_id

        echo "Attaching Groups protocol mapper to the 'basic' client-scope..."

        if ! response=$(realm_curl -fs -H "Authorization: Bearer ${token}" \
            "${KEYCLOAK_URL}/admin/realms/${REALM}/client-scopes"); then
            echo -e "${RED}Failed to list client scopes${NC}" >&2
            return 1
        fi
        if ! basic_scope_id=$(jq -r \
            'if type == "array" then [.[] | select(.name == "basic") | .id | select(type == "string" and length > 0)][0] // empty else error("invalid client-scope list") end' \
            <<< "$response" 2>/dev/null); then
            echo -e "${RED}Invalid client-scope list${NC}" >&2
            return 1
        fi

        if [ -z "$basic_scope_id" ]; then
            echo "The basic client scope is required for gateway group claims." >&2
            return 1
        fi

        _upsert_groups_mapper "$token" \
            "${KEYCLOAK_URL}/admin/realms/${REALM}/client-scopes/${basic_scope_id}/protocol-mappers/models" \
            "the 'basic' client-scope" || return 1
        echo -e "${GREEN}DCR'd clients will receive groups in tokens.${NC}"
    }

    setup_dcr_audience_mapper() {
        local token=$1

        echo "Attaching Audience protocol mapper to the 'basic' client-scope..."

        local scopes basic_scope_id
        scopes=$(_admin_get "$token" "/admin/realms/${REALM}/client-scopes") || return 1
        basic_scope_id=$(jq -er '[.[] | select(.name == "basic")][0].id | select(type == "string" and length > 0)' <<< "$scopes") || return 1


        local scope existing
        scope=$(_admin_get "$token" "/admin/realms/${REALM}/client-scopes/${basic_scope_id}") || return 1
        existing=$(jq -r '.protocolMappers[]? | select(.name == "mcp-gateway-audience") | .id' <<< "$scope") || return 1

        if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            echo -e "${YELLOW}Audience mapper already attached. Skipping.${NC}"
            return 0
        fi

        local audience_mapper_json='{
            "name": "mcp-gateway-audience",
            "protocol": "openid-connect",
            "protocolMapper": "oidc-audience-mapper",
            "consentRequired": false,
            "config": {
                "included.custom.audience": "mcp-gateway",
                "id.token.claim": "false",
                "access.token.claim": "true"
            }
        }'

        local response=$(realm_curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${KEYCLOAK_URL}/admin/realms/${REALM}/client-scopes/${basic_scope_id}/protocol-mappers/models" \
            -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/json" \
            -d "$audience_mapper_json")

        if [ "$response" = "201" ]; then
            echo -e "${GREEN}Audience mapper attached. DCR'd-client tokens will carry aud=\"mcp-gateway\".${NC}"
        elif [ "$response" = "409" ]; then
            echo -e "${YELLOW}Audience mapper already exists. Continuing...${NC}"
        else
            echo -e "${RED}Failed to attach Audience mapper. HTTP status: ${response}${NC}"
            return 1
        fi
    }

    # Set one subType's "Allowed Client Scopes" policy to exactly the given
    # list, with allow-default-scopes off so realm scopes outside the list are
    # refused. Both 'anonymous' and 'authenticated' subTypes need this because
    # Keycloak picks one based on whether the DCR request carries an
    # initial-access / registration token.
    _set_allowed_scopes_policy() {
        local token=$1
        local sub_type=$2
        local components=$3
        local allowed_json=$4

        local policy_id=$(echo "$components" | \
            jq -r ".[] | select(.name==\"Allowed Client Scopes\" and .subType==\"${sub_type}\") | .id")
        local parent_id=$(echo "$components" | \
            jq -r ".[] | select(.name==\"Allowed Client Scopes\" and .subType==\"${sub_type}\") | .parentId")

        if [ -z "$policy_id" ] || [ "$policy_id" = "null" ]; then
            echo -e "${RED}${sub_type} 'Allowed Client Scopes' policy not found; refusing to leave DCR scopes unrestricted.${NC}"
            return 1
        fi

        local response=$(_put_allowed_scopes_policy "$token" "$policy_id" "$parent_id" "$sub_type" "$allowed_json")

        if [ "$response" = "400" ] && echo "$allowed_json" | jq -e 'index("openid")' >/dev/null; then
            echo -e "${YELLOW}${sub_type}: Keycloak refused 'openid' in the allowlist; retrying without it.${NC}"
            response=$(_put_allowed_scopes_policy "$token" "$policy_id" "$parent_id" "$sub_type" \
                "$(echo "$allowed_json" | jq -c 'map(select(. != "openid"))')")
        fi

        if [ "$response" = "204" ]; then
            echo -e "${GREEN}${sub_type} Allowed Client Scopes policy set to the explicit allowlist.${NC}"
        else
            echo -e "${RED}FAILED (${sub_type}): HTTP status ${response}${NC}"
            return 1
        fi
    }

    # PUT the Allowed Client Scopes component; prints the HTTP status.
    _put_allowed_scopes_policy() {
        local token=$1
        local policy_id=$2
        local parent_id=$3
        local sub_type=$4
        local allowed_json=$5

        local policy_json=$(jq -n \
            --arg name "Allowed Client Scopes" \
            --arg providerId "allowed-client-templates" \
            --arg providerType "org.keycloak.services.clientregistration.policy.ClientRegistrationPolicy" \
            --arg parentId "$parent_id" \
            --arg subType "$sub_type" \
            --argjson allowedScopes "$allowed_json" \
            '{
                name: $name,
                providerId: $providerId,
                providerType: $providerType,
                parentId: $parentId,
                subType: $subType,
                config: {
                    "allow-default-scopes": ["false"],
                    "allowed-client-scopes": $allowedScopes
                }
            }')

        realm_curl -s -o /dev/null -w "%{http_code}" \
            -X PUT "${KEYCLOAK_URL}/admin/realms/${REALM}/components/${policy_id}" \
            -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/json" \
            -d "$policy_json"
    }

    configure_dcr_allowed_scopes() {
        local token=$1

        echo "Setting 'Allowed Client Scopes' DCR policy (anonymous + authenticated)..."

        local scope forbidden
        for scope in "${DCR_ALLOWED_SCOPE_LIST[@]}"; do
            if [[ "$scope" == */* ]]; then
                echo -e "${RED}DCR_ALLOWED_SCOPES contains '${scope}'; scope names with '/' are gateway privilege scopes and are never allowed.${NC}"
                return 1
            fi
            for forbidden in "${DCR_FORBIDDEN_SCOPES[@]}"; do
                if [ "$scope" = "$forbidden" ]; then
                    echo -e "${RED}DCR_ALLOWED_SCOPES contains '${scope}', which a self-registered client must never hold.${NC}"
                    return 1
                fi
            done
        done

        local allowed_json=$(printf '%s\n' "${DCR_ALLOWED_SCOPE_LIST[@]}" | jq -R . | jq -sc 'unique')
        echo "  DCR clients may hold only: $(echo "$allowed_json" | jq -r 'join(", ")')"

        local components
        components=$(_admin_get "$token" "/admin/realms/${REALM}/components?type=org.keycloak.services.clientregistration.policy.ClientRegistrationPolicy") || return 1

        _set_allowed_scopes_policy "$token" "anonymous" "$components" "$allowed_json" || return 1
        _set_allowed_scopes_policy "$token" "authenticated" "$components" "$allowed_json" || return 1
    }

    # Native DCR accepts full ClientRepresentation; reject self-assigned default
    # roles for anonymous registrations AND authenticated registration-token updates.
    configure_dcr_default_roles() {
        local token=$1 info components realm_json realm_id subtype ids id body status
        local type="org.keycloak.services.clientregistration.policy.ClientRegistrationPolicy"
        info=$(_admin_get "$token" "/admin/serverinfo") || return 1
        if ! jq -e --arg type "$type" 'any(.componentTypes[$type][]?; .id == "default-roles")' >/dev/null <<< "$info"; then
            if [ "${2:-true}" = false ]; then
                return 0
            fi
            echo "DCR requires Keycloak 26.8.2 or newer with the Default Roles Disabled registration policy. Keep ENABLE_DCR_CONFIG=false until the server is upgraded." >&2
            return 1
        fi
        realm_json=$(_admin_get "$token" "/admin/realms/${REALM}") || return 1
        realm_id=$(jq -er '.id | select(type == "string" and length > 0)' <<< "$realm_json") || return 1
        components=$(_admin_get "$token" "/admin/realms/${REALM}/components?type=$type") || return 1
        jq -e 'type == "array"' >/dev/null <<< "$components" || return 1
        for subtype in anonymous authenticated; do
            ids=$(jq -r --arg subtype "$subtype" '.[] | select(.providerId == "default-roles" and .subType == $subtype) | .id' <<< "$components") || return 1
            if [ -z "$ids" ]; then
                body=$(jq -nc --arg parent "$realm_id" --arg subtype "$subtype" --arg type "$type" '{
                    name: "Default Roles Disabled", providerId: "default-roles", providerType: $type,
                    parentId: $parent, subType: $subtype, config: {}}') || return 1
                status=$(realm_curl -sS -o /dev/null -w '%{http_code}' -X POST \
                    "$KEYCLOAK_URL/admin/realms/$REALM/components" \
                    -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d "$body") || return 1
                if [ "$status" != 201 ]; then
                    echo "Could not install Default Roles Disabled ($subtype): HTTP $status" >&2
                    return 1
                fi
            fi
        done
        components=$(_admin_get "$token" "/admin/realms/${REALM}/components?type=$type") || return 1
        for subtype in anonymous authenticated; do
            if ! jq -e --arg subtype "$subtype" --arg parent "$realm_id" --arg type "$type" \
                'type == "array" and any(.[]; .providerId == "default-roles" and .providerType == $type
                    and .subType == $subtype and .parentId == $parent)' >/dev/null <<< "$components"; then
                echo "Default Roles Disabled verification failed ($subtype); DCR was not enabled." >&2
                return 1
            fi
        done
    }

    configure_dcr_trusted_hosts() {
        local token=$1
        configure_registration_security_policy "$token" || return 1
        reconcile_registered_client_scopes "$token" || return 1
        configure_dcr_default_roles "$token" || return 1

        echo "Relaxing anonymous-DCR 'Trusted Hosts' policy..."

        local components
        components=$(_admin_get "$token" "/admin/realms/${REALM}/components?type=org.keycloak.services.clientregistration.policy.ClientRegistrationPolicy") || return 1

        local policy_id=$(echo "$components" | \
            jq -r '.[] | select(.name=="Trusted Hosts" and .subType=="anonymous") | .id')
        local parent_id=$(echo "$components" | \
            jq -r '.[] | select(.name=="Trusted Hosts" and .subType=="anonymous") | .parentId')

        if [ -z "$policy_id" ] || [ "$policy_id" = "null" ]; then
            echo -e "${RED}Error: Could not find anonymous 'Trusted Hosts' policy${NC}"
            return 1
        fi

        # IP-must-match check off (MCP clients run from diverse cloud IPs).
        # URI-must-match stays on with `localhost` trusted for OAuth callbacks.
        local policy_json='{
            "name": "Trusted Hosts",
            "providerId": "trusted-hosts",
            "providerType": "org.keycloak.services.clientregistration.policy.ClientRegistrationPolicy",
            "parentId": "'"$parent_id"'",
            "subType": "anonymous",
            "config": {
                "host-sending-registration-request-must-match": ["false"],
                "client-uris-must-match": ["true"],
                "trusted-hosts": ["localhost", "127.0.0.1", "claude.ai"]
            }
        }'

        local response=$(realm_curl -s -o /dev/null -w "%{http_code}" \
            -X PUT "${KEYCLOAK_URL}/admin/realms/${REALM}/components/${policy_id}" \
            -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/json" \
            -d "$policy_json")

        if [ "$response" = "204" ]; then
            echo -e "${GREEN}Trusted Hosts policy relaxed (IP check off, URI check on, localhost allowed).${NC}"
        else
            echo -e "${RED}Failed to update Trusted Hosts policy. HTTP status: ${response}${NC}"
            return 1
        fi
    }

    # dcr.enabled=false: put the anonymous Trusted Hosts policy back to
    # Keycloak's default (no trusted hosts). Clients registered while DCR was
    # on are disabled next by disable_unlisted_clients.
    disable_anonymous_dcr() {
        local token=$1

        echo "Disabling anonymous DCR ('Trusted Hosts': no trusted hosts)..."

        local components realm_body
        components=$(_admin_get "$token" "/admin/realms/${REALM}/components?type=org.keycloak.services.clientregistration.policy.ClientRegistrationPolicy") || return 1
        local policy_id=$(echo "$components" | \
            jq -r '[.[] | select(.providerId=="trusted-hosts" and .subType=="anonymous") | .id] | first // empty')
        realm_body=$(_admin_get "$token" "/admin/realms/${REALM}") || return 1
        local realm_id=$(echo "$realm_body" | jq -r '.id // empty')
        if [ -z "$realm_id" ]; then
            echo -e "${RED}Could not read the id of realm '${REALM}'.${NC}"
            return 1
        fi

        local policy_json=$(jq -n --arg parentId "$realm_id" '{
            name: "Trusted Hosts",
            providerId: "trusted-hosts",
            providerType: "org.keycloak.services.clientregistration.policy.ClientRegistrationPolicy",
            parentId: $parentId,
            subType: "anonymous",
            config: {
                "host-sending-registration-request-must-match": ["true"],
                "client-uris-must-match": ["true"],
                "trusted-hosts": []
            }
        }')

        local response
        if [ -n "$policy_id" ]; then
            response=$(realm_curl -s -o /dev/null -w "%{http_code}" \
                -X PUT "${KEYCLOAK_URL}/admin/realms/${REALM}/components/${policy_id}" \
                -H "Authorization: Bearer ${token}" -H "Content-Type: application/json" \
                -d "$(echo "$policy_json" | jq --arg id "$policy_id" '. + {id: $id}')")
        else
            response=$(realm_curl -s -o /dev/null -w "%{http_code}" \
                -X POST "${KEYCLOAK_URL}/admin/realms/${REALM}/components" \
                -H "Authorization: Bearer ${token}" -H "Content-Type: application/json" \
                -d "$policy_json")
        fi

        if [ "$response" = "204" ] || [ "$response" = "201" ]; then
            echo -e "${GREEN}Anonymous DCR disabled (HTTP ${response}).${NC}"
        else
            echo -e "${RED}Failed to disable anonymous DCR. HTTP status: ${response}${NC}"
            return 1
        fi
    }

    # Keycloak's built-in clients. They stay enabled when DCR is off and are
    # the only kept clients whose registration access token is left alone.
    DCR_OFF_BUILTIN_CLIENTS=(
        account account-console admin-cli admin-permissions broker realm-management security-admin-console
    )

    # Clients kept by name when DCR is off: the built-in clients,
    # mcp-gateway-web and every clientId in DCR_KEEP_CLIENTS
    # (chart value dcr.keepClients). M2M clients (mcp-gateway-m2m,
    # agent-<id>-m2m, federation-peer-m2m, the terraform bots, the registry's
    # service accounts) are kept by the service-account-only shape the setup
    # scripts give them.
    DCR_OFF_KEEP_CLIENTS=(
        "${DCR_OFF_BUILTIN_CLIENTS[@]}"
        mcp-gateway-web
    )

    # Sorts each enabled client into builtin, keep (by name), shape (a
    # confidential service-account-only client using client-secret) or
    # disable. Prints tab-separated action, uuid and a printable clientId
    # (registrants choose clientIds).
    DCR_OFF_CLASSIFY_JQ='
        .[]
        | select(.enabled == true)
        | .clientId as $c
        | (if ($builtin | any(. == $c)) then "builtin"
           elif ($keep | any(. == $c)) then "keep"
           elif ($c == "mcp-gateway-ide" and .protocol == "openid-connect"
             and .publicClient == true and .standardFlowEnabled == true
             and .implicitFlowEnabled != true and .directAccessGrantsEnabled != true
             and .serviceAccountsEnabled != true and .bearerOnly != true
             and .attributes["pkce.code.challenge.method"] == "S256"
             and ((.redirectUris // []) | length) > 0
             and all(.redirectUris[]; test("^http://(localhost|127\\.0\\.0\\.1):[0-9]+/[^*]*$"))) then "ide"
           elif ($c != "mcp-gateway-ide" and .publicClient != true
                 and .serviceAccountsEnabled == true
                 and .clientAuthenticatorType == "client-secret"
                 and .standardFlowEnabled != true
                 and .implicitFlowEnabled != true
                 and .directAccessGrantsEnabled != true
                 and ((.redirectUris // []) | length) == 0) then "shape"
           else "disable" end) as $action
        | [$action, .id, ($c | gsub("[^A-Za-z0-9._:/@-]"; "?"))] | @tsv'

    _disable_client() {
        local token=$1
        local uuid=$2
        local display=$3
        local status

        status=$(realm_curl -s -o /dev/null -w "%{http_code}" \
            -X PUT "${KEYCLOAK_URL}/admin/realms/${REALM}/clients/${uuid}" \
            -H "Authorization: Bearer ${token}" -H "Content-Type: application/json" \
            -d '{"enabled": false}')
        if [ "$status" != "204" ]; then
            echo -e "${RED}Failed to disable client ${display} (HTTP ${status}).${NC}"
            return 1
        fi
        echo "  - disabled ${display}"
    }

    # dcr.enabled=false: disable every client not kept above, and invalidate
    # the registration access token of every client except the built-in ones,
    # so clients MCP tools registered while DCR was on stop working (no new
    # logins, no token refresh) and no registrant can modify a client any
    # more, including one that is kept. Disabled, not deleted: re-enable one
    # in the admin console if it was needed. Fails closed: if the client list
    # cannot be read, nothing is disabled and the Job fails.
    _dcr_sweep_targets() {
        local token=$1 clients keep builtin extra_keep=()
        clients=$(_list_all_clients "$token") || return 1
        # CIMD has its own off/trust inventory, regardless of DCR keep settings.
        clients=$(jq '[.[] | select(((.attributes // {}) | has("cimd.cache.expiry.time.in.sec")) | not)]' <<< "$clients") || return 1
        read -r -a extra_keep <<< "${DCR_KEEP_CLIENTS//,/ }"
        keep=$(printf '%s\n' "${DCR_OFF_KEEP_CLIENTS[@]}" "${extra_keep[@]}" | jq -R . | jq -sc 'map(select(length > 0))') || return 1
        builtin=$(printf '%s\n' "${DCR_OFF_BUILTIN_CLIENTS[@]}" | jq -R . | jq -sc '.') || return 1
        jq -r --argjson keep "$keep" --argjson builtin "$builtin" "$DCR_OFF_CLASSIFY_JQ" <<< "$clients"
    }

    _confirm_dcr_sweep() {
        local targets=$1 action uuid display destructive=false
        echo "DCR-off inventory (action, client UUID, client ID):"
        printf '%s\n' "$targets"
        while IFS=$'\t' read -r action uuid display; do
            [ "$action" != disable ] || destructive=true
        done <<< "$targets"
        if [ "$destructive" = true ] && [ "${DCR_SWEEP_ACKNOWLEDGED:-false}" != true ]; then
            echo "Refusing to disable clients without DCR_SWEEP_ACKNOWLEDGED=true (Helm: dcr.sweepAcknowledged=true). Review this inventory and set DCR_KEEP_CLIENTS to exact client IDs to preserve. No sweep was performed." >&2
            return 1
        fi
    }

    preflight_dcr_upgrade() {
        local token=$1 status targets info type="org.keycloak.services.clientregistration.policy.ClientRegistrationPolicy"
        _preflight_registration_security "$token" || return 1
        _preflight_token_exchange_support "$KEYCLOAK_URL" "$token" || return 1
        if [ "${ENABLE_CIMD_CONFIG:-false}" = true ]; then
            _preflight_cimd_support "$KEYCLOAK_URL" "$token" || return 1
        fi
        if [ "${ENABLE_DCR_CONFIG:-false}" = true ]; then
            _require_supported_keycloak "$KEYCLOAK_URL" "$token" || return 1
            info=$(_admin_get "$token" "/admin/serverinfo") || return 1
            if ! jq -e --arg type "$type" 'any(.componentTypes[$type][]?; .id == "default-roles")' >/dev/null <<< "$info"; then
                echo "DCR requires Keycloak 26.8.2+ with Default Roles Disabled; keep ENABLE_DCR_CONFIG=false or upgrade before enabling DCR. No realm settings changed." >&2
                return 1
            fi
        fi
        status=$(realm_curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" "$KEYCLOAK_URL/admin/realms/$REALM") || return 1
        [ "$status" != 404 ] || return 0
        [ "$status" = 200 ] || { echo "Could not inspect realm before DCR sweep (HTTP $status)." >&2; return 1; }
        targets=$(_cimd_sweep_targets "$token") || return 1
        _confirm_cimd_sweep "$targets" || return 1
        [ "${ENABLE_DCR_CONFIG:-false}" != true ] || return 0
        targets=$(_dcr_sweep_targets "$token") || return 1
        _confirm_dcr_sweep "$targets"
    }

    disable_unlisted_clients() {
        local token=$1 targets
        targets=$(_dcr_sweep_targets "$token") || return 1
        _confirm_dcr_sweep "$targets" || return 1

        local disabled=0 rotated=0 action uuid display
        while IFS=$'\t' read -r action uuid display; do
            if [ -z "$uuid" ] || [ "$action" = "builtin" ]; then
                continue
            fi
            if [ "$action" = "disable" ]; then
                _disable_client "$token" "$uuid" "$display" || return 1
                disabled=$((disabled + 1))
            elif [ "$action" = "shape" ]; then
                echo -e "  ${YELLOW}- kept ${display}: confidential service-account-only client using client-secret (disable it by hand if this deployment did not create it)${NC}"
            fi
            _rotate_registration_access_token "$token" "$display" "$uuid" || return 1
            rotated=$((rotated + 1))
        done <<< "$targets"

        echo -e "${GREEN}Disabled ${disabled} client(s) not on the keep-list (built-in, mcp-gateway-web, safe public PKCE IDE, dcr.keepClients, service-account-only with client-secret); invalidated the registration access token of ${rotated} non-built-in client(s).${NC}"
    }

    # Set one subType's "Allowed Protocol Mapper Types" policy to the empty
    # list (no client-supplied protocol mappers). A realm without the policy
    # gets one: without it a registered client may define any mapper,
    # including one that writes the reserved `mcpgw_group_paths` claim.
    _set_allowed_mapper_types_policy() {
        local token=$1
        local sub_type=$2  # "anonymous" or "authenticated"
        local components=$3
        local realm_id=$4

        local policy_id
        policy_id=$(echo "$components" | jq -r --arg st "$sub_type" \
            '[.[] | select(.providerId=="allowed-protocol-mappers" and .subType==$st) | .id] | first // empty')

        local policy_json
        policy_json=$(jq -n --arg parentId "$realm_id" --arg subType "$sub_type" '{
            name: "Allowed Protocol Mapper Types",
            providerId: "allowed-protocol-mappers",
            providerType: "org.keycloak.services.clientregistration.policy.ClientRegistrationPolicy",
            parentId: $parentId,
            subType: $subType,
            config: {"allowed-protocol-mapper-types": []}
        }')

        local response action
        if [ -n "$policy_id" ]; then
            action="narrowed down"
            response=$(realm_curl -s -o /dev/null -w "%{http_code}" \
                -X PUT "${KEYCLOAK_URL}/admin/realms/${REALM}/components/${policy_id}" \
                -H "Authorization: Bearer ${token}" -H "Content-Type: application/json" \
                -d "$(echo "$policy_json" | jq --arg id "$policy_id" '. + {id: $id}')")
        else
            action="created (the realm had none)"
            response=$(realm_curl -s -o /dev/null -w "%{http_code}" \
                -X POST "${KEYCLOAK_URL}/admin/realms/${REALM}/components" \
                -H "Authorization: Bearer ${token}" -H "Content-Type: application/json" \
                -d "$policy_json")
        fi

        if [ "$response" = "204" ] || [ "$response" = "201" ]; then
            echo -e "${GREEN}Allowed Protocol Mapper Types (${sub_type}) ${action}: no client-supplied mappers permitted.${NC}"
        else
            echo -e "${RED}Failed to set Allowed Protocol Mapper Types (${sub_type}). HTTP status: ${response}${NC}"
            return 1
        fi
    }

    configure_dcr_allowed_mapper_types() {
        local token=$1

        echo "Setting 'Allowed Protocol Mapper Types' DCR policy (anonymous + authenticated)..."

        local components realm_body realm_id
        components=$(_admin_get "$token" "/admin/realms/${REALM}/components?type=org.keycloak.services.clientregistration.policy.ClientRegistrationPolicy") || return 1
        if ! echo "$components" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo -e "${RED}Unexpected client registration policy list for realm '${REALM}'.${NC}"
            return 1
        fi
        realm_body=$(_admin_get "$token" "/admin/realms/${REALM}") || return 1
        realm_id=$(echo "$realm_body" | jq -r '.id // empty')
        if [ -z "$realm_id" ]; then
            echo -e "${RED}Could not read the id of realm '${REALM}'.${NC}"
            return 1
        fi

        local sub_type
        for sub_type in anonymous authenticated; do
            _set_allowed_mapper_types_policy "$token" "$sub_type" "$components" "$realm_id" || return 1
        done
    }

    # Refuse the device authorization grant for every client in the realm.
    configure_dcr_reject_device_grant() {
        local token=$1

        echo "Rejecting the device authorization grant realm-wide..."

        local serverinfo
        serverinfo=$(_admin_get "$token" "/admin/serverinfo") || return 1
        local device_flow=$(echo "$serverinfo" | \
            jq -r '[.features[]? | select(.name=="DEVICE_FLOW") | .enabled | tostring] | first // "unknown"')
        if [ "$device_flow" = "false" ]; then
            echo -e "${GREEN}Device authorization grant is disabled server-wide (device-flow feature off).${NC}"
            return 0
        fi
        local has_condition=$(echo "$serverinfo" | \
            jq -r '[.componentTypes["org.keycloak.services.clientpolicy.condition.ClientPolicyConditionProvider"][]? | select(.id=="grant-type")] | length')
        if [ "$has_condition" = "0" ] || [ -z "$has_condition" ]; then
            echo -e "${RED}This Keycloak cannot refuse the device grant by client policy (no grant-type condition). Start it with KC_FEATURES_DISABLED=device-flow, or set dcr.enabled=false.${NC}"
            return 1
        fi

        local profiles
        profiles=$(_admin_get "$token" "/admin/realms/${REALM}/client-policies/profiles") || return 1
        local new_profiles=$(echo "$profiles" | jq '
            {profiles: (((.profiles // []) | map(select(.name != "mcp-reject-request"))) + [{
                name: "mcp-reject-request",
                description: "Reject the request outright",
                executors: [{executor: "reject-request", configuration: {}}]
            }])}')
        local r1=$(realm_curl -s -o /dev/null -w "%{http_code}" \
            -X PUT "${KEYCLOAK_URL}/admin/realms/${REALM}/client-policies/profiles" \
            -H "Authorization: Bearer ${token}" -H "Content-Type: application/json" \
            -d "$new_profiles")

        local policies
        policies=$(_admin_get "$token" "/admin/realms/${REALM}/client-policies/policies") || return 1
        local new_policies=$(echo "$policies" | jq '
            {policies: (((.policies // []) | map(select(.name != "mcp-reject-device-code-grant"))) + [{
                name: "mcp-reject-device-code-grant",
                description: "Device grant bypasses the DCR Trusted Hosts redirect check",
                enabled: true,
                conditions: [{
                    condition: "grant-type",
                    configuration: {"grant_types": ["urn:ietf:params:oauth:grant-type:device_code"]}
                }],
                profiles: ["mcp-reject-request"]
            }])}')
        local r2=$(realm_curl -s -o /dev/null -w "%{http_code}" \
            -X PUT "${KEYCLOAK_URL}/admin/realms/${REALM}/client-policies/policies" \
            -H "Authorization: Bearer ${token}" -H "Content-Type: application/json" \
            -d "$new_policies")

        if { [ "$r1" = "204" ] || [ "$r1" = "200" ]; } && { [ "$r2" = "204" ] || [ "$r2" = "200" ]; }; then
            echo -e "${GREEN}Device authorization grant rejected (profile HTTP $r1, policy HTTP $r2).${NC}"
        else
            echo -e "${RED}Failed to configure the device-grant rejection policy (profile HTTP $r1, policy HTTP $r2).${NC}"
            return 1
        fi
    }

    verify_dcr_baseline_policies() {
        local token=$1

        echo "Verifying Keycloak's anonymous DCR baseline policies..."

        local components
        components=$(_admin_get "$token" "/admin/realms/${REALM}/components?type=org.keycloak.services.clientregistration.policy.ClientRegistrationPolicy") || return 1

        local provider missing=""
        for provider in consent-required scope max-clients allowed-protocol-mappers; do
            local found=$(echo "$components" | \
                jq -r --arg p "$provider" '[.[] | select(.subType=="anonymous" and .providerId==$p)] | length')
            if [ "$found" = "0" ]; then
                missing="${missing} ${provider}"
            fi
        done

        if [ -n "$missing" ]; then
            echo -e "${RED}Anonymous DCR policies missing from realm '${REALM}':${missing}. Restore them under Clients -> Client registration before enabling DCR.${NC}"
            return 1
        fi
        echo -e "${GREEN}Anonymous DCR baseline policies present.${NC}"
    }

    # Restrict OAuth token exchange (RFC 8693) to clients that hold a client role
    # named 'token-exchange'.
    restrict_token_exchange() {
        local token=$1

        echo "Restricting token exchange to clients with the 'token-exchange' client role..."

        local serverinfo
        serverinfo=$(_admin_get "$token" "/admin/serverinfo") || return 1
        local has_condition=$(echo "$serverinfo" | \
            jq -r '[.componentTypes["org.keycloak.services.clientpolicy.condition.ClientPolicyConditionProvider"][]? | select(.id=="grant-type")] | length')
        local standard_exchange=$(echo "$serverinfo" | \
            jq -r '[.features[]? | select(.name=="TOKEN_EXCHANGE_STANDARD_V2") | .enabled | tostring] | first // "false"')
        if [ "$standard_exchange" != true ]; then
            echo "Standard token exchange is disabled; existing exchange policy retained."
            return 0
        fi
        if [ "$has_condition" = "0" ] || [ -z "$has_condition" ]; then
            echo "Standard token exchange requires the grant-type client-policy condition." >&2
            return 1
        fi

        _require_supported_keycloak "$KEYCLOAK_URL" "$token" || return 1

        local web_clients
        web_clients=$(_admin_get "$token" "/admin/realms/${REALM}/clients?clientId=mcp-gateway-web") || return 1
        local web_id=$(echo "$web_clients" | jq -r '[.[] | select(.clientId == "mcp-gateway-web")][0].id // empty')
        if [ -z "$web_id" ]; then
            echo -e "${RED}Client mcp-gateway-web not found; cannot mark it for token exchange.${NC}"
            return 1
        fi
        local role_status=$(realm_curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${KEYCLOAK_URL}/admin/realms/${REALM}/clients/${web_id}/roles" \
            -H "Authorization: Bearer ${token}" -H "Content-Type: application/json" \
            -d '{"name": "token-exchange", "description": "This client may use OAuth token exchange"}')
        if [ "$role_status" != "201" ] && [ "$role_status" != "409" ]; then
            echo -e "${RED}Failed to create the 'token-exchange' role on mcp-gateway-web. HTTP status: ${role_status}${NC}"
            return 1
        fi

        local profiles
        profiles=$(_admin_get "$token" "/admin/realms/${REALM}/client-policies/profiles") || return 1
        local new_profiles=$(echo "$profiles" | jq '
            {profiles: (((.profiles // []) | map(select(.name != "mcp-reject-request"))) + [{
                name: "mcp-reject-request",
                description: "Reject the request outright",
                executors: [{executor: "reject-request", configuration: {}}]
            }])}')
        local r1=$(realm_curl -s -o /dev/null -w "%{http_code}" \
            -X PUT "${KEYCLOAK_URL}/admin/realms/${REALM}/client-policies/profiles" \
            -H "Authorization: Bearer ${token}" -H "Content-Type: application/json" \
            -d "$new_profiles")

        local policies
        policies=$(_admin_get "$token" "/admin/realms/${REALM}/client-policies/policies") || return 1
        local new_policies=$(echo "$policies" | jq '
            {policies: (((.policies // []) | map(select(.name != "mcp-restrict-token-exchange"))) + [{
                name: "mcp-restrict-token-exchange",
                description: "Only clients with a token-exchange client role may exchange tokens",
                enabled: true,
                mode: "STRICT",
                conditions: [
                    {condition: "grant-type", configuration: {"grant_types": ["urn:ietf:params:oauth:grant-type:token-exchange"]}},
                    {condition: "client-roles", configuration: {"roles": ["token-exchange"], "is-negative-logic": true}}
                ],
                profiles: ["mcp-reject-request"]
            }])}')
        local r2=$(realm_curl -s -o /dev/null -w "%{http_code}" \
            -X PUT "${KEYCLOAK_URL}/admin/realms/${REALM}/client-policies/policies" \
            -H "Authorization: Bearer ${token}" -H "Content-Type: application/json" \
            -d "$new_policies")

        if { [ "$r1" = "204" ] || [ "$r1" = "200" ]; } && { [ "$r2" = "204" ] || [ "$r2" = "200" ]; }; then
            echo -e "${GREEN}Token exchange restricted (profile HTTP $r1, policy HTTP $r2).${NC}"
        else
            echo -e "${RED}Failed to configure the token-exchange restriction (profile HTTP $r1, policy HTTP $r2).${NC}"
            return 1
        fi
    }

    # Enable CIMD (OAuth Client ID Metadata Documents): let MCP clients whose
    # client_id is an https URL (e.g. VS Code, Claude Code) authenticate by
    # publishing their own metadata document -- Keycloak fetches + validates it,
    # no pre-registration. Requires the server 'cimd' feature (KC_FEATURES=cimd).
    #
    # Configures a client policy = a `client-id-uri` condition (scheme https +
    # permitted domains) applying the native `client-id-metadata-document` executor.
    # NOTE: the executor's permitted-domains must list EVERY host a trusted
    # client's document references -- the client_id host, its loopback redirect
    # hosts (127.0.0.1/localhost), and any logo_uri/client_uri CDN hosts -- or
    # the fetch is rejected ("not trusted domain: host = ..."). The condition,
    # which decides which client_id URLs Keycloak fetches at all, gets the same
    # list WITHOUT the loopback hosts: they are only ever redirect hosts, and a
    # loopback client_id would make Keycloak fetch a "metadata document" from
    # itself.
    configure_cimd_client_policy() {
        local ENABLE_CIMD_CONFIG=true
        _configure_cimd_client_policy "$1"
    }

    # cimd.enabled=false: remove the policy and profile configure_cimd_client_policy
    # writes, preserving every other client policy/profile. The policy goes
    # first because it references the profile.
    remove_cimd_client_policy() {
        local ENABLE_CIMD_CONFIG=false
        configure_registration_security_policy "$1" || return 1
        _remove_cimd_client_policy "$1"
    }

    # Function to generate random password
    generate_password() {
        # Generate a 16-character random password with alphanumeric characters
        openssl rand -base64 12 | tr -d "=+/" | cut -c1-16
    }

    # Main execution
    main() {
        # Get script directory and find .env file
        SCRIPT_DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"
        PROJECT_ROOT="$( cd "$SCRIPT_DIR/../.." && pwd )"
        ENV_FILE="$PROJECT_ROOT/.env"

        # Load environment variables from .env file if it exists
        if [ -f "$ENV_FILE" ]; then
            echo "Loading environment variables from $ENV_FILE..."
            set -a  # Automatically export all variables
            source "$ENV_FILE"
            set +a  # Turn off automatic export
            echo "Environment variables loaded successfully"
        else
            echo "No .env file found at $ENV_FILE"
            echo "Current directory: $(pwd)"
            echo "Script directory: $SCRIPT_DIR"
            echo "Project root: $PROJECT_ROOT"
        fi

        # Resolve registry user passwords. Order of precedence:
        #   1. Caller-exported INITIAL_ADMIN_PASSWORD / INITIAL_USER_PASSWORD
        #      (e.g. operator-supplied via --set-string).
        #   2. Existing registry-login-credentials secret (helm upgrade case —
        #      preserve passwords across re-runs so users don't get rotated
        #      out from under their already-stored credentials).
        #   3. Freshly generated (first install case).
        # Without (2), every helm upgrade rotates the secret and (because the
        # realm user POST returns 409) the realm keeps the OLD password while
        # the secret advertises the new one. Operators lose the ability to log
        # in until they reset by hand.
        if [ -z "$INITIAL_ADMIN_PASSWORD" ]; then
            existing_admin=$(kubectl get secret registry-login-credentials \
                -o jsonpath='{.data.REGISTRY_ADMIN_PASSWORD}' 2>/dev/null \
                | base64 -d 2>/dev/null || true)
            if [ -n "$existing_admin" ]; then
                INITIAL_ADMIN_PASSWORD="$existing_admin"
                echo "Reusing admin password from existing registry-login-credentials secret"
            else
                INITIAL_ADMIN_PASSWORD=$(generate_password)
                echo -e "${YELLOW}Generated new admin password (first install)${NC}"
            fi
        fi

        if [ -z "$INITIAL_USER_PASSWORD" ]; then
            existing_user=$(kubectl get secret registry-login-credentials \
                -o jsonpath='{.data.REGISTRY_USER_PASSWORD}' 2>/dev/null \
                | base64 -d 2>/dev/null || true)
            if [ -n "$existing_user" ]; then
                INITIAL_USER_PASSWORD="$existing_user"
                echo "Reusing testuser password from existing registry-login-credentials secret"
            else
                INITIAL_USER_PASSWORD=$(generate_password)
                echo -e "${YELLOW}Generated new testuser password (first install)${NC}"
            fi
        fi

        # Store passwords in variables for later use
        export INITIAL_ADMIN_PASSWORD
        export INITIAL_USER_PASSWORD

        # Override KEYCLOAK_URL with KEYCLOAK_ADMIN_URL for API calls
        KEYCLOAK_URL="${KEYCLOAK_ADMIN_URL:-http://localhost:8080}"
        KEYCLOAK_ADMIN="${KEYCLOAK_ADMIN:-admin}"
        echo "Using Keycloak API URL: $KEYCLOAK_URL"

        # Check if admin password is set
        if [ -z "$KEYCLOAK_ADMIN_PASSWORD" ]; then
            echo -e "${RED}Error: KEYCLOAK_ADMIN_PASSWORD environment variable is not set${NC}"
            echo "Please set it in .env file or export it before running this script"
            exit 1
        fi

        if [ -z "$KEYCLOAK_CLIENT_SECRET" ] || [ -z "$KEYCLOAK_M2M_CLIENT_SECRET" ]; then
            echo -e "${RED}Error: KEYCLOAK_CLIENT_SECRET / KEYCLOAK_M2M_CLIENT_SECRET are not set${NC}"
            echo "They are supplied by the keycloak-client-secret Secret rendered by the chart."
            echo "Check global.existingKeycloakClientSecret and that the Secret holds both keys."
            exit 1
        fi

        # Wait for Keycloak to be ready
        wait_for_keycloak

        # Get admin token
        echo "Authenticating with Keycloak..."
        TOKEN=$(get_admin_token)

        if [ -z "$TOKEN" ]; then
            echo -e "${RED}Error: Failed to authenticate with Keycloak${NC}"
            echo "Please check your admin credentials"
            exit 1
        fi

        echo -e "${GREEN}Authentication successful!${NC}"

        preflight_dcr_upgrade "$TOKEN" || exit 1
        reconcile_registration_security "$TOKEN" || exit 1
        harden_master_realm "$TOKEN" || exit 1
        # Create realm and configure it step by step
        if create_realm "$TOKEN"; then
            reconcile_registration_security "$TOKEN" || exit 1
            configure_dcr_allowed_scopes "$TOKEN" || exit 1
            configure_dcr_allowed_mapper_types "$TOKEN" || exit 1
            _check_realm_group_path_mappers "$KEYCLOAK_URL" "$REALM" "$TOKEN" || exit 1
            create_clients "$TOKEN"
            create_scopes "$TOKEN" || exit 1
            configure_registration_security_policy "$TOKEN" || exit 1
            create_groups "$TOKEN"
            create_users "$TOKEN"
            create_service_account_user "$TOKEN"
            verify_client_secrets "$TOKEN"
            setup_groups_mapper "$TOKEN"
            setup_m2m_scopes "$TOKEN"

            # Groups + audience mappers on the `basic` scope run whether or not
            # DCR is on: `basic` is attached to every client, and the
            # aud="mcp-gateway" mapper is what puts the gateway's audience in
            # the web and M2M clients' tokens too. Without it the gateway
            # rejects every token.
            setup_dcr_groups_mapper "$TOKEN"
            setup_dcr_audience_mapper "$TOKEN"

            # The master admin token lives 60 seconds by default, and the steps
            # above can take longer on a large realm. Every read below fails the
            # Job on an error response, so each long step starts with a fresh token.
            _refresh_admin_token
            update_client_groups_mappers "$TOKEN"
            _refresh_admin_token

            # Runs with DCR on or off, before the DCR steps: no client may hold
            # the clientId that equals the audience every user token carries.
            reserve_gateway_audience_client "$TOKEN"

            # MCP DCR support: an explicit Allowed Client Scopes allowlist,
            # Trusted Hosts relaxed for cloud-egress MCP clients, no
            # client-supplied mappers, no device grant.
            #
            # Gated by ENABLE_DCR_CONFIG (chart value: dcr.enabled, default
            # false). When off, anonymous registration is disabled instead,
            # and the scope and mapper restrictions still apply, so turning DCR
            # off in the chart turns it off in the realm.
            if [ "${ENABLE_DCR_CONFIG:-false}" = "true" ]; then
                echo ""
                echo -e "${YELLOW}=== Configuring Keycloak realm for MCP Dynamic Client Registration ===${NC}"
                configure_dcr_reject_device_grant "$TOKEN" || exit 1
                verify_dcr_baseline_policies "$TOKEN" || exit 1
                configure_dcr_trusted_hosts "$TOKEN" || exit 1
            else
                echo ""
                echo -e "${YELLOW}=== DCR disabled (ENABLE_DCR_CONFIG=${ENABLE_DCR_CONFIG:-false}): turning off anonymous registration ===${NC}"
                configure_dcr_default_roles "$TOKEN" false || exit 1
            fi

            # Only the gateway client may use token exchange (runs with DCR on or off).
            restrict_token_exchange "$TOKEN"

            # MCP CIMD support: a client policy that lets clients present an
            # https URL client_id (their published metadata document) instead of
            # pre-registering. Requires KC_FEATURES=cimd on the Keycloak server.
            # Gated by ENABLE_CIMD_CONFIG (chart value: cimd.enabled).
            if [ "${ENABLE_CIMD_CONFIG:-false}" = "true" ]; then
                echo ""
                echo -e "${YELLOW}=== Configuring Keycloak realm for MCP Client ID Metadata Documents (CIMD) ===${NC}"
                configure_cimd_client_policy "$TOKEN"
            fi
        else
            exit 1
        fi

        # Save passwords to a Kubernetes secret. Uses `apply` so the Job can
        # be re-run by the post-install/post-upgrade Helm hook without failing
        # with AlreadyExists.
        #
        # Drift-free across re-runs because: (1) main() reuses passwords from
        # this same secret when it already exists, and (2) upsert_user() PUTs
        # /reset-password on 409 so the realm side picks up the same value.
        # Feed credentials over stdin so they are absent from kubectl argv and logs.
        printf 'REGISTRY_ADMIN_NAME=%s\nREGISTRY_ADMIN_PASSWORD=%s\nREGISTRY_USER_NAME=%s\nREGISTRY_USER_PASSWORD=%s\n' \
          'admin' "$INITIAL_ADMIN_PASSWORD" 'testuser' "$INITIAL_USER_PASSWORD" \
          | kubectl create secret generic registry-login-credentials \
              --from-env-file=/dev/stdin --dry-run=client -o yaml \
          | kubectl apply -f -

        echo ""
        echo -e "${GREEN}Keycloak initialization complete!${NC}"
        echo ""
        echo "You can now access Keycloak at: ${KEYCLOAK_URL}"
        echo "Admin console: ${KEYCLOAK_URL}/admin"
        echo "Realm: ${REALM}"
        echo "Credentials are saved to the Kubernetes secret: registry-login-credentials" # pragma: allowlist secret
        echo "Retrieve them from the Secret; the setup Job does not print passwords."
    }

    # Run main function
    main
{{- end }}
