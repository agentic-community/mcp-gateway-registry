suite: Registration policy configuration
templates:
  - templates/job.yaml
release:
  name: test
  namespace: default
tests:
  - it: defaults to DCR cleanup while requiring CIMD cleanup approval
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENABLE_DCR_CONFIG
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DCR_SWEEP_ACKNOWLEDGED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CIMD_SWEEP_ACKNOWLEDGED
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENABLE_CIMD_CONFIG
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REGISTRATION_TRUSTED_CLIENT_IDS
            value: '[]'
  - it: enables DCR with the operator's scope allowlist
    set:
      dcr.enabled: true
      dcr.allowedScopes: [openid, basic, profile, email]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENABLE_DCR_CONFIG
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DCR_ALLOWED_SCOPES
            value: "openid basic profile email"
  - it: rejects an empty DCR scope allowlist
    set:
      dcr.allowedScopes: []
    asserts:
      - failedTemplate: {}
  - it: preserves the operator's explicit DCR-off keep list
    set:
      dcr.sweepAcknowledged: true
      dcr.keepClients: [operator-browser, partner-web]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DCR_SWEEP_ACKNOWLEDGED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DCR_KEEP_CLIENTS
            value: "operator-browser partner-web"
  - it: enables CIMD independently of DCR with explicit document hosts
    set:
      cimd.enabled: true
      cimd.trustedDomains: [vendor.example, localhost, "127.0.0.1"]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENABLE_DCR_CONFIG
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENABLE_CIMD_CONFIG
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CIMD_TRUSTED_DOMAINS
            value: '["vendor.example","localhost","127.0.0.1"]'
  - it: rejects simultaneous DCR and CIMD before running the setup Job
    set:
      dcr.enabled: true
      cimd.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: cannot enable dcr.enabled and cimd.enabled together
  - it: keeps scope trust separate from the DCR cleanup keep list
    set:
      dcr.keepClients: [browser-client]
      registrationTrustedClientIds: [operator-machine]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REGISTRATION_TRUSTED_CLIENT_IDS
            value: '["operator-machine"]'
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DCR_KEEP_CLIENTS
            value: browser-client
