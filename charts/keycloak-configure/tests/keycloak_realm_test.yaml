suite: Keycloak realm validation
templates:
  - secret.yaml
  - job.yaml
release:
  name: test
  namespace: default
tests:
  - it: refuses conflicting global and local realms
    set:
      global.authProvider.type: keycloak
      global.authProvider.keycloak.realm: team-realm
      keycloak.realm: other-realm
    asserts:
      - failedTemplate: {}
        template: secret.yaml
  - it: refuses exposing the master realm
    set:
      global.authProvider.type: keycloak
      global.authProvider.keycloak.realm: master
    asserts:
      - failedTemplate: {}
        template: secret.yaml
  - it: refuses an existing config Secret without an explicit matching realm
    templates:
      - job.yaml
    set:
      keycloak.existingSecret: operator-realm-secret # pragma: allowlist secret - Secret name
    asserts:
      - failedTemplate: {}
        template: job.yaml
  - it: applies the explicit custom realm and BYO admin credential to the Job
    templates:
      - job.yaml
    set:
      keycloak.existingSecret: operator-realm-secret # pragma: allowlist secret - Secret name
      keycloak.realm: team
      keycloak.adminExistingSecret: operator-admin # pragma: allowlist secret - Secret name
      keycloak.adminExistingSecretPasswordKey: credential # pragma: allowlist secret - Secret data key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REALM
            value: team
        template: job.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KEYCLOAK_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: operator-admin
                key: credential
        template: job.yaml
  - it: renders the same custom realm in generated configuration and Job
    templates:
      - secret.yaml
      - job.yaml
    set:
      global.authProvider.keycloak.realm: team
    asserts:
      - equal:
          path: data.REALM
          decodeBase64: true
          value: team
        template: secret.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REALM
            value: team
        template: job.yaml
