{{- if include "keycloak.enabled" . }}
{{- $pg := .Values.postgres }}
{{- $pgSecret := include "keycloak.pgSecretName" . }}
---
# Headless service governing the postgres StatefulSet.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "keycloak.postgresHeadlessName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "keycloak.commonLabels" . | nindent 4 }}
    {{- include "keycloak.postgresSelectorLabels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "keycloak.postgresSelectorLabels" . | nindent 4 }}
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
# ClusterIP service Keycloak connects to (KC_DB_URL_HOST).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "keycloak.postgresName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "keycloak.commonLabels" . | nindent 4 }}
    {{- include "keycloak.postgresSelectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "keycloak.postgresSelectorLabels" . | nindent 4 }}
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "keycloak.postgresName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "keycloak.commonLabels" . | nindent 4 }}
    {{- include "keycloak.postgresSelectorLabels" . | nindent 4 }}
spec:
  serviceName: {{ include "keycloak.postgresHeadlessName" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "keycloak.postgresSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "keycloak.commonLabels" . | nindent 8 }}
        {{- include "keycloak.postgresSelectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: "{{ $pg.image.repository }}:{{ $pg.image.tag }}"
          imagePullPolicy: {{ $pg.image.pullPolicy }}
          securityContext:
            {{- include "keycloak.containerSecurityContext" . | nindent 12 }}
          command: ["/bin/bash", "/opt/keycloak-bootstrap/bootstrap.sh"]
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            # Bootstrap runs against a socket-only staging cluster. No TCP
            # listener is started until initialization/restore has committed.
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $pgSecret }}
                  key: {{ $pg.existingSecretAdminPasswordKey }}
            - name: KEYCLOAK_DB_USER
              value: {{ $pg.username | quote }}
            - name: KEYCLOAK_DB_NAME
              value: {{ $pg.database | quote }}
            - name: KEYCLOAK_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $pgSecret }}
                  key: {{ $pg.existingSecretPasswordKey }}
            # Subdir keeps the cluster off the volume root (avoids lost+found).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: BOOTSTRAP_MODE
              value: {{ $pg.bootstrap.mode | quote }}
            - name: BOOTSTRAP_SHA256
              value: {{ $pg.bootstrap.sha256 | quote }}
            - name: BOOTSTRAP_SOURCE_QUIESCED
              value: {{ $pg.bootstrap.sourceQuiesced | toString | quote }}
            - name: BOOTSTRAP_EXISTING_VERIFIED
              value: {{ $pg.bootstrap.existingVerified | toString | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # Writable paths under the read-only root: the server's socket and
            # lock directory, and /tmp.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: init
              mountPath: /opt/keycloak-bootstrap
              readOnly: true
            {{- if eq $pg.bootstrap.mode "restore" }}
            # Operator-owned immutable archive, retained through verification.
            - name: migration
              mountPath: /migration
              readOnly: true
            {{- end }}
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -f \"$PGDATA/.keycloak-bootstrap-complete\" && pg_isready -U \"$KEYCLOAK_DB_USER\" -d \"$KEYCLOAK_DB_NAME\" -h 127.0.0.1"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U \"$KEYCLOAK_DB_USER\" -d \"$KEYCLOAK_DB_NAME\" -h 127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "test -f \"$PGDATA/.keycloak-bootstrap-complete\" && pg_isready -h 127.0.0.1"]
            periodSeconds: 10
            failureThreshold: {{ $pg.bootstrap.startupFailureThreshold }}
          {{- with $pg.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $pg.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: init
          configMap:
            name: {{ include "keycloak.postgresInitName" . }}
            defaultMode: 0555
        {{- if eq $pg.bootstrap.mode "restore" }}
        - name: migration
          persistentVolumeClaim:
            claimName: {{ $pg.bootstrap.existingClaim | quote }}
            readOnly: true
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if $pg.persistence.storageClass }}
        storageClassName: {{ $pg.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $pg.persistence.size | quote }}
{{- end }}
