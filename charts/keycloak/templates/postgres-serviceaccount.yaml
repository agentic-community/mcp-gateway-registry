{{- $account := .Values.postgres.serviceAccount }}
{{- if and (include "keycloak.enabled" .) $account.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $account.name | default (include "keycloak.postgresName" .) | quote }}
  {{- with $account.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
