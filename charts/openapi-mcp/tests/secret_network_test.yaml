suite: openapi-mcp sync secret, service and network policy
release:
  name: test
  namespace: default
tests:
  - it: generates a 48-character sync secret on first install
    templates:
      - secret.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: openapi-mcp-sync-secret
      - matchRegex:
          path: data.OPENAPI_MCP_SYNC_SECRET
          # base64 of 48 bytes is 64 characters
          pattern: ^[A-Za-z0-9+/]{64}$

  - it: uses an explicit sync secret value
    templates:
      - secret.yaml
    set:
      syncSecret.value: YOUR_SYNC_SECRET_OF_AT_LEAST_32_CHARS # pragma: allowlist secret
    asserts:
      - equal:
          path: data.OPENAPI_MCP_SYNC_SECRET
          value: WU9VUl9TWU5DX1NFQ1JFVF9PRl9BVF9MRUFTVF8zMl9DSEFSUw==

  - it: rejects an explicit sync secret shorter than 32 characters
    templates:
      - secret.yaml
    set:
      syncSecret.value: too-short # pragma: allowlist secret
    asserts:
      - failedTemplate:
          errorPattern: "32 characters or more"

  - it: refuses to generate when global.generateSecrets is false
    templates:
      - secret.yaml
    set:
      global.generateSecrets: false
    asserts:
      - failedTemplate:
          errorPattern: "global.generateSecrets is false"

  - it: creates no Secret when the operator names one
    templates:
      - secret.yaml
    set:
      syncSecret.existingSecret: my-sync
    asserts:
      - hasDocuments:
          count: 0

  - it: creates no Secret when global.openapiMcp.existingSyncSecret is set
    templates:
      - secret.yaml
    set:
      global.openapiMcp.existingSyncSecret: my-sync
    asserts:
      - hasDocuments:
          count: 0

  - it: exposes a ClusterIP Service named openapi-mcp on 9876
    templates:
      - service.yaml
    asserts:
      - equal:
          path: metadata.name
          value: openapi-mcp
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 9876

  - it: admits only registry and auth-server pods on the container port
    templates:
      - networkpolicy.yaml
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: openapi-mcp
      - equal:
          path: spec.policyTypes
          value: [Ingress]
      - equal:
          path: spec.ingress
          value:
            - from:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/name: registry
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/name: auth-server
              ports:
                - protocol: TCP
                  port: 9876

  - it: adds a namespace selector to both peers when they run elsewhere
    templates:
      - networkpolicy.yaml
    set:
      networkPolicy.fromNamespaceSelector:
        kubernetes.io/metadata.name: gateway
    asserts:
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels
          value:
            kubernetes.io/metadata.name: gateway
      - equal:
          path: spec.ingress[0].from[1].namespaceSelector.matchLabels
          value:
            kubernetes.io/metadata.name: gateway

  - it: follows an operator's auth-server pod selector
    templates:
      - networkpolicy.yaml
    set:
      networkPolicy.authServerPodSelector:
        app.kubernetes.io/name: my-auth
    asserts:
      - equal:
          path: spec.ingress[0].from[1].podSelector.matchLabels
          value:
            app.kubernetes.io/name: my-auth

  - it: rejects an empty auth-server pod selector
    templates:
      - networkpolicy.yaml
    set:
      networkPolicy.authServerPodSelector: null
    asserts:
      - failedTemplate:
          errorPattern: "authServerPodSelector must not be empty"

  - it: keeps an operator's networkPolicy.enabled=false
    templates:
      - networkpolicy.yaml
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
