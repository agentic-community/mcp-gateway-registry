{{- /*
Sync secret shared by the registry and openapi-mcp (issue #2022). Skipped when
the operator names an existing Secret. Otherwise: an explicit syncSecret.value
wins, then the value already stored (so an upgrade keeps it), then 48 random
characters. With global.generateSecrets=false the chart refuses to generate,
because a GitOps render cannot read the stored value back and would rotate it
on every sync.
*/ -}}
{{- if not (include "openapi-mcp.usesExistingSyncSecret" .) }}
{{- $secretName := .Values.syncSecret.name }}
{{- $stored := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $value := .Values.syncSecret.value | default "" | trim }}
{{- if and (not $value) $stored (index $stored.data "OPENAPI_MCP_SYNC_SECRET") }}
  {{- $value = index $stored.data "OPENAPI_MCP_SYNC_SECRET" | b64dec }}
{{- end }}
{{- if not $value }}
  {{- if not (dig "generateSecrets" true .Values.global) }}
  {{- fail "global.generateSecrets is false and openapiMcp.syncSecret.value has no value, so the chart will not generate one. Set openapiMcp.syncSecret.value explicitly, or set global.openapiMcp.existingSyncSecret to a Secret that already holds OPENAPI_MCP_SYNC_SECRET." }}
  {{- end }}
  {{- $value = randAlphaNum 48 }}
{{- end }}
{{- if lt (len $value) 32 }}
{{- fail "openapiMcp.syncSecret.value must be 32 characters or more" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.app.name }}
    app.kubernetes.io/component: {{ .Values.app.name }}
type: Opaque
data:
  OPENAPI_MCP_SYNC_SECRET: {{ $value | b64enc | quote }}
{{- end }}
