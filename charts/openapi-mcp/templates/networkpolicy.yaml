{{- /*
Only the registry and auth-server pods may connect to openapi-mcp: the registry
pushes server state to it, nginx inside the registry pod proxies MCP traffic to
it, and the auth server's mcp-proxy hop forwards per-user-credential calls to
it. Every other source is denied, because the pod accepts any MCP request it is
sent.
*/ -}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.app.name }}-ingress
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.app.name }}
    app.kubernetes.io/component: {{ .Values.app.name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.app.name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # The registry pods.
        - podSelector:
            matchLabels:
              {{- required "openapi-mcp.networkPolicy.fromPodSelector must not be empty" .Values.networkPolicy.fromPodSelector | toYaml | nindent 14 }}
          {{- with .Values.networkPolicy.fromNamespaceSelector }}
          namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
        # The auth-server pods.
        - podSelector:
            matchLabels:
              {{- required "openapi-mcp.networkPolicy.authServerPodSelector must not be empty" .Values.networkPolicy.authServerPodSelector | toYaml | nindent 14 }}
          {{- with .Values.networkPolicy.fromNamespaceSelector }}
          namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.app.port }}
{{- end }}
