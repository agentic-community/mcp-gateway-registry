suite: otel otlp push endpoint
templates:
  - deployment.yaml
release:
  name: test
  namespace: default
tests:
  - it: omits OTEL_EXPORTER_OTLP_ENDPOINT when metrics.otelExporterOtlpEndpoint is empty
    asserts:
      # Default empty: the OTLP push exporter is not activated, so the
      # standard SDK var must not be rendered at all (presence alone, even
      # empty, would trip the entrypoint's opentelemetry-instrument wrap).
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT

  - it: omits OTEL_EXPORTER_OTLP_PROTOCOL when metrics.otelExporterOtlpEndpoint is empty
    asserts:
      # The protocol var is rendered inside the same endpoint guard, so it must
      # also be absent when OTLP push is not activated (issue #1316).
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_PROTOCOL

  - it: emits OTEL_EXPORTER_OTLP_ENDPOINT when metrics.otelExporterOtlpEndpoint is set
    set:
      metrics:
        otelExporterOtlpEndpoint: "http://otel-collector:4318"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://otel-collector:4318"

  - it: defaults OTEL_EXPORTER_OTLP_PROTOCOL to http/protobuf when endpoint is set
    set:
      metrics:
        otelExporterOtlpEndpoint: "http://otel-collector:4318"
    asserts:
      # The auth-server image ships only the HTTP/protobuf OTLP exporter (no
      # grpcio, for free-threaded Python 3.14t; issue #1316), so the protocol
      # must default to http/protobuf, not grpc.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_PROTOCOL
            value: "http/protobuf"

  - it: allows overriding OTEL_EXPORTER_OTLP_PROTOCOL via metrics.otelExporterOtlpProtocol
    set:
      metrics:
        otelExporterOtlpEndpoint: "http://otel-collector:4318"
        otelExporterOtlpProtocol: "http/json"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_PROTOCOL
            value: "http/json"

  - it: pins auto-instrumentation exporters when endpoint is set (issue #1316)
    set:
      metrics:
        otelExporterOtlpEndpoint: "http://otel-collector:4318"
    asserts:
      # opentelemetry-instrument defaults OTEL_*_EXPORTER to otlp_proto_grpc,
      # which is absent in the free-threaded auth image and crashes startup.
      # Metrics must use the HTTP exporter; traces/logs disabled (metrics-only
      # collector pipeline).
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_METRICS_EXPORTER
            value: "otlp_proto_http"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_TRACES_EXPORTER
            value: "none"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_LOGS_EXPORTER
            value: "none"

  - it: omits exporter selectors when otelExporterOtlpEndpoint is empty
    asserts:
      # All three are rendered inside the endpoint guard, so they must be absent
      # by default (no OTLP push -> no opentelemetry-instrument wrap).
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_METRICS_EXPORTER
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_TRACES_EXPORTER
