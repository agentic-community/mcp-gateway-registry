suite: egress credential vault config
templates:
  - templates/configmap-egress.yaml
tests:
  - it: is absent when egressAuth is disabled (default)
    asserts:
      - hasDocuments:
          count: 0

  - it: renders only the auth-server subset when enabled
    set:
      egressAuth:
        enabled: true
        registryInternalUrl: http://registry:8091
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: auth-server-egress-config
      - equal:
          path: data.EGRESS_AUTH_ENABLED
          value: "true"
      - equal:
          path: data.EGRESS_REGISTRY_INTERNAL_URL
          value: "http://registry:8091"
      # registry.core.config validation requires a non-empty callback base URL
      # when egress is enabled; standalone (no global.ingress) derives the
      # subdomain-mode default from the localhost fallback.
      - equal:
          path: data.EGRESS_OAUTH_CALLBACK_BASE_URL
          value: "http://mcpregistry.localhost"
      # Auth-server does NOT touch the secret store: these must be absent.
      - notExists:
          path: data.SECRET_STORE_BACKEND
      - notExists:
          path: data.OPENBAO_ADDR
      - notExists:
          path: data.AUTH_SERVER_NGINX_MARKER_SECRET
      # Trusted-IdP-hosts is opt-in; omitted from the ConfigMap when unset.
      - notExists:
          path: data.EGRESS_OAUTH_TRUSTED_IDP_HOSTS

  - it: derives the path-mode callback base URL from global.domain
    set:
      global:
        domain: agents-path.example.com
        ingress:
          routingMode: path
          tls: true
      egressAuth:
        enabled: true
    asserts:
      - equal:
          path: data.EGRESS_OAUTH_CALLBACK_BASE_URL
          value: "https://agents-path.example.com"

  - it: an explicit oauthCallbackBaseUrl overrides the derived value
    set:
      global:
        domain: agents-path.example.com
        ingress:
          routingMode: path
          tls: true
      egressAuth:
        enabled: true
        oauthCallbackBaseUrl: https://login.example.com
    asserts:
      - equal:
          path: data.EGRESS_OAUTH_CALLBACK_BASE_URL
          value: "https://login.example.com"

  - it: renders EGRESS_OAUTH_TRUSTED_IDP_HOSTS when set (OBO against a private IdP)
    set:
      egressAuth:
        enabled: true
        oauthTrustedIdpHosts: "keycloak.internal.example.com,login.corp.example.net"
    asserts:
      - equal:
          path: data.EGRESS_OAUTH_TRUSTED_IDP_HOSTS
          value: "keycloak.internal.example.com,login.corp.example.net"

  - it: renders the egress HTTP pool knobs with their defaults
    set:
      egressAuth:
        enabled: true
    asserts:
      # These four feed httpx.Limits on the pooled egress clients. Only this suite
      # checks the configmap actually carries them: helm lint / template /
      # kubeconform do not look at data contents.
      - equal:
          path: data.EGRESS_HTTP_POOL_MAX_CONNECTIONS
          value: "100"
      - equal:
          path: data.EGRESS_HTTP_POOL_MAX_KEEPALIVE
          value: "20"
      - equal:
          path: data.EGRESS_HTTP_POOL_KEEPALIVE_EXPIRY_SECONDS
          value: "30"
      - equal:
          path: data.EGRESS_HTTP_POOL_CONNECT_RETRIES
          value: "1"

  - it: honours overridden egress HTTP pool knobs
    set:
      egressAuth:
        enabled: true
        httpPoolMaxConnections: "250"
        httpPoolMaxKeepalive: "50"
        httpPoolKeepaliveExpirySeconds: "15"
        httpPoolConnectRetries: "3"
    asserts:
      - equal:
          path: data.EGRESS_HTTP_POOL_MAX_CONNECTIONS
          value: "250"
      - equal:
          path: data.EGRESS_HTTP_POOL_MAX_KEEPALIVE
          value: "50"
      # Keep this below the shortest upstream/LB idle timeout: too high turns every
      # idle gap into a reset, which shows up as mcpgw_registry_egress_conn_reset_total.
      - equal:
          path: data.EGRESS_HTTP_POOL_KEEPALIVE_EXPIRY_SECONDS
          value: "15"
      - equal:
          path: data.EGRESS_HTTP_POOL_CONNECT_RETRIES
          value: "3"

  - it: derives the subdomain callback URL from the configured registry prefix
    set:
      global:
        domain: example.com
        ingress:
          routingMode: subdomain
          registrySubdomain: mcp-gateway
          tls: true
      egressAuth:
        enabled: true
    asserts:
      - equal:
          path: data.EGRESS_OAUTH_CALLBACK_BASE_URL
          value: "https://mcp-gateway.example.com"

  - it: defaults to the dedicated internal vend listener when egress is enabled
    set:
      egressAuth:
        enabled: true
    asserts:
      # The dedicated internal vend listener is the default (values.yaml).
      - equal:
          path: data.EGRESS_REGISTRY_INTERNAL_URL
          value: "http://registry:8091"
