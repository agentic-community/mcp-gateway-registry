suite: federation secret generation is gated (GitOps safety)
release:
  name: test
  namespace: default
templates:
  - templates/secret.yaml
tests:
  - it: generates federation values by default when federation is enabled
    set:
      app:
        secretKey: test-key-not-for-prod # pragma: allowlist secret
        federationStaticTokenAuthEnabled: true
      egressAuth:
        markerSecret: test-marker-not-for-prod # pragma: allowlist secret
    asserts:
      - isNotEmpty:
          path: data.FEDERATION_STATIC_TOKEN
      - isNotEmpty:
          path: data.FEDERATION_ENCRYPTION_KEY

  - it: refuses to invent federation values when generation is disabled
    set:
      global:
        generateSecrets: false
      app:
        secretKey: test-key-not-for-prod # pragma: allowlist secret
        federationStaticTokenAuthEnabled: true
      egressAuth:
        markerSecret: test-marker-not-for-prod # pragma: allowlist secret
    asserts:
      - failedTemplate:
          errorPattern: 'FEDERATION_STATIC_TOKEN has no value.*Set global\.federation\.staticToken.*on auth-server and registry'

  - it: accepts explicit federation values when generation is disabled
    set:
      global:
        generateSecrets: false
      app:
        secretKey: test-key-not-for-prod # pragma: allowlist secret
        federationStaticTokenAuthEnabled: true
        federationStaticToken: fed-token
        federationEncryptionKey: fed-key
      egressAuth:
        markerSecret: test-marker-not-for-prod # pragma: allowlist secret
    asserts:
      - equal:
          path: data.FEDERATION_STATIC_TOKEN
          value: ZmVkLXRva2Vu # fed-token
      - equal:
          path: data.FEDERATION_ENCRYPTION_KEY
          value: ZmVkLWtleQ== # fed-key

  # A disabled feature must never block a GitOps render.
  - it: does not demand federation values when federation is disabled
    set:
      global:
        generateSecrets: false
      app:
        secretKey: test-key-not-for-prod # pragma: allowlist secret
      egressAuth:
        markerSecret: test-marker-not-for-prod # pragma: allowlist secret
    asserts:
      - notFailedTemplate:
          template: templates/secret.yaml
