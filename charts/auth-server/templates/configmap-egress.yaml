{{- /*
Per-user egress credential vault — NON-secret config.

Rendered only when egressAuth.enabled. The auth-server needs the feature flag +
the internal vend URL (it calls the registry's /_egress_internal vend endpoint).
It becomes a SecretStore client ONLY when the opt-in exchanged-OBO-token cache is
enabled (EGRESS_OBO_CACHE_ENABLED), so the secret-store backend vars
(SECRET_STORE_BACKEND / SECRETS_MANAGER_* / OPENBAO_*) are rendered here too and
MUST match the registry chart. The marker secret (AUTH_SERVER_NGINX_MARKER_SECRET)
lives in the chart-managed env secret / the stack shared-secret. Wired in via
`envFrom: configMapRef` in deployment.yaml.
*/ -}}
{{- if .Values.egressAuth.enabled }}
{{- /*
EGRESS_OAUTH_CALLBACK_BASE_URL: the auth-server imports registry.core.config,
whose startup validation REQUIRES this whenever EGRESS_AUTH_ENABLED=true (it
raises ValueError otherwise and the pod crash-loops). The auth-server never uses
the value itself, but it must be present + non-empty to pass validation. Derive
it from global.domain + the ingress routing mode exactly like the registry's
configmap-egress.yaml so both pods agree on the public callback host. An explicit
egressAuth.oauthCallbackBaseUrl wins.
*/ -}}
{{- $ingress := .Values.global.ingress | default dict }}
{{- $routingMode := $ingress.routingMode | default "subdomain" }}
{{- $domain := .Values.global.domain | default "localhost" }}
{{- $protocol := ternary "https" "http" ($ingress.tls | default false) }}
{{- $derivedCallbackBaseUrl := "" }}
{{- if eq $routingMode "path" }}
  {{- $derivedCallbackBaseUrl = printf "%s://%s" $protocol $domain }}
{{- else }}
  {{- $derivedCallbackBaseUrl = printf "%s://mcpregistry.%s" $protocol $domain }}
{{- end }}
{{- $callbackBaseUrl := .Values.egressAuth.oauthCallbackBaseUrl | default $derivedCallbackBaseUrl }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-server-egress-config
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.app.name }}
    app.kubernetes.io/component: {{ .Values.app.name }}
data:
  EGRESS_AUTH_ENABLED: {{ .Values.egressAuth.enabled | toString | quote }}
  EGRESS_REGISTRY_INTERNAL_URL: {{ .Values.egressAuth.registryInternalUrl | default "http://registry:8091" | quote }}
  EGRESS_OAUTH_CALLBACK_BASE_URL: {{ $callbackBaseUrl | quote }}
  # Egress httpx client connection pooling (shared by url_guard). Keep the
  # keepalive expiry below the shortest upstream/LB idle timeout. MUST match the
  # registry chart's registry.egressAuth.httpPool* values.
  EGRESS_HTTP_POOL_MAX_CONNECTIONS: {{ .Values.egressAuth.httpPoolMaxConnections | default "100" | quote }}
  EGRESS_HTTP_POOL_MAX_KEEPALIVE: {{ .Values.egressAuth.httpPoolMaxKeepalive | default "20" | quote }}
  EGRESS_HTTP_POOL_KEEPALIVE_EXPIRY_SECONDS: {{ .Values.egressAuth.httpPoolKeepaliveExpirySeconds | default "30" | quote }}
  EGRESS_HTTP_POOL_CONNECT_RETRIES: {{ .Values.egressAuth.httpPoolConnectRetries | default "1" | quote }}
  {{- if .Values.egressAuth.oauthTrustedIdpHosts }}
  # Hosts whose OAuth token endpoints may resolve to private addresses, for the
  # OBO (same-IdP) token exchange against a self-hosted IdP (Keycloak, Entra via
  # Private Link). Without it the credentialed-OAuth SSRF profile rejects every
  # private-resolving token endpoint. Exact hostnames only, no CIDRs. Entries
  # receive client secrets / user assertions, so keep the list tight. MUST match
  # the registry chart's registry.egressAuth.oauthTrustedIdpHosts.
  EGRESS_OAUTH_TRUSTED_IDP_HOSTS: {{ .Values.egressAuth.oauthTrustedIdpHosts | quote }}
  {{- end }}
  # Opt-in exchanged-OBO-token cache. Cache off by default preserves
  # the stateless per-request exchange; the skew must stay below the max TTL. MUST
  # match the registry chart's registry.egressAuth.oboCache*.
  EGRESS_OBO_CACHE_ENABLED: {{ .Values.egressAuth.oboCacheEnabled | default "false" | quote }}
  EGRESS_OBO_CACHE_MAX_TTL_SECONDS: {{ .Values.egressAuth.oboCacheMaxTtlSeconds | default "300" | quote }}
  EGRESS_OBO_CACHE_EXPIRY_SKEW_SECONDS: {{ .Values.egressAuth.oboCacheExpirySkewSeconds | default "30" | quote }}
  {{- /*
  Secret-store backend config. Rendered ONLY when the OBO cache is
  enabled -- that is what turns the auth-server into a SecretStore client. With the
  cache off the auth-server renders only its egress subset (no vault access),
  preserving the default trust boundary. Rendered the same way as the registry
  chart's registry-egress-config so both pods read/write the same per-user store.
  */ -}}
  {{- if eq (.Values.egressAuth.oboCacheEnabled | default "false" | toString) "true" }}
  SECRET_STORE_BACKEND: {{ .Values.egressAuth.secretStoreBackend | default "openbao" | quote }}
  {{- if .Values.egressAuth.secretsManager }}
  {{- if .Values.egressAuth.secretsManager.kmsKeyId }}
  SECRETS_MANAGER_KMS_KEY_ID: {{ .Values.egressAuth.secretsManager.kmsKeyId | quote }}
  {{- end }}
  SECRETS_MANAGER_PATH_PREFIX: {{ .Values.egressAuth.secretsManager.pathPrefix | default "mcp/egress" | quote }}
  {{- end }}
  {{- if .Values.egressAuth.openbao }}
  # OPENBAO_ADDR: explicit addr wins; else the release-scoped OpenBao Service
  # ("<release>-openbao.<ns>.svc"), matching the registry chart + stack helper.
  {{- if .Values.egressAuth.openbao.addr }}
  OPENBAO_ADDR: {{ .Values.egressAuth.openbao.addr | quote }}
  {{- else }}
  OPENBAO_ADDR: {{ printf "http://%s-openbao.%s.svc:8200" .Release.Name .Release.Namespace | quote }}
  {{- end }}
  {{- if .Values.egressAuth.openbao.namespace }}
  OPENBAO_NAMESPACE: {{ .Values.egressAuth.openbao.namespace | quote }}
  {{- end }}
  OPENBAO_KV_MOUNT: {{ .Values.egressAuth.openbao.kvMount | default "secret" | quote }}
  OPENBAO_AUTH_METHOD: {{ .Values.egressAuth.openbao.authMethod | default "token" | quote }}
  {{- if .Values.egressAuth.openbao.role }}
  OPENBAO_ROLE: {{ .Values.egressAuth.openbao.role | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
