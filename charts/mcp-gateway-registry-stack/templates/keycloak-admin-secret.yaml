{{/*
Keycloak admin password secret.

Resolution, highest precedence first:
  1. keycloak.auth.adminPassword (Bitnami's own value name — the bundled
     Keycloak subchart ignores it because keycloak.auth.existingSecret points
     at this Secret, so this template is what makes it effective)
  2. the existing in-cluster Secret — preserves the password across
     `helm upgrade`, which is what stops the Bitnami chart from regenerating it
     and locking the operator out of an already-bootstrapped realm
  3. a generated random password (see global.generateSecrets)

Setting adminPassword on an EXISTING install only rewrites this Secret;
Keycloak bootstraps its admin user once, so the realm keeps the old password
until it is changed in Keycloak itself.
*/}}
{{- if .Values.keycloak.create }}
{{- $secretName := printf "%s-keycloak" .Release.Name }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $adminPassword := dig "auth" "adminPassword" "" .Values.keycloak }}
{{- if $adminPassword }}
  {{- /*
    Bootstrap-once guard. Keycloak creates its admin user on first startup and
    never re-reads this password, so quietly replacing a live one would leave
    the Secret and the realm disagreeing — and the setup-keycloak Job would
    then fail to authenticate. Refuse instead of rotating. (`lookup` is empty
    under ArgoCD, so this only fires where the previous value is knowable.)
  */ -}}
  {{- if $existingSecret }}
    {{- $current := index $existingSecret.data "admin-password" | b64dec }}
    {{- if ne $current $adminPassword }}
      {{- fail (printf "keycloak.auth.adminPassword does not match the password already stored in Secret %s, and Keycloak only bootstraps its admin user once — applying this value would leave the realm on the old password and break the setup-keycloak Job. Either remove keycloak.auth.adminPassword to keep the existing password, or change the password in Keycloak first and then set this value to match." $secretName) }}
    {{- end }}
  {{- end }}
{{- else }}
  {{- if $existingSecret }}
    {{- $adminPassword = index $existingSecret.data "admin-password" | b64dec }}
  {{- else }}
    {{- include "mcp-gateway-registry-stack.requireGeneratedSecret" (dict "ctx" . "key" "the Keycloak admin password" "value" "keycloak.auth.adminPassword" "byo" "keycloak.auth.existingSecret") }}
    {{- $adminPassword = randAlphaNum 32 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "mcp-gateway-registry-stack.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ $adminPassword | b64enc | quote }}
{{- end }}
