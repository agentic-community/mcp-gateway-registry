{{/*
Keycloak PostgreSQL secret.

Resolution per key, highest precedence first:
  1. keycloak.postgresql.auth.password / .postgresPassword (Bitnami's own value
     names — the bundled subchart ignores them because
     keycloak.postgresql.auth.existingSecret points at this Secret, so this
     template is what makes them effective)
  2. the existing in-cluster Secret — preserves the passwords across
     `helm upgrade`. This is what prevents the bn_keycloak authentication
     failure that occurs when Bitnami's PostgreSQL subchart regenerates
     passwords while the PVC retains the original ones.
  3. generated random passwords (see global.generateSecrets)

Set these values at FIRST install. PostgreSQL initializes its roles from them
once; changing them later rewrites the Secret while the retained PVC keeps the
old credentials, which is exactly the authentication failure above.
*/}}
{{- if .Values.keycloak.create }}
{{- $secretName := printf "%s-keycloak-postgresql" .Release.Name }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $pgAuth := dig "postgresql" "auth" dict .Values.keycloak }}
{{- $password := $pgAuth.password | default "" }}
{{- $postgresPassword := $pgAuth.postgresPassword | default "" }}
{{- /*
  Bootstrap-once guard. PostgreSQL initializes its roles from these values on
  first start and never re-reads them, so quietly replacing a live password
  would leave the Secret and the retained PVC disagreeing — that IS the
  bn_keycloak authentication failure. Refuse instead of rotating. (`lookup` is
  empty under ArgoCD, so this only fires where the previous value is knowable.)
*/ -}}
{{- if $password }}
  {{- if $existingSecret }}
    {{- $current := index $existingSecret.data "password" | b64dec }}
    {{- if ne $current $password }}
      {{- fail (printf "keycloak.postgresql.auth.password does not match the password already stored in Secret %s, and PostgreSQL initializes its roles only once — applying this value would leave the database on the old password and Keycloak unable to connect (the bn_keycloak authentication failure). Either remove the value to keep the existing password, or delete Secret %s together with the PostgreSQL PVC to re-initialize the database from scratch (this destroys the Keycloak database; the setup-keycloak Job rebuilds the realm)." $secretName $secretName) }}
    {{- end }}
  {{- end }}
{{- else }}
  {{- if $existingSecret }}
    {{- $password = index $existingSecret.data "password" | b64dec }}
  {{- else }}
    {{- include "mcp-gateway-registry-stack.requireGeneratedSecret" (dict "ctx" . "key" "the Keycloak PostgreSQL user password" "value" "keycloak.postgresql.auth.password" "byo" "keycloak.postgresql.auth.existingSecret") }}
    {{- $password = randAlphaNum 32 }}
  {{- end }}
{{- end }}
{{- if $postgresPassword }}
  {{- if $existingSecret }}
    {{- $current := index $existingSecret.data "postgres-password" | b64dec }}
    {{- if ne $current $postgresPassword }}
      {{- fail (printf "keycloak.postgresql.auth.postgresPassword does not match the password already stored in Secret %s, and PostgreSQL initializes its superuser only once — applying this value would leave the database on the old password. Either remove the value to keep the existing password, or delete Secret %s together with the PostgreSQL PVC to re-initialize the database from scratch (this destroys the Keycloak database; the setup-keycloak Job rebuilds the realm)." $secretName $secretName) }}
    {{- end }}
  {{- end }}
{{- else }}
  {{- if $existingSecret }}
    {{- $postgresPassword = index $existingSecret.data "postgres-password" | b64dec }}
  {{- else }}
    {{- include "mcp-gateway-registry-stack.requireGeneratedSecret" (dict "ctx" . "key" "the PostgreSQL superuser password" "value" "keycloak.postgresql.auth.postgresPassword" "byo" "keycloak.postgresql.auth.existingSecret") }}
    {{- $postgresPassword = randAlphaNum 32 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "mcp-gateway-registry-stack.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
  postgres-password: {{ $postgresPassword | b64enc | quote }}
{{- end }}
