{{/*
OIDC client credentials for the bundled Keycloak realm.

This Secret is rendered by the chart — NOT created at runtime by the
setup-keycloak Job. The Job reads it and PUTs the values into Keycloak's
client representations, so the chart is the single source of truth.

Why it must be declarative: registry and auth-server mount it with
`envFrom.secretRef`, so a pod cannot start until it exists. When the Job
owned its creation, ArgoCD deadlocked — the Job is a `post-install` hook,
which ArgoCD maps to its PostSync phase, and PostSync only runs after
every Sync-phase resource is Healthy. The Deployments could never become
Healthy without the Secret the PostSync Job was supposed to create.
Rendering the Secret in the Sync phase removes the ordering requirement
instead of encoding it. It also stops `helm upgrade` from rotating the
Keycloak client secrets out from under already-running pods (the old Job
regenerated them on every run; `envFrom` does not restart pods).

Client IDs are literals here because the Job's script hardcodes the same
two clientIds (`mcp-gateway-web`, `mcp-gateway-m2m`). Keep them in sync
with charts/keycloak-configure/templates/configmap.yaml.

Value resolution, per secret, highest precedence first:
  1. global.authProvider.keycloak.clientSecret / .m2mClientSecret
     (and auth-server.keycloak.m2mClientSecret, the pre-existing knob for
     an externally managed Keycloak)
  2. the existing in-cluster keycloak-client-secret — preserve on upgrade,
     and adopt the value an older Job-created Secret already holds
  3. a freshly generated random value

Rung 2 uses `lookup`, which ArgoCD does not support (it renders with
`helm template`, with no cluster access). Under ArgoCD, set the explicit
values from rung 1 or point global.existingKeycloakClientSecret at a
Secret managed by External Secrets / sealed-secrets; otherwise every sync
re-rolls a new random secret. See the ArgoCD section of the chart README.
*/}}
{{- $authProviderType := .Values.global.authProvider.type | default "keycloak" }}
{{- if and (eq $authProviderType "keycloak") (not .Values.global.existingKeycloakClientSecret) }}
{{- $secretName := "keycloak-client-secret" }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $existingData := dict }}
{{- if $existingSecret }}
  {{- $existingData = $existingSecret.data | default dict }}
{{- end }}
{{- /* Explicit operator-supplied values. */ -}}
{{- $keycloakValues := .Values.global.authProvider.keycloak | default dict }}
{{- $webCred := $keycloakValues.clientSecret | default "" }}
{{- $m2mCred := $keycloakValues.m2mClientSecret | default "" }}
{{- if not $m2mCred }}
  {{- if (index .Values "auth-server") }}
    {{- if (index .Values "auth-server" "keycloak") }}
      {{- $m2mCred = (index .Values "auth-server" "keycloak" "m2mClientSecret") | default "" }}
    {{- end }}
  {{- end }}
{{- end }}
{{- /* Preserve on upgrade, else generate. */ -}}
{{- if not $webCred }}
  {{- if hasKey $existingData "KEYCLOAK_CLIENT_SECRET" }}
    {{- $webCred = index $existingData "KEYCLOAK_CLIENT_SECRET" | b64dec }}
  {{- else }}
    {{- include "mcp-gateway-registry-stack.requireGeneratedSecret" (dict "ctx" . "key" "KEYCLOAK_CLIENT_SECRET" "value" "global.authProvider.keycloak.clientSecret" "byo" "global.existingKeycloakClientSecret") }}
    {{- $webCred = randAlphaNum 32 }}
  {{- end }}
{{- end }}
{{- if not $m2mCred }}
  {{- if hasKey $existingData "KEYCLOAK_M2M_CLIENT_SECRET" }}
    {{- $m2mCred = index $existingData "KEYCLOAK_M2M_CLIENT_SECRET" | b64dec }}
  {{- else }}
    {{- include "mcp-gateway-registry-stack.requireGeneratedSecret" (dict "ctx" . "key" "KEYCLOAK_M2M_CLIENT_SECRET" "value" "global.authProvider.keycloak.m2mClientSecret" "byo" "global.existingKeycloakClientSecret") }}
    {{- $m2mCred = randAlphaNum 32 }}
  {{- end }}
{{- end }}
{{- /*
Fail closed when nothing will ever push the generated values into
Keycloak: with keycloak-configure disabled (external, pre-configured
Keycloak) a random secret is silently wrong, and the operator has to
supply the real client credentials.
*/ -}}
{{- $configureEnabled := true }}
{{- if (index .Values "keycloak-configure") }}
  {{- $configureEnabled = (index .Values "keycloak-configure" "enabled") }}
{{- end }}
{{- if and (not $configureEnabled) (not $existingSecret) }}
  {{- if not (and $keycloakValues.clientSecret $m2mCred) }}
    {{- fail "global.authProvider.type is \"keycloak\" and keycloak-configure.enabled is false, so no Job will publish chart-generated client secrets to Keycloak. Set global.authProvider.keycloak.clientSecret and global.authProvider.keycloak.m2mClientSecret to the real credentials of your external Keycloak, or set global.existingKeycloakClientSecret to a Secret that holds KEYCLOAK_CLIENT_ID/KEYCLOAK_CLIENT_SECRET/KEYCLOAK_M2M_CLIENT_ID/KEYCLOAK_M2M_CLIENT_SECRET." }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "mcp-gateway-registry-stack.labels" . | nindent 4 }}
type: Opaque
data:
  KEYCLOAK_CLIENT_ID: {{ "mcp-gateway-web" | b64enc | quote }}
  KEYCLOAK_CLIENT_SECRET: {{ $webCred | b64enc | quote }}
  KEYCLOAK_M2M_CLIENT_ID: {{ "mcp-gateway-m2m" | b64enc | quote }}
  KEYCLOAK_M2M_CLIENT_SECRET: {{ $m2mCred | b64enc | quote }}
{{- end }}
