suite: stack ingress topology — single ingress via registry nginx
release:
  name: test
  namespace: default
set:
  keycloak.postgres.bootstrap.mode: fresh-install
tests:
  # Registry ingress in path mode exposes /oauth2, /keycloak, /realms,
  # /resources — required because auth-server and Keycloak have no
  # ingress of their own and the registry's nginx proxies them internally.
  - it: registry ingress in path mode exposes auth and Keycloak sibling paths
    templates:
      - charts/registry/templates/ingress.yaml
    set:
      global:
        domain: example.com
        ingress:
          routingMode: path
          tls: true
          paths:
            registry: /registry
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /registry
      - equal:
          path: spec.rules[0].http.paths[1].path
          value: /oauth2
      - equal:
          path: spec.rules[0].http.paths[2].path
          value: /keycloak
      - equal:
          path: spec.rules[0].http.paths[3].path
          value: /realms
      - equal:
          path: spec.rules[0].http.paths[4].path
          value: /resources
      - lengthEqual:
          path: spec.rules[0].http.paths
          count: 5

  - it: forwards the canonical Keycloak prefix on primary and alias hosts
    templates:
      - charts/registry/templates/ingress.yaml
    set:
      global.domain: example.com
      global.ingress.routingMode: path
      global.ingress.tls: true
      global.ingress.additionalHostnames:
        - alias.example.com
      global.authProvider.keycloak.externalUrl: https://example.com/identity/auth
    asserts:
      - equal:
          path: spec.rules[0].http.paths[5]
          value:
            path: /identity/auth
            pathType: Prefix
            backend:
              service:
                name: registry
                port:
                  name: http
      - equal:
          path: spec.rules[1].http.paths[5]
          value:
            path: /identity/auth
            pathType: Prefix
            backend:
              service:
                name: registry
                port:
                  name: http

  - it: omits inactive Keycloak paths on primary and alias hosts
    templates: &registryIngress
      - charts/registry/templates/ingress.yaml
    set:
      global.domain: example.com
      global.ingress.routingMode: path
      global.ingress.additionalHostnames:
        - alias.example.com
      global.authProvider.type: okta
      global.authProvider.keycloak.externalUrl: https://example.com/unused-identity
    asserts: &noKeycloakPaths
      - equal:
          path: spec.rules[0].http.paths
          value:
            - path: /registry
              pathType: Prefix
              backend:
                service:
                  name: registry
                  port:
                    name: http
            - path: /oauth2
              pathType: Prefix
              backend:
                service:
                  name: registry
                  port:
                    name: http
      - equal:
          path: spec.rules[1].http.paths
          value:
            - path: /registry
              pathType: Prefix
              backend:
                service:
                  name: registry
                  port:
                    name: http
            - path: /oauth2
              pathType: Prefix
              backend:
                service:
                  name: registry
                  port:
                    name: http

  - it: omits inactive Keycloak paths with Entra
    templates: *registryIngress
    set:
      global.domain: example.com
      global.ingress.routingMode: path
      global.ingress.additionalHostnames: [alias.example.com]
      global.authProvider.type: entra
    asserts: *noKeycloakPaths

  - it: omits inactive Keycloak paths with Auth0
    templates: *registryIngress
    set:
      global.domain: example.com
      global.ingress.routingMode: path
      global.ingress.additionalHostnames: [alias.example.com]
      global.authProvider.type: auth0
    asserts: *noKeycloakPaths

  - it: omits inactive Keycloak paths with Cognito
    templates: *registryIngress
    set:
      global.domain: example.com
      global.ingress.routingMode: path
      global.ingress.additionalHostnames: [alias.example.com]
      global.authProvider.type: cognito
    asserts: *noKeycloakPaths

  - it: omits inactive Keycloak paths with PingFederate
    templates: *registryIngress
    set:
      global.domain: example.com
      global.ingress.routingMode: path
      global.ingress.additionalHostnames: [alias.example.com]
      global.authProvider.type: pingfederate
    asserts: *noKeycloakPaths

  - it: retains required paths when the selected provider uses external Keycloak
    templates: *registryIngress
    set:
      keycloak.create: false
      global.domain: example.com
      global.ingress.routingMode: path
      global.authProvider.type: keycloak
      global.authProvider.keycloak.externalUrl: https://example.com/identity
    asserts:
      - equal:
          path: spec.rules[0].http.paths[2].path
          value: /keycloak
      - equal:
          path: spec.rules[0].http.paths[5].path
          value: /identity

  - it: retains external Keycloak routing when an empty provider uses the default
    templates: *registryIngress
    set:
      keycloak.create: false
      global.domain: example.com
      global.ingress.routingMode: path
      global.ingress.additionalHostnames: [alias.example.com]
      global.authProvider.type: ""
      global.authProvider.keycloak.externalUrl: https://example.com/identity
    asserts:
      - equal:
          path: spec.rules[0].http.paths[2].path
          value: /keycloak
      - equal:
          path: spec.rules[1].http.paths[5].path
          value: /identity

  - it: uses an HTTP listener without an HTTPS redirect when TLS is disabled
    templates:
      - charts/registry/templates/ingress.yaml
    set:
      global.ingress.tls: false
      global.ingress.allowPlaintext: true
    asserts:
      - matchRegex:
          path: metadata.annotations["alb.ingress.kubernetes.io/listen-ports"]
          pattern: '^\[\{"HTTP":\s*80\}\]$'
      - notExists:
          path: metadata.annotations["alb.ingress.kubernetes.io/ssl-redirect"]

  - it: registry ingress in subdomain mode keeps the single wildcard
    templates:
      - charts/registry/templates/ingress.yaml
    set:
      global:
        domain: example.com
        ingress:
          routingMode: subdomain
          tls: true
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /
      - lengthEqual:
          path: spec.rules[0].http.paths
          count: 1

  - it: registry ingress supports a custom subdomain and additional hostnames
    templates:
      - charts/registry/templates/ingress.yaml
    set:
      global:
        domain: example.com
        ingress:
          routingMode: subdomain
          tls: true
          registrySubdomain: mcp-gateway
          additionalHostnames:
            - mcp-registry.example.com
    asserts:
      - equal:
          path: spec.rules[0].host
          value: mcp-gateway.example.com
      - equal:
          path: spec.rules[1].host
          value: mcp-registry.example.com
      - equal:
          path: spec.rules[1].http.paths[0].path
          value: /
      - lengthEqual:
          path: spec.rules
          count: 2

  # keycloak-configure Job runs on every helm install/upgrade/rollback so the
  # realm's client redirect URIs stay in sync with the computed URLs, and so a
  # rollback re-points the realm at the client secrets it restored.
  - it: keycloak-configure Job has helm hook annotations
    templates:
      - charts/keycloak-configure/templates/job.yaml
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,post-upgrade,post-rollback
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation

  # Internal KEYCLOAK_URL must be bare (no /keycloak suffix) in both
  # routing modes — the registry pod's nginx handles browser-side path
  # rewriting, and Keycloak serves from its own root.
  - it: internal KEYCLOAK_URL has no path suffix in subdomain mode
    templates:
      - templates/oauth-provider-secret.yaml
    set:
      global:
        domain: example.com
        ingress:
          routingMode: subdomain
          tls: true
    asserts:
      - equal:
          path: data.KEYCLOAK_URL
          # base64 of http://test-keycloak-headless.default.svc.cluster.local:8080
          value: aHR0cDovL3Rlc3Qta2V5Y2xvYWstaGVhZGxlc3MuZGVmYXVsdC5zdmMuY2x1c3Rlci5sb2NhbDo4MDgw

  - it: internal KEYCLOAK_URL has no path suffix in path mode
    templates:
      - templates/oauth-provider-secret.yaml
    set:
      global:
        domain: example.com
        ingress:
          routingMode: path
          tls: true
    asserts:
      - equal:
          path: data.KEYCLOAK_URL
          value: aHR0cDovL3Rlc3Qta2V5Y2xvYWstaGVhZGxlc3MuZGVmYXVsdC5zdmMuY2x1c3Rlci5sb2NhbDo4MDgw

  # KEYCLOAK_EXTERNAL_URL is the BARE host (no /keycloak suffix). Keycloak
  # emits issuer claims and discovery-doc `issuer` fields without the
  # /keycloak prefix because the registry pod's nginx strips /keycloak/
  # before forwarding. auth-server's bearer-token issuer-allowlist check
  # must equal what Keycloak actually emits, otherwise DCR'd MCP clients
  # 401 on /validate. Browser auth redirects land on /realms/.../auth
  # (handled by the registry nginx /realms/ location).
  - it: KEYCLOAK_EXTERNAL_URL is bare mcpregistry.<domain> in subdomain mode
    templates:
      - templates/oauth-provider-secret.yaml
    set:
      global:
        domain: example.com
        ingress:
          routingMode: subdomain
          tls: true
    asserts:
      - equal:
          path: data.KEYCLOAK_EXTERNAL_URL
          # base64 of https://mcpregistry.example.com
          value: aHR0cHM6Ly9tY3ByZWdpc3RyeS5leGFtcGxlLmNvbQ==

  - it: KEYCLOAK_EXTERNAL_URL is bare <domain> in path mode (no /keycloak, no /registry)
    templates:
      - templates/oauth-provider-secret.yaml
    set:
      global:
        domain: example.com
        ingress:
          routingMode: path
          tls: true
    asserts:
      - equal:
          path: data.KEYCLOAK_EXTERNAL_URL
          # base64 of https://example.com
          value: aHR0cHM6Ly9leGFtcGxlLmNvbQ==

  # AUTH_SERVER_EXTERNAL_URL is the bare registry host — no /registry
  # path prefix in path mode, no /auth-server anywhere.
  - it: AUTH_SERVER_EXTERNAL_URL in path mode is the bare domain (no path)
    templates:
      - charts/auth-server/templates/secret.yaml
    set:
      global:
        domain: example.com
        ingress:
          routingMode: path
          tls: true
    asserts:
      - equal:
          path: data.AUTH_SERVER_EXTERNAL_URL
          # base64 of https://example.com
          value: aHR0cHM6Ly9leGFtcGxlLmNvbQ==

  - it: AUTH_SERVER_EXTERNAL_URL in subdomain mode is the registry hostname
    templates:
      - charts/auth-server/templates/secret.yaml
    set:
      global:
        domain: example.com
        ingress:
          routingMode: subdomain
          tls: true
    asserts:
      - equal:
          path: data.AUTH_SERVER_EXTERNAL_URL
          # base64 of https://mcpregistry.example.com
          value: aHR0cHM6Ly9tY3ByZWdpc3RyeS5leGFtcGxlLmNvbQ==

  - it: registry public URL and gateway server name follow the configured subdomain
    templates:
      - charts/registry/templates/secret.yaml
    set:
      global:
        domain: example.com
        ingress:
          routingMode: subdomain
          tls: true
          registrySubdomain: mcp-gateway
    asserts:
      - equal:
          path: data.REGISTRY_URL
          value: aHR0cHM6Ly9tY3AtZ2F0ZXdheS5leGFtcGxlLmNvbQ== # pragma: allowlist secret
      - equal:
          path: data.GATEWAY_ADDITIONAL_SERVER_NAMES
          value: bWNwLWdhdGV3YXkuZXhhbXBsZS5jb20=

  - it: mcpgw public URL follows the configured registry subdomain
    templates:
      - charts/mcpgw/templates/secret.yaml
    set:
      global:
        domain: example.com
        ingress:
          routingMode: subdomain
          tls: true
          registrySubdomain: mcp-gateway
    asserts:
      - equal:
          path: data.REGISTRY_EXTERNAL_URL
          value: aHR0cHM6Ly9tY3AtZ2F0ZXdheS5leGFtcGxlLmNvbQ== # pragma: allowlist secret

  - it: Keycloak client registry URL follows the configured registry subdomain
    templates:
      - charts/keycloak-configure/templates/secret.yaml
    set:
      global:
        domain: example.com
        ingress:
          routingMode: subdomain
          tls: true
          registrySubdomain: mcp-gateway
    asserts:
      - equal:
          path: data.REGISTRY_URL
          value: aHR0cHM6Ly9tY3AtZ2F0ZXdheS5leGFtcGxlLmNvbQ== # pragma: allowlist secret

  # auth-server FastAPI root_path is always empty — it has no ingress
  # of its own; nginx strips any path prefix before forwarding.
  - it: auth-server ROOT_PATH is empty in subdomain mode
    templates:
      - charts/auth-server/templates/secret.yaml
    set:
      global:
        domain: example.com
        ingress:
          routingMode: subdomain
          tls: true
    asserts:
      - equal:
          path: data.ROOT_PATH
          value: ""

  - it: auth-server ROOT_PATH is empty in path mode
    templates:
      - charts/auth-server/templates/secret.yaml
    set:
      global:
        domain: example.com
        ingress:
          routingMode: path
          tls: true
    asserts:
      - equal:
          path: data.ROOT_PATH
          value: ""

  - it: KEYCLOAK_EXTERNAL_URL follows a custom registry subdomain
    templates:
      - templates/oauth-provider-secret.yaml
    set:
      global:
        domain: example.com
        ingress:
          routingMode: subdomain
          tls: true
          registrySubdomain: mcp-gateway
    asserts:
      - equal:
          path: data.KEYCLOAK_EXTERNAL_URL
          value: aHR0cHM6Ly9tY3AtZ2F0ZXdheS5leGFtcGxlLmNvbQ== # pragma: allowlist secret

  - it: AUTH_SERVER_EXTERNAL_URL follows a custom registry subdomain
    templates:
      - charts/auth-server/templates/secret.yaml
    set:
      global:
        domain: example.com
        ingress:
          routingMode: subdomain
          tls: true
          registrySubdomain: mcp-gateway
    asserts:
      - equal:
          path: data.AUTH_SERVER_EXTERNAL_URL
          value: aHR0cHM6Ly9tY3AtZ2F0ZXdheS5leGFtcGxlLmNvbQ== # pragma: allowlist secret

  - it: propagates additional hostnames to registry host configuration
    templates:
      - charts/registry/templates/secret.yaml
    set:
      global:
        domain: example.com
        ingress:
          routingMode: subdomain
          tls: true
          registrySubdomain: mcp-gateway
          additionalHostnames:
            - alias.example.com
    asserts:
      - equal:
          path: data.GATEWAY_ADDITIONAL_SERVER_NAMES
          value: bWNwLWdhdGV3YXkuZXhhbXBsZS5jb20gYWxpYXMuZXhhbXBsZS5jb20=
      - equal:
          path: data.TRUSTED_EXTERNAL_HOSTS
          value: YWxpYXMuZXhhbXBsZS5jb20=
      - equal:
          path: data.CORS_ALLOWED_ORIGINS
          value: aHR0cHM6Ly9hbGlhcy5leGFtcGxlLmNvbQ==

  - it: propagates additional hostnames to auth-server trusted host configuration
    templates:
      - charts/auth-server/templates/secret.yaml
    set:
      global:
        domain: example.com
        ingress:
          routingMode: subdomain
          tls: true
          additionalHostnames:
            - alias.example.com
    asserts:
      - equal:
          path: data.TRUSTED_EXTERNAL_HOSTS
          value: YWxpYXMuZXhhbXBsZS5jb20=

  - it: includes additional hostnames in bundled Keycloak configuration inputs
    templates:
      - charts/keycloak-configure/templates/secret.yaml
    set:
      global:
        domain: example.com
        ingress:
          routingMode: subdomain
          tls: true
          additionalHostnames:
            - alias.example.com
    asserts:
      - equal:
          path: data.ADDITIONAL_REGISTRY_HOSTNAMES
          value: YWxpYXMuZXhhbXBsZS5jb20=

