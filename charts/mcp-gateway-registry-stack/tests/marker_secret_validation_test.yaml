suite: stack nginx marker secret validation (issue 1939)
templates:
  - templates/shared-secret.yaml
release:
  name: test
  namespace: default
# An operator-supplied marker is rendered into the nginx config and sent as a
# header, so the stack accepts only printable ASCII other than '$' up front.
tests:
  - it: rejects an explicit marker containing '$'
    set:
      registry:
        egressAuth:
          markerSecret: "stack-marker-$-not-for-prod"  # pragma: allowlist secret
    asserts:
      - failedTemplate:
          errorPattern: "registry.egressAuth.markerSecret .* must contain only printable ASCII"

  - it: rejects an explicit marker containing non-ASCII characters
    set:
      registry:
        egressAuth:
          markerSecret: "stack-marker-é-not-for-prod"  # pragma: allowlist secret
    asserts:
      - failedTemplate:
          errorPattern: "registry.egressAuth.markerSecret .* must contain only printable ASCII"

  - it: trims an explicit marker before storing it
    set:
      registry:
        egressAuth:
          markerSecret: " stack-marker-not-for-prod\n"  # pragma: allowlist secret
    asserts:
      - equal:
          path: data.AUTH_SERVER_NGINX_MARKER_SECRET
          value: c3RhY2stbWFya2VyLW5vdC1mb3ItcHJvZA==  # pragma: allowlist secret

  # On upgrade the stored marker is reused, so it gets the same check: a value
  # the apps refuse at startup fails the upgrade instead of crash-looping them.
  - it: rejects a reused marker containing '$'
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: shared-secret
            namespace: default
          data:
            SECRET_KEY: c3RhY2stc2VjcmV0LWtleS1ub3QtZm9yLXByb2Q= # pragma: allowlist secret
            AUTH_SERVER_NGINX_MARKER_SECRET: c3RhY2stbWFya2VyLSQtbm90LWZvci1wcm9k # pragma: allowlist secret
    asserts:
      - failedTemplate:
          errorPattern: "AUTH_SERVER_NGINX_MARKER_SECRET already in the shared secret\\) must contain only printable ASCII"

  - it: reuses a stored marker, trimmed
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: shared-secret
            namespace: default
          data:
            SECRET_KEY: c3RhY2stc2VjcmV0LWtleS1ub3QtZm9yLXByb2Q= # pragma: allowlist secret
            AUTH_SERVER_NGINX_MARKER_SECRET: c3RhY2stbWFya2VyLXJldXNlZC1ub3QtZm9yLXByb2QK # pragma: allowlist secret
    asserts:
      - equal:
          path: data.AUTH_SERVER_NGINX_MARKER_SECRET
          value: c3RhY2stbWFya2VyLXJldXNlZC1ub3QtZm9yLXByb2Q=  # pragma: allowlist secret
