suite: Keycloak public hostname pinned under the service mesh
templates:
  - templates/servicemesh-keycloak-hostname.yaml
  - templates/oauth-provider-secret.yaml
release:
  name: rel
  namespace: default
tests:
  - it: renders an empty ConfigMap with the mesh off, so Keycloak settings are unchanged
    template: templates/servicemesh-keycloak-hostname.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: rel-keycloak-mesh-hostname
      - equal:
          path: data
          value: {}

  - it: pins KC_HOSTNAME with the mesh on
    template: templates/servicemesh-keycloak-hostname.yaml
    set:
      global.serviceMesh.enabled: true
      global.domain: example.com
    asserts:
      - equal:
          path: data
          value:
            KC_HOSTNAME: https://mcpregistry.example.com
            KC_HOSTNAME_STRICT: "true"
            KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"

  - it: matches KEYCLOAK_EXTERNAL_URL in path routing mode
    template: templates/servicemesh-keycloak-hostname.yaml
    set:
      global.serviceMesh.enabled: true
      global.domain: example.com
      global.ingress.routingMode: path
    asserts:
      - equal:
          path: data.KC_HOSTNAME
          value: https://example.com

  - it: KEYCLOAK_EXTERNAL_URL uses the same value (drift guard)
    template: templates/oauth-provider-secret.yaml
    set:
      global.domain: example.com
    asserts:
      - equal:
          path: data.KEYCLOAK_EXTERNAL_URL
          value: https://mcpregistry.example.com
          decodeBase64: true

  - it: is not rendered for the official-image Keycloak chart
    template: templates/servicemesh-keycloak-hostname.yaml
    set:
      global.serviceMesh.enabled: true
      keycloak.postgres.database: keycloak
    asserts:
      - hasDocuments:
          count: 0
