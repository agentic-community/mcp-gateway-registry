suite: keycloak client secret is chart-owned, not Job-created
release:
  name: test
  namespace: default
tests:
  # The core regression: registry and auth-server mount this Secret with
  # envFrom, so it MUST exist in the install/Sync phase. When the
  # setup-keycloak post-install hook owned it, ArgoCD deadlocked — PostSync
  # only runs once every Sync-phase resource is Healthy, and the Deployments
  # could never start without the Secret.
  - it: renders keycloak-client-secret for the default (keycloak) provider
    templates:
      - templates/keycloak-client-secret.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: keycloak-client-secret
      - equal:
          path: data.KEYCLOAK_CLIENT_ID
          value: bWNwLWdhdGV3YXktd2Vi # mcp-gateway-web
      - equal:
          path: data.KEYCLOAK_M2M_CLIENT_ID
          value: bWNwLWdhdGV3YXktbTJt # mcp-gateway-m2m
      - isNotEmpty:
          path: data.KEYCLOAK_CLIENT_SECRET
      - isNotEmpty:
          path: data.KEYCLOAK_M2M_CLIENT_SECRET
      # Helm ownership metadata — an existing cluster whose Secret was written
      # by the old Job has none, which is why the upgrade needs the relabel
      # step documented in the chart README.
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm

  - it: explicit values win over generation
    templates:
      - templates/keycloak-client-secret.yaml
    set:
      global:
        authProvider:
          keycloak:
            clientSecret: web-from-values # pragma: allowlist secret
            m2mClientSecret: m2m-from-values # pragma: allowlist secret
    asserts:
      - equal:
          path: data.KEYCLOAK_CLIENT_SECRET
          value: d2ViLWZyb20tdmFsdWVz # web-from-values
      - equal:
          path: data.KEYCLOAK_M2M_CLIENT_SECRET
          value: bTJtLWZyb20tdmFsdWVz # m2m-from-values

  # The pre-existing knob for an externally managed Keycloak feeds
  # oauth-provider-secret; reuse it here so the two secrets cannot disagree
  # about the M2M credential.
  - it: reuses auth-server.keycloak.m2mClientSecret when set
    templates:
      - templates/keycloak-client-secret.yaml
    set:
      auth-server:
        keycloak:
          m2mClientSecret: m2m-from-values # pragma: allowlist secret
    asserts:
      - equal:
          path: data.KEYCLOAK_M2M_CLIENT_SECRET
          value: bTJtLWZyb20tdmFsdWVz # m2m-from-values

  - it: skips creation when global.existingKeycloakClientSecret is set
    templates:
      - templates/keycloak-client-secret.yaml
    set:
      global:
        existingKeycloakClientSecret: byo-keycloak-client # pragma: allowlist secret
    asserts:
      - hasDocuments:
          count: 0

  - it: emits nothing for a non-keycloak auth provider
    templates:
      - templates/keycloak-client-secret.yaml
    set:
      global:
        authProvider:
          type: entra
    asserts:
      - hasDocuments:
          count: 0

  # Fail closed: with keycloak-configure disabled nothing publishes the
  # generated value to Keycloak, so a random secret would be silently wrong.
  - it: fails when keycloak-configure is disabled and no credentials supplied
    templates:
      - templates/keycloak-client-secret.yaml
    set:
      keycloak-configure:
        enabled: false
    asserts:
      - failedTemplate:
          errorMessage: 'global.authProvider.type is "keycloak" and keycloak-configure.enabled is false, so no Job will publish chart-generated client secrets to Keycloak. Set global.authProvider.keycloak.clientSecret and global.authProvider.keycloak.m2mClientSecret to the real credentials of your external Keycloak, or set global.existingKeycloakClientSecret to a Secret that holds KEYCLOAK_CLIENT_ID/KEYCLOAK_CLIENT_SECRET/KEYCLOAK_M2M_CLIENT_ID/KEYCLOAK_M2M_CLIENT_SECRET.'

  - it: external keycloak renders once explicit credentials are supplied
    templates:
      - templates/keycloak-client-secret.yaml
    set:
      keycloak-configure:
        enabled: false
      global:
        authProvider:
          keycloak:
            clientSecret: web-from-values # pragma: allowlist secret
            m2mClientSecret: m2m-from-values # pragma: allowlist secret
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: data.KEYCLOAK_CLIENT_SECRET
          value: d2ViLWZyb20tdmFsdWVz # web-from-values

  # The Job consumes the Secret instead of creating it.
  - it: setup-keycloak Job sources the chart-owned client secret via envFrom
    templates:
      - charts/keycloak-configure/templates/job.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: keycloak-client-secret
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,post-upgrade,post-rollback

  - it: setup-keycloak Job honors global.existingKeycloakClientSecret
    templates:
      - charts/keycloak-configure/templates/job.yaml
    set:
      global:
        existingKeycloakClientSecret: byo-keycloak-client # pragma: allowlist secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: byo-keycloak-client

  # The script must publish the chart's values and must no longer write the
  # Secret itself.
  - it: setup script publishes the chart secret and never creates it
    templates:
      - charts/keycloak-configure/templates/configmap.yaml
    asserts:
      - matchRegex:
          path: data["script.sh"]
          pattern: '"secret": "''"\$\{KEYCLOAK_CLIENT_SECRET\}"''"'
      - matchRegex:
          path: data["script.sh"]
          pattern: '"secret": "''"\$\{KEYCLOAK_M2M_CLIENT_SECRET\}"''"'
      - matchRegex:
          path: data["script.sh"]
          pattern: 'verify_client_secrets "\$TOKEN"'
      - notMatchRegex:
          path: data["script.sh"]
          pattern: 'kubectl create secret generic keycloak-client-secret'

  # Both app Deployments must reference the same name the Secret is rendered
  # under, including the BYO override.
  - it: registry and auth-server mount the chart-owned client secret
    templates:
      - charts/registry/templates/deployment.yaml
      - charts/auth-server/templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: keycloak-client-secret

  - it: registry and auth-server honor global.existingKeycloakClientSecret
    templates:
      - charts/registry/templates/deployment.yaml
      - charts/auth-server/templates/deployment.yaml
    set:
      global:
        existingKeycloakClientSecret: byo-keycloak-client # pragma: allowlist secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: byo-keycloak-client
      - notContains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: keycloak-client-secret
