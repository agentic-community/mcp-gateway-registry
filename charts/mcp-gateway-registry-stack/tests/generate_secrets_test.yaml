suite: global.generateSecrets gates every chart-generated secret (GitOps safety)
release:
  name: test
  namespace: default
# GitOps baseline: generation disabled with every secret value supplied. Each
# negative test blanks exactly ONE value and asserts the render fails naming it.
#
# The baseline has to be complete because helm-unittest renders the whole chart
# (subcharts included) for every case — the first `fail` anywhere aborts the
# render, so a partial baseline would attribute failures to the wrong template.
set:
  global:
    generateSecrets: false
    secretKey: stack-secret-key # pragma: allowlist secret
    authProvider:
      keycloak:
        clientSecret: web-cs # pragma: allowlist secret
        m2mClientSecret: m2m-cs # pragma: allowlist secret
  keycloak:
    auth:
      adminPassword: kc-admin-pw # pragma: allowlist secret
    postgresql:
      auth:
        password: kc-pg-pw # pragma: allowlist secret
        postgresPassword: kc-pg-su-pw # pragma: allowlist secret
  registry:
    egressAuth:
      markerSecret: marker # pragma: allowlist secret
  mongodb-configure:
    mongodb:
      password: mongo-pw # pragma: allowlist secret
tests:
  # ---------------------------------------------------------------------------
  # GitOps mode renders, and every explicit value lands verbatim.
  # keycloak.auth.adminPassword and keycloak.postgresql.auth.* are Bitnami's
  # own value names; the bundled subchart ignores them because existingSecret
  # points at these templates, so before this change they were silently dropped
  # and the passwords were always generated.
  # ---------------------------------------------------------------------------
  - it: honors every explicit secret value with generation disabled
    templates:
      - templates/shared-secret.yaml
      - templates/keycloak-admin-secret.yaml
      - templates/keycloak-pg-secret.yaml
      - templates/keycloak-client-secret.yaml
      - charts/mongodb-configure/templates/secret.yaml
    asserts:
      - equal:
          path: data.SECRET_KEY
          value: c3RhY2stc2VjcmV0LWtleQ== # stack-secret-key
        template: templates/shared-secret.yaml
      - equal:
          path: data.AUTH_SERVER_NGINX_MARKER_SECRET
          value: bWFya2Vy # marker
        template: templates/shared-secret.yaml
      - equal:
          path: data["admin-password"]
          value: a2MtYWRtaW4tcHc= # kc-admin-pw
        template: templates/keycloak-admin-secret.yaml
      - equal:
          path: data.password
          value: a2MtcGctcHc= # kc-pg-pw
        template: templates/keycloak-pg-secret.yaml
      - equal:
          path: data["postgres-password"]
          value: a2MtcGctc3UtcHc= # kc-pg-su-pw
        template: templates/keycloak-pg-secret.yaml
      - equal:
          path: data.KEYCLOAK_CLIENT_SECRET
          value: d2ViLWNz # web-cs
        template: templates/keycloak-client-secret.yaml
      - equal:
          path: data.KEYCLOAK_M2M_CLIENT_SECRET
          value: bTJtLWNz # m2m-cs
        template: templates/keycloak-client-secret.yaml
      - equal:
          path: data.DOCUMENTDB_PASSWORD
          value: bW9uZ28tcHc= # mongo-pw
        template: charts/mongodb-configure/templates/secret.yaml

  # A disabled feature must never block a GitOps render: federation keys are
  # only emitted when federation is on.
  - it: does not demand federation values when federation is disabled
    templates:
      - templates/shared-secret.yaml
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: data.FEDERATION_STATIC_TOKEN

  - it: accepts explicit federation values when federation is enabled
    templates:
      - templates/shared-secret.yaml
    set:
      global:
        federation:
          staticTokenAuthEnabled: true
          staticToken: fed-token
          encryptionKey: fed-key
    asserts:
      - equal:
          path: data.FEDERATION_STATIC_TOKEN
          value: ZmVkLXRva2Vu # fed-token
      - equal:
          path: data.FEDERATION_ENCRYPTION_KEY
          value: ZmVkLWtleQ== # fed-key

  # ---------------------------------------------------------------------------
  # Each gate fires on its own, naming the value to set.
  # ---------------------------------------------------------------------------
  - it: refuses to invent SECRET_KEY
    set:
      global:
        secretKey: ""
    asserts:
      - failedTemplate:
          errorPattern: 'global\.generateSecrets is false and SECRET_KEY has no value.*Set global\.secretKey explicitly, or set global\.existingSharedSecret'

  - it: refuses to invent the nginx marker secret
    set:
      registry:
        egressAuth:
          markerSecret: ""
    asserts:
      - failedTemplate:
          errorPattern: 'AUTH_SERVER_NGINX_MARKER_SECRET has no value.*Set registry\.egressAuth\.markerSecret'

  - it: refuses to invent federation values when federation is enabled
    set:
      global:
        federation:
          staticTokenAuthEnabled: true
    asserts:
      - failedTemplate:
          errorPattern: 'FEDERATION_STATIC_TOKEN has no value.*Set global\.federation\.staticToken'

  - it: refuses to invent the Keycloak admin password
    set:
      keycloak:
        auth:
          adminPassword: ""
    asserts:
      - failedTemplate:
          errorPattern: 'the Keycloak admin password has no value.*Set keycloak\.auth\.adminPassword'

  - it: refuses to invent the PostgreSQL user password
    set:
      keycloak:
        postgresql:
          auth:
            password: ""
    asserts:
      - failedTemplate:
          errorPattern: 'the Keycloak PostgreSQL user password has no value.*Set keycloak\.postgresql\.auth\.password'

  - it: refuses to invent the PostgreSQL superuser password
    set:
      keycloak:
        postgresql:
          auth:
            postgresPassword: ""
    asserts:
      - failedTemplate:
          errorPattern: 'the PostgreSQL superuser password has no value.*Set keycloak\.postgresql\.auth\.postgresPassword'

  - it: refuses to invent the Keycloak web client secret
    set:
      global:
        authProvider:
          keycloak:
            clientSecret: ""
    asserts:
      - failedTemplate:
          errorPattern: 'KEYCLOAK_CLIENT_SECRET has no value.*Set global\.authProvider\.keycloak\.clientSecret'

  - it: refuses to invent the Keycloak M2M client secret
    set:
      global:
        authProvider:
          keycloak:
            m2mClientSecret: ""
    asserts:
      - failedTemplate:
          errorPattern: 'KEYCLOAK_M2M_CLIENT_SECRET has no value.*Set global\.authProvider\.keycloak\.m2mClientSecret'

  - it: refuses to invent DOCUMENTDB_PASSWORD
    set:
      mongodb-configure:
        mongodb:
          password: ""
    asserts:
      - failedTemplate:
          errorPattern: 'DOCUMENTDB_PASSWORD has no value.*mongodb-configure\.mongodb\.password'

  # ---------------------------------------------------------------------------
  # Pre-existing Secrets satisfy the gates with no explicit values at all:
  # nothing is generated, so nothing can rotate.
  # ---------------------------------------------------------------------------
  - it: existing Secrets satisfy every gate
    templates:
      - templates/shared-secret.yaml
      - templates/keycloak-client-secret.yaml
      - charts/mongodb-configure/templates/secret.yaml
    set:
      global:
        secretKey: ""
        authProvider:
          keycloak:
            clientSecret: ""
            m2mClientSecret: ""
        existingSharedSecret: byo-shared # pragma: allowlist secret
        existingKeycloakClientSecret: byo-kc-client # pragma: allowlist secret
        existingMongoCredentialsSecret: byo-mongo # pragma: allowlist secret
      mongodb-configure:
        mongodb:
          password: ""
          existingSecret: byo-mongo # pragma: allowlist secret
      registry:
        egressAuth:
          markerSecret: ""
    asserts:
      - hasDocuments:
          count: 0

  # ---------------------------------------------------------------------------
  # Default (generation on) is unchanged: values are invented on first install.
  # ---------------------------------------------------------------------------
  - it: generates every secret by default
    templates:
      - templates/shared-secret.yaml
      - templates/keycloak-admin-secret.yaml
      - templates/keycloak-pg-secret.yaml
      - charts/mongodb-configure/templates/secret.yaml
    set:
      global:
        generateSecrets: true
        secretKey: ""
      keycloak:
        auth:
          adminPassword: ""
        postgresql:
          auth:
            password: ""
            postgresPassword: ""
      registry:
        egressAuth:
          markerSecret: ""
      mongodb-configure:
        mongodb:
          password: ""
    asserts:
      - matchRegex:
          path: data.SECRET_KEY
          pattern: "^[A-Za-z0-9+/=]{80,}$"
        template: templates/shared-secret.yaml
      - isNotEmpty:
          path: data.AUTH_SERVER_NGINX_MARKER_SECRET
        template: templates/shared-secret.yaml
      - isNotEmpty:
          path: data["admin-password"]
        template: templates/keycloak-admin-secret.yaml
      - isNotEmpty:
          path: data.password
        template: templates/keycloak-pg-secret.yaml
      - isNotEmpty:
          path: data["postgres-password"]
        template: templates/keycloak-pg-secret.yaml
      - isNotEmpty:
          path: data.DOCUMENTDB_PASSWORD
        template: charts/mongodb-configure/templates/secret.yaml
