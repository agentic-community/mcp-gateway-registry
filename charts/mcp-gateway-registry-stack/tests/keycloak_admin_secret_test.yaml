suite: bundled Keycloak admin credential selection
release:
  name: test
  namespace: default
set:
  keycloak.postgres.bootstrap.mode: fresh-install
tests:
  - it: refuses a local BYO secret that would strand the configure Job
    templates:
      - templates/validate-values.yaml
    set:
      keycloak.auth.existingSecret: operator-admin
    asserts:
      - failedTemplate:
          errorPattern: set global.authProvider.keycloak.adminExistingSecret
  - it: uses the shared BYO secret and custom key for the server
    templates:
      - charts/keycloak/templates/keycloak.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      global.authProvider.keycloak.adminExistingSecret: operator-admin
      global.authProvider.keycloak.adminExistingSecretPasswordKey: credential
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KC_BOOTSTRAP_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: operator-admin
                key: credential
        template: charts/keycloak/templates/keycloak.yaml
  - it: uses the same BYO secret and custom key for configuration
    templates:
      - charts/keycloak-configure/templates/job.yaml
    set:
      global.authProvider.keycloak.adminExistingSecret: operator-admin
      global.authProvider.keycloak.adminExistingSecretPasswordKey: credential
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KEYCLOAK_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: operator-admin
                key: credential
        template: charts/keycloak-configure/templates/job.yaml
  - it: refuses custom keys without a BYO admin secret
    templates:
      - templates/validate-values.yaml
    set:
      global.authProvider.keycloak.adminExistingSecretPasswordKey: missing-generated-key
    asserts:
      - failedTemplate:
          errorPattern: a custom admin secret key requires
  - it: uses the shared BYO credential for registry identity management
    templates:
      - charts/registry/templates/deployment.yaml
    set:
      global.authProvider.keycloak.adminExistingSecret: operator-admin
      global.authProvider.keycloak.adminExistingSecretPasswordKey: credential
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KEYCLOAK_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: operator-admin
                key: credential
  - it: uses the shared BYO credential for admin initialization
    templates:
      - charts/keycloak/templates/admin-init.yaml
    documentSelector:
      path: kind
      value: Job
    set:
      global.authProvider.keycloak.adminExistingSecret: operator-admin
      global.authProvider.keycloak.adminExistingSecretPasswordKey: credential
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KEYCLOAK_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: operator-admin
                key: credential
