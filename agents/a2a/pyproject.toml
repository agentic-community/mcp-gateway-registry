[project]
name = "a2a"
version = "0.1.0"
description = "Travel and Flight Booking Agents"
requires-python = ">=3.14"
dependencies = [
    "certifi>=2026.10.19",
    "fastapi>=0.115.12",
    "uvicorn[standard]>=0.34.2",
    "strands-agents[a2a]>=0.1.6",
    "pydantic>=2.11.3",
    "python-dotenv>=1.2.2",
    "aiohttp>=3.14.0",
    "pyjwt[crypto]>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "bedrock-agentcore-starter-toolkit>=0.1.0",
]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.uv]
# Local-only project - never resolve from PyPI
package = false
# Bumping certifi exclusion date to bypass 7-day window due to eMudhra certificate compromise
exclude-newer-package = { certifi = "2026-10-22T00:00:00Z" }
