# MCP Gateway Registry - CDK Configuration
#
# This file controls the CDK deployment of the MCP Gateway Registry.
# Sensitive values (passwords, tokens, keys) should be set via environment
# variables with the CDK_ prefix. See registry-config.ts for the full list.
#
# Environment variables for sensitive values:
#   CDK_KEYCLOAK_ADMIN_PASSWORD
#   CDK_KEYCLOAK_DATABASE_PASSWORD
#   CDK_DOCUMENTDB_ADMIN_PASSWORD
#   CDK_GRAFANA_ADMIN_PASSWORD
#   CDK_REGISTRY_API_TOKEN
#   CDK_FEDERATION_STATIC_TOKEN
#   CDK_FEDERATION_ENCRYPTION_KEY
#   CDK_ENTRA_CLIENT_SECRET
#   CDK_OKTA_CLIENT_SECRET
#   CDK_OKTA_M2M_CLIENT_SECRET
#   CDK_OKTA_API_TOKEN
#   CDK_AUTH0_CLIENT_SECRET
#   CDK_AUTH0_M2M_CLIENT_SECRET
#   CDK_AUTH0_MANAGEMENT_API_TOKEN
#   CDK_EMBEDDINGS_API_KEY
#   CDK_ANS_API_KEY
#   CDK_ANS_API_SECRET
#   CDK_GITHUB_PAT
#   CDK_GITHUB_APP_PRIVATE_KEY
#   CDK_OTEL_EXPORTER_OTLP_HEADERS

registry:
  enabled: true
  name: mcp-gateway
  awsRegion: us-east-1
  # awsAccountId: "123456789012"  # Set to your AWS account ID

  # Network
  vpcCidr: "10.0.0.0/16"
  ingressCidrBlocks:
    - "0.0.0.0/0"
  # CIDRs of the trusted proxy hop in front of the bundled nginx, for nginx's
  # set_real_ip_from. Empty resolves to vpcCidr, which is right for a plain
  # ALB. Set it explicitly to list CloudFront's origin-facing ranges too, or
  # to narrow the range.
  trustedRealIpCidrs: ""

  # DNS (set enableRoute53Dns to true and configure baseDomain for custom domains)
  enableRoute53Dns: false
  useRegionalDomains: true
  baseDomain: mycorp.click
  # certificateArn: ""

  # Storage
  storageBackend: documentdb

  # Deployment
  deploymentMode: with-gateway
  registryMode: full
  enableObservability: true
  enableWaf: true
  createCodebuild: false
  disableAiRegistryToolsServer: "false"

  # DocumentDB (only used when storageBackend is 'documentdb')
  documentdb:
    adminUsername: docdbadmin
    shardCapacity: 2
    shardCount: 1
    instanceClass: db.t3.medium
    replicaCount: 0
    database: mcp_registry
    namespace: default
    useTls: true
    useIam: false

  # Keycloak
  keycloak:
    adminUser: admin
    databaseUsername: keycloak
    databaseMinAcu: 0.5
    databaseMaxAcu: 2
    logLevel: INFO
    # domain / rootDomain: only used when enableRoute53Dns=true and
    # useRegionalDomains=false. When CloudFront is enabled without Route53,
    # KC_HOSTNAME is set to the CloudFront distribution's own domain
    # (materialized in-stack, no cross-stack lookup needed).
    domain: ""
    rootDomain: ""

  # Container images (leave empty to use defaults or set to ECR URIs)
  images:
    registry: "mcpgateway/registry:latest"
    authServer: "mcpgateway/auth-server:latest"
    keycloak: "quay.io/keycloak/keycloak:26.2.4"
    currenttime: ""
    mcpgw: "public.ecr.aws/p3v1o3c6/mcpgw:1.26.0"
    realserverfaketools: ""
    flightBookingAgent: ""
    travelAssistantAgent: ""
    metricsService: "mcpgateway/metrics-service:latest"
    grafana: "grafana/grafana:11.6.0"

  # Service replicas
  replicas:
    registry: 1
    auth: 1
    currenttime: 1
    mcpgw: 1
    realserverfaketools: 1
    flightBookingAgent: 1
    travelAssistantAgent: 1

  # Embeddings
  embeddings:
    provider: sentence-transformers
    modelName: all-MiniLM-L6-v2
    modelDimensions: 384
    awsRegion: us-east-1

  # Security scanning
  security:
    scanEnabled: false
    scanOnRegistration: false
    blockUnsafeServers: false
    analyzers: yara
    scanTimeout: 60
    addPendingTag: false

  # Health checks and tool list refresh (issue #2050). Each registry task
  # refreshes on its own; the period is toolRefreshEveryCycles x intervalSeconds.
  healthChecks:
    intervalSeconds: 300
    toolRefreshEnabled: false
    toolRefreshEveryCycles: 3
    toolFetchMaxConcurrency: 5

  # Federation
  federation:
    registryId: ""
    staticTokenAuthEnabled: false
    awsRegistryFederationEnabled: false
    # Cross-account federation role ARNs the registry task may assume.
    # Empty disables cross-account access (fail closed); only same-account
    # federation works. Each entry: arn:aws:iam::<account-id>:role/<name>.
    awsRegistryFederationAssumeRoleArns: []

  # Audit logging
  audit:
    logEnabled: true
    logTtlDays: 7

  # OpenTelemetry
  otel:
    otlpEndpoint: ""
    otlpExportIntervalMs: 30000
    exporterOtlpMetricsTemporalityPreference: cumulative
    # Pin this to a released tag for any deployment you need to roll back.
    adotCollectorImage: "public.ecr.aws/aws-observability/aws-otel-collector:latest"

  # Identity providers (disabled by default)
  entra:
    enabled: false
  okta:
    enabled: false
  auth0:
    enabled: false
    groupsClaim: "https://mcp-gateway/groups"
  # Client secrets below are referenced by ARN, never by value. A literal is
  # written into the synthesized template, so it would sit in plaintext in
  # cdk.out and in the deployed CloudFormation stack. Create each secret out of
  # band and paste its COMPLETE ARN (the one ending in a six-character suffix):
  #
  #   aws secretsmanager create-secret --name mcp/cognito-client-secret \
  #     --secret-string "$VALUE" --query ARN --output text
  #
  # If you encrypt one with a customer-managed KMS key, also grant the ECS task
  # execution role kms:Decrypt on that key. CDK cannot discover it from the
  # secret ARN, so a CMK-encrypted secret otherwise fails at task start.

  # Amazon Cognito. Enabling it requires userPoolId, clientId and
  # clientSecretArn; synth fails on an incomplete set.
  cognito:
    enabled: false
    # userPoolId: "us-east-1_AbC123"
    # clientId: ""
    # clientSecretArn: "arn:aws:secretsmanager:us-east-1:123456789012:secret:mcp/cognito-AbCdEf"
    # Hosted-UI domain PREFIX, not a hostname: the auth-server appends
    # ".auth.<region>.amazoncognito.com". Pass "my-pool", not
    # "my-pool.auth.us-east-1.amazoncognito.com". Leave empty to derive it
    # from userPoolId, which works only if the pool's domain uses that prefix.
    # domain: "my-pool"
    # M2M app client ids the auth-server accepts, comma or whitespace
    # separated. Empty denies every client-credentials token.
    m2mClientIds: ""
  # PingFederate. Enabling it requires baseUrl, clientId, clientSecretArn and
  # adminPasswordArn. The registry raises without the admin password, so login
  # would work while user administration quietly failed.
  pingfederate:
    enabled: false
    # baseUrl: "https://pingfederate.internal"
    # externalUrl: "https://sso.example.com"
    # clientId: ""
    # clientSecretArn: "arn:aws:secretsmanager:us-east-1:123456789012:secret:mcp/pf-AbCdEf"
    # Optional. Unset means the provider reuses the web client secret.
    # m2mClientSecretArn: ""
    groupsClaim: "groups"
    # EXTRA audiences accepted on an M2M token, comma or whitespace separated.
    # Optional: the client ids and applicationIdUri are always accepted, so an
    # empty list is already fail-closed.
    m2mAllowedAudiences: ""
    # Admin API, used by the registry only to create OAuth clients and PCV
    # users. The password must not be the vendor default 2FederateM0re; the
    # registry rejects it.
    adminUrl: "https://pingfederate:9999"
    adminUser: "administrator"
    # adminPasswordArn: "arn:aws:secretsmanager:us-east-1:123456789012:secret:mcp/pf-admin-AbCdEf"

  # Egress auth: per-user credential vault, OAuth consent and OBO exchange.
  # Enabling it requires a Mongo-family storageBackend. Set
  # credentialEncryptionKeyArn too, or vaulted credentials are stored in
  # plaintext (the application's legacy behavior).
  egress:
    enabled: false
    # Only secrets-manager is supported here. The application also accepts
    # openbao, which this stack does not provision.
    secretStoreBackend: secrets-manager  # pragma: allowlist secret
    secretsManagerPathPrefix: "mcp/egress"  # pragma: allowlist secret
    # Secret holding the AES-256-GCM input keying material, at least 32 bytes.
    # Rotating it needs a coordinated re-encryption of the whole vault.
    # credentialEncryptionKeyArn: ""
    # Customer-managed KMS KEY ARN for the vault. Empty uses the AWS-managed
    # key. Must be arn:aws:kms:<region>:<account>:key/<id>: IAM accepts only a
    # key ARN where this value is used, so an alias ARN, an alias name or a
    # bare key id grants nothing and every vault write fails. Resolve an alias
    # with: aws kms describe-key --key-id alias/<name> --query KeyMetadata.Arn
    secretsManagerKmsKeyArn: ""
    registryInternalUrl: "http://registry:8091"
    oauthCallbackBaseUrl: ""
    oauthTrustedIdpHosts: ""
    # WHITESPACE-separated audiences an obo_exchange server may target.
    # Optional: empty is not "allow anything", it falls back to a shape rule
    # that admits only an internal MCP server's own IdP audience (an "api://"
    # App ID URI or a bare non-GUID client id) and rejects every https://
    # host URL and every bare GUID. A bare-GUID target has to be listed here.
    # Set it to narrow that to an explicit, audited set.
    oboAllowedAudiences: ""
    tokenRefreshSkewSeconds: 300
    stateTtlSeconds: 600
    oboCacheEnabled: false
    oboCacheMaxTtlSeconds: 300
    oboCacheExpirySkewSeconds: 30
    httpPoolMaxConnections: 100
    httpPoolMaxKeepalive: 20
    httpPoolKeepaliveExpirySeconds: 30
    httpPoolConnectRetries: 1
    forwardProxyEnabled: false
    forwardProxyCaBundle: ""

  # GitHub private repo auth
  github:
    apiBaseUrl: "https://api.github.com"

  # ANS (Agent Naming Service)
  ans:
    integrationEnabled: false
    apiEndpoint: "https://api.godaddy.com"
    apiTimeoutSeconds: 30
    syncIntervalHours: 6
    verificationCacheTtlSeconds: 3600

  # Telemetry
  telemetry:
    disabled: ""
    optOut: ""
    heartbeatIntervalMinutes: "1440"
    debug: "false"

  # Registry card (federation metadata)
  registryCard:
    name: "mcp-gateway"
    organizationName: "MCP Gateway"
    description: "MCP Gateway Registry"
    contactEmail: ""
    contactUrl: ""

  # CloudFront
  # NOTE: at least one of `enableRoute53Dns` or `cloudfront.enabled` must be
  # true. Keycloak's sslRequired=external policy blocks admin ops over plain
  # HTTP, so a public HTTPS front is required (custom domain + ACM, or a
  # CloudFront-issued `*.cloudfront.net` cert).
  cloudfront:
    enabled: true
    prefixListName: ""

  # Session
  session:
    # Secure attribute on the session cookie over HTTPS (never set on plain
    # HTTP). This stack always serves HTTPS, so keep it true.
    cookieSecure: true
    cookieDomain: ""
    # Name the session cookie __Host-mcp_gateway_session (Secure, Path=/, no
    # Domain). Requires cookieSecure: true and an empty cookieDomain; the
    # registry and auth-server refuse to start otherwise. Turning it on signs
    # every user out once.
    cookieHostPrefix: false
    # Browser session lifetime in seconds: the session store TTL, the session
    # cookie's Max-Age and the registry's signature check. Rendered into both
    # the registry and auth-server so they match. Must be a positive integer.
    maxAgeSeconds: 28800
    # Exact-match allowlist of OAuth login/logout redirect URIs (open-redirect
    # hardening). Comma-separated absolute URLs. Empty falls back to the weaker
    # cookie-domain heuristic; set it to harden. Example:
    # "https://registry.example.com/,https://registry.example.com/login"
    oauth2AllowedRedirectUris: ""
    oauthStoreTokensInSession: false

  # UI tabs
  uiTabs:
    showServersTab: true
    showVirtualServersTab: true
    showSkillsTab: true
    showAgentsTab: true

  # Static token auth
  staticTokenAuth:
    registryStaticTokenAuthEnabled: false
    maxTokensPerUserPerHour: 100
    m2mDirectRegistrationEnabled: true

  # Monitoring
  monitoring:
    enabled: true
    alarmEmail: ""
    alarmSnsTopicArn: ""
