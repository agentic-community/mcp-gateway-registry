ddle" fill="#3c4043">/s/&lt;slug&gt;/... goes to that server's hub, with only MCP headers;</text><text x="950.0" y="137.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">everything else goes to the control API</text><rect x="700" y="186" width="250" height="80" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.8"/><text x="825.0" y="207.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">control API</text><text x="825.0" y="226.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">/internal/servers, preview,</text><text x="825.0" y="242.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">status; sync token</text><text x="825.0" y="258.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">checked on each call</text><rect x="970" y="186" width="230" height="80" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.8"/><text x="1085.0" y="215.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">/health</text><text x="1085.0" y="234.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">no auth; reports</text><text x="1085.0" y="250.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">started_at</text><rect x="700" y="306" width="500" height="66" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.8"/><text x="950.0" y="328.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">hub manager</text><text x="950.0" y="347.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">one FastMCP hub per server, rebuilt and swapped on each push;</text><text x="950.0" y="363.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">a push not newer than the running generation is ignored</text><rect x="700" y="430" width="500" height="110" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.8"/><text x="950.0" y="466.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">per-target backend client</text><text x="950.0" y="485.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">filters, overrides, tool hints from the HTTP method,</text><text x="950.0" y="501.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">the target's one credential,</text><text x="950.0" y="517.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">SSRF guard (PROXY_PROFILE), 2 MiB response cap</text><rect x="1270" y="80" width="160" height="66" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.8"/><text x="1350.0" y="102.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">nginx gateway</text><text x="1350.0" y="121.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">/&lt;slug&gt;/mcp,</text><text x="1350.0" y="137.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">auth_re