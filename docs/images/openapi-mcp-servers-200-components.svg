<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="600" viewBox="0 0 1460 600"><title>OpenAPI MCP servers: components</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3c4043" stroke-dasharray="none"/></marker><marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#3c4043" stroke-width="1.5" stroke-dasharray="none"/></marker></defs><rect x="0" y="0" width="1460" height="600" fill="#ffffff"/><text x="730.0" y="30.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#202124">OpenAPI MCP servers: components</text><rect x="20" y="50" width="560" height="520" rx="12" fill="none" stroke="#1a73e8" stroke-width="1.4" stroke-dasharray="7,5"/><text x="32.0" y="68.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#1a73e8">Registry (control plane)</text><rect x="680" y="50" width="540" height="520" rx="12" fill="none" stroke="#8430ce" stroke-width="1.4" stroke-dasharray="7,5"/><text x="692.0" y="68.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#8430ce">openapi-mcp container (data plane)</text><rect x="40" y="80" width="250" height="66" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.8"/><text x="165.0" y="102.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">openapi-servers API</text><text x="165.0" y="121.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">/api/openapi-servers</text><text x="165.0" y="137.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">admin-only writes, CSRF</text><rect x="310" y="80" width="250" height="66" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.8"/><text x="435.0" y="102.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">server_service</text><text x="435.0" y="121.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">ServerInfo record per server,</text><text x="435.0" y="137.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">search, scopes, nginx</text><rect x="40" y="186" width="250" height="80" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.8"/><text x="165.0" y="207.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">openapi_server_service</text><text x="165.0" y="226.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">spec fetch and checks,</text><text x="165.0" y="242.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">credential encryption,</text><text x="165.0" y="258.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">generation counter</text><rect x="310" y="186" width="250" height="80" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.8"/><text x="435.0" y="215.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">openapi_mcp_client</text><text x="435.0" y="234.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor=