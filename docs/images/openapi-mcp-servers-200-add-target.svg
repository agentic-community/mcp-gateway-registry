" marker-end="url(#arrow)"/><text x="322.0" y="416.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">8. at most 100 tools,</text><text x="322.0" y="416.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#202124">8. at most 100 tools,</text><text x="322.0" y="430.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">names at most 64 characters</text><text x="322.0" y="430.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#202124">names at most 64 characters</text><rect x="20" y="446" width="900" height="27" rx="4" fill="#fffde7" stroke="#f9ab00" stroke-width="1.2"/><text x="470.0" y="462.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043" font-style="italic">Any failure so far returns 4xx or 502 and stores nothing.</text><line x1="280" y1="519" x2="660" y2="519" stroke="#3c4043" stroke-width="1.5" marker-end="url(#arrow)"/><text x="470.0" y="498.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">9. store spec by SHA-256; append target</text><text x="470.0" y="498.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#202124">9. store spec by SHA-256; append target</text><text x="470.0" y="512.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">(credential encrypted); generation + 1</text><text x="470.0" y="512.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#202124">(credential encrypted); generation + 1</text><line x1="280" y1="555" x2="850" y2="555" stroke="#3c4043" stroke-width="1.5" marker-end="url(#arrow)"/><text x="565.0" y="548.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">10. PUT /internal/servers/{slug}: full state</text><text x="565.0" y="548.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#202124">10. PUT /internal/servers/{slug}: full state</text><path d="M850,587 L884,587 L884,605 L852,605" fill="none" stroke="#3c4043" stroke-width="1.5" marker-end="url(#arrow)"/><text x="892.0" y="595.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">11. build new hub, swap it in,</text><text x="892.0" y="595.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#202124">11. build new hub, swap it in,</text><text x="892.0" y="609.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">close the old one</text><text x="892.0" y="609.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#202124">close the old one</text><line x1="850" y1="639" x2="280" y2="639" stroke="#3c4043" stroke-width="1.5" stroke-dasharray="6,4"/><path d="M290,633 L280,639 L290,645" fill="none" stroke="#3c4043" stroke-width="1.6" stroke-linejoin="round"/><text x="565.0" y="632.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" stroke="#ffffff" stroke-width="4"