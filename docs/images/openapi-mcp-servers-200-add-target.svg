join="round" fill="#ffffff">2. admin check, CSRF, limits,</text><text x="322.0" y="176.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#202124">2. admin check, CSRF, limits,</text><text x="322.0" y="190.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">SSRF guard on base_url</text><text x="322.0" y="190.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#202124">SSRF guard on base_url</text><line x1="280" y1="220" x2="470" y2="220" stroke="#3c4043" stroke-width="1.5" marker-end="url(#arrow)"/><text x="375.0" y="213.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">3. GET spec_url (guarded, no redirects)</text><text x="375.0" y="213.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#202124">3. GET spec_url (guarded, no redirects)</text><line x1="470" y1="256" x2="280" y2="256" stroke="#3c4043" stroke-width="1.5" stroke-dasharray="6,4"/><path d="M290,250 L280,256 L290,262" fill="none" stroke="#3c4043" stroke-width="1.6" stroke-linejoin="round"/><text x="375.0" y="249.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">4. spec, at most 5 MiB</text><text x="375.0" y="249.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#202124">4. spec, at most 5 MiB</text><path d="M280,288 L314,288 L314,306 L282,306" fill="none" stroke="#3c4043" stroke-width="1.5" marker-end="url(#arrow)"/><text x="322.0" y="296.0" font-family="DejaVu Sans, Helvetica, Arial, 