<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="850" viewBox="0 0 1130 850"><title>Adding a REST target to a server (POST /api/openapi-servers/{slug}/targets)</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3c4043" stroke-dasharray="none"/></marker><marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#3c4043" stroke-width="1.5" stroke-dasharray="none"/></marker></defs><rect x="0" y="0" width="1130" height="850" fill="#ffffff"/><text x="565.0" y="30.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#202124">Adding a REST target to a server (POST /api/openapi-servers/{slug}/targets)</text><line x1="90" y1="102" x2="90" y2="826" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="4,4"/><rect x="5.0" y="60" width="170" height="42" rx="7" fill="#fff4e5" stroke="#e8710a" stroke-width="1.8"/><text x="90.0" y="86.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#202124">Admin</text><line x1="280" y1="102" x2="280" y2="826" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="4,4"/><rect x="195.0" y="60" width="170" height="42" rx="7" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.8"/><text x="280.0" y="86.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#202124">Registry</text><line x1="470" y1="102" x2="470" y2="826" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="4,4"/><rect x="385.0" y="60" width="170" height="42" rx="7" fill="#fce8e6" stroke="#c5221f" stroke-width="1.8"/><text x="470.0" y="86.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#202124">Spec host</text><line x1="660" y1="102" x2="660" y2="826" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="4,4"/><rect x="575.0" y="60" width="170" height="42" rx="7" fill="#fef7e0" stroke="#b06000" stroke-width="1.8"/><text x="660.0" y="86.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#202124">DocumentDB</text><line x1="850" y1="102" x2="850" y2="826" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="4,4"/><rect x="765.0" y="60" width="170" height="42" rx="7" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.8"/><text x="850.0" y="86.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#202124">openapi-mcp</text><line x1="1040" y1="102" x2="1040" y2="826" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="4,4"/><rect x="955.0" y="60" width="170" height="42" rx="7" fill="#e6f4ea" stroke="#188038" stroke-width="1.8"/><text x="1040.0" y="86.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#202124">nginx + health</text><line x1="90" y1="150" x2="280" y2="150" stroke="#3c4043" stroke-width="1.5" marker-end="url(#arrow)"/><text x="185.0" y="129.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">1. POST target: spec_url or spec_content,</text><text x="185.0" y="129.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#202124">1. POST target: spec_url or spec_content,</text><text x="185.0" y="143.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">base_url, auth</text><text x="185.0" y="143.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#202124">base_url, auth</text><path d="M280,182 L314,182 L314,200 L282,200" fill="none" stroke="#3c4043" stroke-width="1.5" marker-end="url(#arrow)"/><text x="322.0" y="190.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">2. admin check, CSRF, limits, SSRF guard</text><text x="322.0" y="190.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#202124">2. admin check, CSRF, limits, SSRF guard</text><text x="322.0" y="204.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">on base_url, HTTPS if it sends a key</text><text x="322.0" y="204.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#202124">on base_url, HTTPS if it sends a key</text><line x1="280" y1="248" x2="470" y2="248" stroke="#3c4043" stroke-width="1.5" marker-end="url(#arrow)"/><text x="375.0" y="227.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">3. GET spec_url (guarded, no redirects,</text><text x="375.0" y="227.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#202124">3. GET spec_url (guarded, no redirects,</text><text x="375.0" y="241.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">uncompressed); skipped for an upload</text><text x="375.0" y="241.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#202124">uncompressed); skipped for an upload</text><line x1="470" y1="284" x2="280" y2="284" stroke="#3c4043" stroke-width="1.5" stroke-dasharray="6,4"/><path d="M290,278 L280,284 L290,290" fill="none" stroke="#3c4043" stroke-width="1.6" stroke-linejoin="round"/><text x="375.0" y="277.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">4. spec, at most 5 MiB</text><text x="375.0" y="277.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#202124">4. spec, at most 5 MiB</text><path d="M280,316 L314,316 L314,334 L282,334" fill="none" stroke="#3c4043" stroke-width="1.5" marker-end="url(#arrow)"/><text x="322.0" y="324.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">5. UTF-8, no YAML aliases, OpenAPI 3.x,</text><text x="322.0" y="324.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#202124">5. UTF-8, no YAML aliases, OpenAPI 3.x,</text><text x="322.0" y="338.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">local $refs, no '..' paths</text><text x="322.0" y="338.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#202124">local $refs, no '..' paths</text><line x1="280" y1="368" x2="850" y2="368" stroke="#3c4043" stroke-width="1.5" marker-end="url(#arrow)"/><text x="565.0" y="361.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">6. POST /internal/preview (sync token)</text><text x="565.0" y="361.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#202124">6. POST /internal/preview (sync token)</text><line x1="850" y1="404" x2="280" y2="404" stroke="#3c4043" stroke-width="1.5" stroke-dasharray="6,4"/><path d="M290,398 L280,404 L290,410" fill="none" stroke="#3c4043" stroke-width="1.6" stroke-linejoin="round"/><text x="565.0" y="397.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">7. tool names, tag counts, warnings</text><text x="565.0" y="397.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#202124">7. tool names, tag counts, warnings</text><path d="M280,436 L314,436 L314,454 L282,454" fill="none" stroke="#3c4043" stroke-width="1.5" marker-end="url(#arrow)"/><text x="322.0" y="444.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">8. at most 100 tools,</text><text x="322.0" y="444.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#202124">8. at most 100 tools,</text><text x="322.0" y="458.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">names at most 64 characters</text><text x="322.0" y="458.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#202124">names at most 64 characters</text><rect x="20" y="474" width="900" height="27" rx="4" fill="#fffde7" stroke="#f9ab00" stroke-width="1.2"/><text x="470.0" y="490.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043" font-style="italic">Any failure so far returns 4xx or 502 and stores nothing.</text><line x1="280" y1="547" x2="660" y2="547" stroke="#3c4043" stroke-width="1.5" marker-end="url(#arrow)"/><text x="470.0" y="526.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">9. store spec by SHA-256; append target</text><text x="470.0" y="526.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#202124">9. store spec by SHA-256; append target</text><text x="470.0" y="540.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">(credential encrypted); generation + 1</text><text x="470.0" y="540.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#202124">(credential encrypted); generation + 1</text><line x1="280" y1="583" x2="850" y2="583" stroke="#3c4043" stroke-width="1.5" marker-end="url(#arrow)"/><text x="565.0" y="576.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">10. PUT /internal/servers/{slug}: full state</text><text x="565.0" y="576.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#202124">10. PUT /internal/servers/{slug}: full state</text><path d="M850,615 L884,615 L884,633 L852,633" fill="none" stroke="#3c4043" stroke-width="1.5" marker-end="url(#arrow)"/><text x="892.0" y="623.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">11. build new hub, swap it in,</text><text x="892.0" y="623.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#202124">11. build new hub, swap it in,</text><text x="892.0" y="637.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">close the old one</text><text x="892.0" y="637.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#202124">close the old one</text><line x1="850" y1="667" x2="280" y2="667" stroke="#3c4043" stroke-width="1.5" stroke-dasharray="6,4"/><path d="M290,661 L280,667 L290,673" fill="none" stroke="#3c4043" stroke-width="1.6" stroke-linejoin="round"/><text x="565.0" y="660.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">12. applied generation, per-target status</text><text x="565.0" y="660.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#202124">12. applied generation, per-target status</text><line x1="280" y1="703" x2="1040" y2="703" stroke="#3c4043" stroke-width="1.5" marker-end="url(#arrow)"/><text x="660.0" y="696.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">13. health check, tool refresh, security scan</text><text x="660.0" y="696.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#202124">13. health check, tool refresh, security scan</text><line x1="280" y1="739" x2="90" y2="739" stroke="#3c4043" stroke-width="1.5" stroke-dasharray="6,4"/><path d="M100,733 L90,739 L100,745" fill="none" stroke="#3c4043" stroke-width="1.6" stroke-linejoin="round"/><text x="185.0" y="732.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">14. 201: tool names, sync_status applied</text><text x="185.0" y="732.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#202124">14. 201: tool names, sync_status applied</text><rect x="20" y="761" width="1090" height="27" rx="4" fill="#fffde7" stroke="#f9ab00" stroke-width="1.2"/><text x="565.0" y="777.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043" font-style="italic">If the push or refresh passes the 45 s budget: 201 with sync_status pending; the reconciler finishes.</text></svg>
