ca, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043" font-style="italic">10 servers x 10 targets: all serving again within 23 s. A full pass also runs every 60 s and at registry startup.</text></svg>
