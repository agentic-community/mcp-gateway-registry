<svg xmlns="http://www.w3.org/2000/svg" width="830" height="752" viewBox="0 0 830 752"><title>Checks on every backend call, in order</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3c4043" stroke-dasharray="none"/></marker><marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#3c4043" stroke-width="1.5" stroke-dasharray="none"/></marker></defs><rect x="0" y="0" width="830" height="752" fill="#ffffff"/><text x="415.0" y="30.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#202124">Checks on every backend call, in order</text><rect x="60" y="60" width="380" height="62" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.8"/><text x="250.0" y="80.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">1. dispatcher</text><text x="250.0" y="99.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">keeps only MCP headers; holds the</text><text x="250.0" y="115.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">per-user envelope back from FastMCP</text><path d="M250,122 L250,144" fill="none" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M440,91 L540,91" fill="none" stroke="#c5221f" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow)"/><rect x="60" y="144" width="380" height="62" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.8"/><text x="250.0" y="164.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">2. envelope (per-user targets)</text><text x="250.0" y="183.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">signature, slug, 60 s expiry, single use;</text><text x="250.0" y="199.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">a missing key is an error</text><path d="M250,206 L250,228" fill="none" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M440,175 L540,175" fill="none" stroke="#c5221f" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow)"/><rect x="60" y="228" width="380" height="62" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.8"/><text x="250.0" y="248.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">3. hub</text><text x="250.0" y="267.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">refuses arguments the</text><text x="250.0" y="283.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">spec does not define</text><path d="M250,290 L250,312" fill="none" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M440,259 L540,259" fill="none" stroke="#c5221f" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow)"/><rect x="60" y="312" width="380" height="62" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.8"/><text x="250.0" y="332.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">4. destination check</text><text x="250.0" y="351.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">same origin and under base_url, no '..';</text><text x="250.0" y="367.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">HTTPS when a key is sent</text><path d="M250,374 L250,396" fill="none" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M440,343 L540,343" fill="none" stroke="#c5221f" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow)"/><rect x="60" y="396" width="380" height="62" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.8"/><text x="250.0" y="416.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">5. credential</text><text x="250.0" y="435.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">shared key, or the caller's own;</text><text x="250.0" y="451.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">never a fallback between them</text><path d="M250,458 L250,480" fill="none" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M440,427 L540,427" fill="none" stroke="#c5221f" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow)"/><rect x="60" y="480" width="380" height="62" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.8"/><text x="250.0" y="500.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">6. SSRF guard</text><text x="250.0" y="519.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">resolves, checks the IP class,</text><text x="250.0" y="535.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">pins the connection</text><path d="M250,542 L250,564" fill="none" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M440,511 L540,511" fill="none" stroke="#c5221f" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow)"/><rect x="60" y="564" width="380" height="62" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.8"/><text x="250.0" y="584.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">7. request</text><text x="250.0" y="603.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">Accept-Encoding: identity,</text><text x="250.0" y="619.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">no cookie jar</text><path d="M250,626 L250,648" fill="none" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M440,595 L540,595" fill="none" stroke="#c5221f" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow)"/><rect x="60" y="648" width="380" height="62" rx="8" fill="#fce8e6" stroke="#c5221f" stroke-width="1.8"/><text x="250.0" y="668.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">8. response</text><text x="250.0" y="687.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">refuses compressed bodies, 2 MiB cap,</text><text x="250.0" y="703.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">drops Set-Cookie, redacts echoed keys</text><path d="M440,679 L540,679" fill="none" stroke="#c5221f" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow)"/><rect x="540" y="60" width="230" height="650" rx="8" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.8"/><text x="655.0" y="342.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">refused</text><text x="655.0" y="361.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">A failed check ends the</text><text x="655.0" y="377.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">call: an HTTP error before</text><text x="655.0" y="393.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">the hub, a tool error</text><text x="655.0" y="409.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">after it. Steps 1 to 6</text><text x="655.0" y="425.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">run before the container</text><text x="655.0" y="441.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">sends anything.</text></svg>
