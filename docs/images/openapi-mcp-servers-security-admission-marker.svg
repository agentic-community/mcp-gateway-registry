<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="545" viewBox="0 0 1240 545"><title>The admission marker on every hub call</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3c4043" stroke-dasharray="none"/></marker><marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#3c4043" stroke-width="1.5" stroke-dasharray="none"/></marker></defs><rect x="0" y="0" width="1240" height="545" fill="#ffffff"/><text x="620.0" y="30.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#202124">The admission marker on every hub call</text><rect x="40" y="80" width="230" height="66" rx="8" fill="#fff4e5" stroke="#e8710a" stroke-width="1.8"/><text x="155.0" y="110.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">Agent</text><text x="155.0" y="129.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">/&lt;slug&gt;/mcp</text><rect x="40" y="186" width="230" height="66" rx="8" fill="#fff4e5" stroke="#e8710a" stroke-width="1.8"/><text x="155.0" y="216.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">Agent, virtual server</text><text x="155.0" y="235.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">a tool backed by /&lt;slug&gt;</text><rect x="40" y="292" width="230" height="66" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.8"/><text x="155.0" y="314.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">Registry</text><text x="155.0" y="333.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">health check, tool refresh,</text><text x="155.0" y="349.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">security scan</text><rect x="40" y="398" width="230" height="80" rx="8" fill="#fce8e6" stroke="#c5221f" stroke-width="1.8"/><text x="155.0" y="427.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">Ordinary server pointed</text><text x="155.0" y="446.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">at the container's IP</text><text x="155.0" y="462.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">or another DNS name</text><rect x="330" y="80" width="250" height="66" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.8"/><text x="455.0" y="110.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">nginx: owned location</text><text x="455.0" y="129.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">sets the slug's marker</text><rect x="330" y="186" width="250" height="66" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.8"/><text x="455.0" y="216.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">nginx: virtual backend</text><text x="455.0" y="235.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">sets the backing slug's marker</text><rect x="330" y="292" width="250" height="66" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.8"/><text x="455.0" y="322.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">registry client</text><text x="455.0" y="341.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">adds the marker for the own hub</text><rect x="330" y="398" width="250" height="80" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.8"/><text x="455.0" y="427.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">nginx: ordinary location</text><text x="455.0" y="446.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">sends the header empty; a</text><text x="455.0" y="462.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">client cannot compute one</text><rect x="640" y="80" width="230" height="66" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.8"/><text x="755.0" y="110.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">auth server hop</text><text x="755.0" y="129.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">forwards the header as is</text><rect x="640" y="398" width="230" height="80" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.8"/><text x="755.0" y="427.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">auth server hop</text><text x="755.0" y="446.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">forwards an empty</text><text x="755.0" y="462.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">header: none</text><rect x="930" y="186" width="270" height="190" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.8"/><text x="1065.0" y="238.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">openapi-mcp dispatcher</text><text x="1065.0" y="257.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">before anything else:</text><text x="1065.0" y="273.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">marker == HMAC(key from</text><text x="1065.0" y="289.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">the sync secret, slug)?</text><text x="1065.0" y="305.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043"></text><text x="1065.0" y="321.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">yes: on to the hub</text><text x="1065.0" y="337.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">no: 401, nothing runs</text><path d="M270,113 L330,113" fill="none" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M270,219 L330,219" fill="none" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M270,325 L330,325" fill="none" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M270,438 L330,438" fill="none" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M580,113 L640,113" fill="none" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/><text x="610.0" y="105.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">marker</text><text x="610.0" y="105.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#202124">marker</text><path d="M870,113 L900,113 L900,220 L930,220" fill="none" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M580,240 L930,240" fill="none" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/><text x="755.0" y="232.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">marker</text><text x="755.0" y="232.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#202124">marker</text><path d="M580,325 L900,325 L900,300 L930,300" fill="none" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/><text x="740.0" y="317.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">marker</text><text x="740.0" y="317.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#202124">marker</text><path d="M580,438 L640,438" fill="none" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M870,438 L1065,438 L1065,376" fill="none" stroke="#c5221f" stroke-width="1.6" marker-end="url(#arrow)"/><text x="965.0" y="430.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">no marker: 401</text><text x="965.0" y="430.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#202124">no marker: 401</text><rect x="40" y="510" width="16" height="12" rx="3" fill="#e6f4ea" stroke="#188038"/><text x="62.0" y="520.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#3c4043">gateway</text><rect x="190" y="510" width="16" height="12" rx="3" fill="#e8f0fe" stroke="#1a73e8"/><text x="212.0" y="520.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#3c4043">registry</text><rect x="340" y="510" width="16" height="12" rx="3" fill="#f3e8fd" stroke="#8430ce"/><text x="362.0" y="520.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#3c4043">container</text><rect x="490" y="510" width="16" height="12" rx="3" fill="#fce8e6" stroke="#c5221f"/><text x="512.0" y="520.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#3c4043">attempted bypass</text></svg>
