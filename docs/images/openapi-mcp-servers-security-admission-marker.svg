' + slug)?</text><text x="860.0" y="305.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043"></text><text x="860.0" y="321.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">yes: on to the hub</text><text x="860.0" y="337.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">no: 401, nothing runs</text><path d="M270,113 L360,113" fill="none" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M270,219 L360,219" fill="none" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M270,325 L360,325" fill="none" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M270,438 L360,438" fill="none" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M620,113 L680,113 L680,220 L720,220" fill="none" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/><text x="650.0" y="105.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">marker</text><text x="650.0" y="105.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#202124">marker</text><path d="M620,240 L720,240" fill="none" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/><text x="670.0" y="232.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">marker</text><text x="670.0" y="232.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#202124">marker</text><path d="M620,325 L680,325 L680,280 L720,280" fill="none" stroke="#3c4043" stroke-w