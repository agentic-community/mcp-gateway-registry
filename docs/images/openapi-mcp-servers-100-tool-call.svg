<svg xmlns="http://www.w3.org/2000/svg" width="840" height="429" viewBox="0 0 840 429"><title>What happens when an agent calls a tool</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3c4043" stroke-dasharray="none"/></marker><marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#3c4043" stroke-width="1.5" stroke-dasharray="none"/></marker></defs><rect x="0" y="0" width="840" height="429" fill="#ffffff"/><text x="420.0" y="30.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#202124">What happens when an agent calls a tool</text><line x1="90" y1="102" x2="90" y2="405" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="4,4"/><rect x="5.0" y="60" width="170" height="42" rx="7" fill="#fff4e5" stroke="#e8710a" stroke-width="1.8"/><text x="90.0" y="86.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#202124">Agent</text><line x1="310" y1="102" x2="310" y2="405" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="4,4"/><rect x="225.0" y="60" width="170" height="42" rx="7" fill="#e6f4ea" stroke="#188038" stroke-width="1.8"/><text x="310.0" y="86.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#202124">Gateway</text><line x1="530" y1="102" x2="530" y2="405" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="4,4"/><rect x="445.0" y="60" width="170" height="42" rx="7" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.8"/><text x="530.0" y="79.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#202124">openapi-mcp</text><text x="530.0" y="93.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#202124">container</text><line x1="750" y1="102" x2="750" y2="405" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="4,4"/><rect x="665.0" y="60" width="170" height="42" rx="7" fill="#fce8e6" stroke="#c5221f" stroke-width="1.8"/><text x="750.0" y="86.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#202124">REST API</text><line x1="90" y1="136" x2="310" y2="136" stroke="#3c4043" stroke-width="1.5" marker-end="url(#arrow)"/><text x="200.0" y="129.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">1. call weather_getForecast</text><text x="200.0" y="129.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#202124">1. call weather_getForecast</text><path d="M310,168 L344,168 L344,186 L312,186" fill="none" stroke="#3c4043" stroke-width="1.5" marker-end="url(#arrow)"/><text x="352.0" y="176.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">2. is this agent allowed?</text><text x="352.0" y="176.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#202124">2. is this agent allowed?</text><line x1="310" y1="210" x2="530" y2="210" stroke="#3c4043" stroke-width="1.5" marker-end="url(#arrow)"/><text x="420.0" y="203.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">3. forward the call</text><text x="420.0" y="203.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#202124">3. forward the call</text><line x1="530" y1="246" x2="750" y2="246" stroke="#3c4043" stroke-width="1.5" marker-end="url(#arrow)"/><text x="640.0" y="239.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">4. GET /v1/forecast, with the API key</text><text x="640.0" y="239.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#202124">4. GET /v1/forecast, with the API key</text><line x1="750" y1="282" x2="530" y2="282" stroke="#3c4043" stroke-width="1.5" stroke-dasharray="6,4"/><path d="M540,276 L530,282 L540,288" fill="none" stroke="#3c4043" stroke-width="1.6" stroke-linejoin="round"/><text x="640.0" y="275.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">5. JSON response</text><text x="640.0" y="275.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#202124">5. JSON response</text><line x1="530" y1="318" x2="90" y2="318" stroke="#3c4043" stroke-width="1.5" stroke-dasharray="6,4"/><path d="M100,312 L90,318 L100,324" fill="none" stroke="#3c4043" stroke-width="1.6" stroke-linejoin="round"/><text x="310.0" y="311.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" fill="#ffffff">6. tool result</text><text x="310.0" y="311.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#202124">6. tool result</text><rect x="20" y="340" width="800" height="27" rx="4" fill="#fffde7" stroke="#f9ab00" stroke-width="1.2"/><text x="420.0" y="356.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043" font-style="italic">The agent never sees the API key. The container adds it.</text></svg>
