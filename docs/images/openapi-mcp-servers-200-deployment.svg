routes, the reconciler and the guard identity.</text><path d="M270,260 L270,230 L165,230 L165,200" fill="none" stroke="#3c4043" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow)"/><path d="M445,260 L445,200" fill="none" stroke="#3c4043" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow)"/><path d="M725,260 L725,200" fill="none" stroke="#3c4043" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow)"/><path d="M900,260 L900,230 L1005,230 L1005,200" fill="none" stroke="#3c4043" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow)"/></svg>
