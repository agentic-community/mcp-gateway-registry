<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="400" viewBox="0 0 1170 400"><title>Deployment surfaces</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3c4043" stroke-dasharray="none"/></marker><marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#3c4043" stroke-width="1.5" stroke-dasharray="none"/></marker></defs><rect x="0" y="0" width="1170" height="400" fill="#ffffff"/><text x="585.0" y="30.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#202124">Deployment surfaces</text><rect x="40" y="80" width="250" height="120" rx="8" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.8"/><text x="165.0" y="105.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">Docker Compose</text><text x="165.0" y="124.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">service openapi-mcp,</text><text x="165.0" y="140.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">profile openapi-mcp,</text><text x="165.0" y="156.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">port on 127.0.0.1 only,</text><text x="165.0" y="172.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">build_and_run.sh adds</text><text x="165.0" y="188.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">the profile</text><rect x="320" y="80" width="250" height="120" rx="8" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.8"/><text x="445.0" y="113.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">Amazon ECS (Terraform)</text><text x="445.0" y="132.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">service behind count = flag,</text><text x="445.0" y="148.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">Service Connect name</text><text x="445.0" y="164.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">openapi-mcp, ingress from</text><text x="445.0" y="180.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">registry SG only</text><rect x="600" y="80" width="250" height="120" rx="8" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.8"/><text x="725.0" y="121.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">CDK</text><text x="725.0" y="140.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">McpServerService, created</text><text x="725.0" y="156.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">when the flag is on and</text><text x="725.0" y="172.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#3c4043">an image is set</text><rect x="880" y="80" width="250" height="120" rx="8" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.8"/><text x="1005.0" y="113.0" font-family="DejaVu Sans, Helvetic